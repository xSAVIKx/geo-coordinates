,"topic.practice":`Practise`,"topic.prev":`Previous topic: {title}`,"topic.next":`Next topic: {title}`,"topic.soon":`This topic is coming soon.`,"explore.progress":`Step {n} of {total}`,"explore.prev":`Previous`,"explore.next":`Next`,"explore.goto":`Go to step {n}`,"explore.practiceNow":`Practise this topic`,"explore.keysHint":`Tip: use ← and → keys to change steps.`,"topic.1.title":`The globe grid`,"topic.1.summary":`Meridians, parallels, the equator and hemispheres`,"topic.2.title":`Where is it?`,"topic.2.summary":`North or south of a parallel, east or west of a meridian`,"topic.3.title":`Reading coordinates`,"topic.3.summary":`Find the latitude and longitude of a point`,"topic.4.title":`Finding a place`,"topic.4.summary":`Put a point on the map from its coordinates`,"topic.5.title":`Degrees and minutes`,"topic.5.summary":`One degree has 60 minutes`,"topic.6.title":`How many degrees apart?`,"topic.6.summary":`Differences in latitude and longitude`,"topic.7.title":`Distance along a meridian`,"topic.7.summary":`One degree is about 111.2 km`,"topic.8.title":`Longitude and time`,"topic.8.summary":`Day, night and local solar time`,"topic.1.step.ball.title":`The Earth is a ball`,"topic.1.step.ball.body":`To say exactly where a place is on a ball, we draw an imaginary grid on it. The grid has two kinds of lines: parallels and meridians. Drag the globe to turn it.`,"topic.1.step.equator.title":`The equator`,"topic.1.step.equator.body":`The equator goes around the middle of the Earth. It is the longest parallel and its latitude is 0°. It divides the Earth into the Northern Hemisphere and the Southern Hemisphere.`,"topic.1.step.parallels.title":`Parallels`,"topic.1.step.parallels.body":`Parallels are circles that run parallel to the equator. The closer to a pole, the shorter they are. They tell us the latitude: from 0° at the equator up to 90°N at the North Pole or 90°S at the South Pole.`,"topic.1.step.angle.title":`Why degrees?`,"topic.1.step.angle.body":`Latitude is an angle! Imagine a line from the centre of the Earth to a place. The angle between that line and the equator is the latitude. Drag the point on the circle and watch the angle change.`,"topic.1.step.meridians.title":`Meridians`,"topic.1.step.meridians.body":`Meridians are half-circles that join the North Pole and the South Pole. All meridians are the same length. They tell us the longitude.`,"topic.1.step.prime.title":`The prime meridian and 180°`,"topic.1.step.prime.body":`The prime meridian (0°) goes through Greenwich in London. On the other side of the Earth is the 180° meridian. Together they divide the Earth into the Eastern and Western Hemispheres. Longitude goes from 0° up to 180°E or 180°W.`,"topic.1.step.projections.title":`Many maps, one grid`,"topic.1.step.projections.body":`A flat map is always a little stretched, because the Earth is round. This map is called Equal Earth: every country keeps its true size, so the meridians bend. The coordinates stay the same on every map. Try the Grid map in the Lab to compare.`,"topic.1.step.tropics.title":`Tropics and polar circles`,"topic.1.step.tropics.body":`Some parallels have their own names: the Tropic of Cancer (about 23°N), the Tropic of Capricorn (about 23°S), the Arctic Circle (about 66°N) and the Antarctic Circle (about 66°S).`,"topic.1.step.play.title":`Try it yourself`,"topic.1.step.play.body":`Drag the point around. When is it in the Northern Hemisphere? When is it in the Western Hemisphere? Find the Tropic of Cancer.`,"topic.2.step.north-south.title":`North or south?`,"topic.2.step.north-south.body":`On a map, north is at the top. Warsaw (52°N) is north of the 50°N parallel. Rome (42°N) is south of it. In the Northern Hemisphere a bigger number means further north.`,"topic.2.step.southern.title":`Careful in the south!`,"topic.2.step.southern.body":`In the Southern Hemisphere a bigger number means further south. 40°S is south of 20°S, and 10°S is north of it.`,"topic.2.step.east-west.title":`East or west?`,"topic.2.step.east-west.body":`East is to the right on a map. Kyiv (31°E) is east of the 20°E meridian. London (0°) is west of it. In the Eastern Hemisphere a bigger number means further east.`,"topic.2.step.western.title":`Careful in the west!`,"topic.2.step.western.body":`In the Western Hemisphere a bigger number means further west. 100°W is west of 60°W, and 30°W is east of it.`,"topic.2.step.across-zero.title":`Across the lines`,"topic.2.step.across-zero.body":`Every place with N latitude is north of every place with S latitude. Every place with E longitude is east of Greenwich, and every place with W longitude is west of it.`,"topic.2.step.play.title":`Try it yourself`,"topic.2.step.play.body":`Move the point and say it out loud: is it north or south of the equator? East or west of Greenwich? Then check the coordinates below the map.`,"topic.3.step.address.title":`An address in two numbers`,"topic.3.step.address.body":`Coordinates are written as latitude first, then longitude: 52°N, 21°E. That is Warsaw!`,"topic.3.step.latitude.title":`Step 1: latitude`,"topic.3.step.latitude.body":`Find the parallel that goes through the point and read its number at the left edge of the map. Is the point above the equator (N) or below it (S)?`,"topic.3.step.longitude.title":`Step 2: longitude`,"topic.3.step.longitude.body":`Now find the meridian that goes through the point and read its number at the bottom edge. Is the point right of Greenwich (E) or left of it (W)?`,"topic.3.step.answer.title":`Put it together`,"topic.3.step.answer.body":`The point lies on the 30°N parallel and on the 30°E meridian. Its coordinates are 30°N, 30°E — very close to Cairo.`,"topic.3.step.between.title":`Between the lines`,"topic.3.step.between.body":`If a point lies between two lines, count the degrees. Halfway between 40° and 50° is 45°.`,"topic.3.step.southwest.title":`South and west`,"topic.3.step.southwest.body":`Try this point yourself: which parallel and which meridian go through it? Remember the letters S and W. (Answer: 30°S, 60°W.)`,"topic.3.step.globe.title":`On the globe`,"topic.3.step.globe.body":`The grid works the same way on the globe. Turn the globe to find the point near Sydney: 34°S, 151°E.`,"topic.3.step.play.title":`Try it yourself`,"topic.3.step.play.body":`Drag the point, say its coordinates out loud, then check the answer below the map.`,"topic.4.step.plan.title":`From numbers to a place`,"topic.4.step.plan.body":`Let's find 50°N, 30°E. First find the parallel: 50°N.`,"topic.4.step.meridian.title":`Then the meridian`,"topic.4.step.meridian.body":`Now find the meridian 30°E. Remember: E means to the right of Greenwich.`,"topic.4.step.cross.title":`Where the lines cross`,"topic.4.step.cross.body":`The place is where the two lines cross. It is Kyiv!`,"topic.4.step.letters.title":`Letters matter`,"topic.4.step.letters.body":`34°S, 151°E is Sydney. But 34°N, 151°W is in the middle of the Pacific Ocean! Always check N or S and E or W.`,"topic.4.step.play.title":`Try it yourself`,"topic.4.step.play.body":`Drag the point to find places, or pick a city from the list and check its coordinates.`,"mode.rehearsal.title":`Test rehearsal`,"mode.rehearsal.summary":`15 mixed questions, like a real test`,"mode.classQuiz.title":`Class quiz`,"mode.classQuiz.summary":`Big questions on the big screen for the whole class`,"mode.lab.title":`Day and night lab`,"mode.lab.summary":`Move the Sun and watch the time change`,"lab.intro":`Move the point anywhere on Earth and watch its coordinates change.`,"footer.madeBy":`Made by {name}`,"footer.mapData":`Map data: {source}`,"footer.label":`About this page`,"map.stage":`Map`,"map.chooseView":`Choose view`,"map.view.globe":`Globe`,"map.view.flat":`Map`,"map.view.cross-section":`Cross-section`,"map.flat.label":`World map with parallels and meridians`,"map.flat.hint":`Arrow keys move the point (Shift: 10 times further). Plus and minus zoom.`,"map.zoomIn":`Zoom in`,"map.zoomOut":`Zoom out`,"map.zoomHint":`Hold Ctrl and s l 0°. It runs around the middle of the Earth.`,"q.nameLine.explain.prime":`The prime meridian is 0°. It goes through Greenwich in London.`,"q.nameLine.explain.antimeridian":`The 180° meridian is on the opposite side of the Earth from Greenwich.`,"q.nameLine.explain.parallel":`This is the parallel {value}. Parallels are circles parallel to the equator.`,"q.nameLine.explain.meridian":`This is the meridian {value}. Meridians join the North Pole and the South Pole.`,"q.nameLine.explain.tropicCancer":`The Tropic of Cancer is the parallel at about 23½°N.`,"q.nameLine.explain.tropicCapricorn":`The Tropic of Capricorn is the parallel at about 23½°S.`,"q.nameLine.explain.arcticCircle":`The Arctic Circle is the parallel at about 66½°N.`,"q.nameLine.explain.antarcticCircle":`The Antarctic Circle is the parallel at about 66½°S.`,"q.nameLine.explainHemi.N":`The Northern Hemisphere is everything north of the equator.`,"q.nameLine.explainHemi.S":`The Southern Hemisphere is everything south of the equator.`,"q.nameLine.explainHemi.E":`The Eastern Hemisphere is everything east of the prime meridian, up to 180°.`,"q.nameLine.explainHemi.W":`The Western Hemisphere is everything west of the prime meridian, up to 180°.`,"q.nameLine.explainPoint":`Point A is at {coords}, so it is in the {nsHemi} and {ewHemi} hemispheres.`,"q.nameLine.hemiAdj.N":`Northern`,"q.nameLine.hemiAdj.S":`Southern`,"q.nameLine.hemiAdj.E":`Eastern`,"q.nameLine.hemiAdj.W":`Western`,"q.dirWord.N":`north`,"q.dirWord.S":`south`,"q.dirWord.E":`east`,"q.dirWord.W":`west`,"q.further.prompt.N":`Which point lies furthest north?`,"q.further.prompt.S":`Which point lies furthest south?`,"q.further.prompt.E":`Which point lies furthest east?`,"q.further.prompt.W":`Which point lies furthest west?`,"q.further.option":`Point {label}: {coord}`,"q.further.explain":`Point {label} ({coord}) lies furthest {dir}. {rule}`,"q.further.explain2":`Point {label} ({coord}) lies furthest {dir}. {rule} {rule2}`,"q.further.mistake.opposite":`That point lies furthest {dir} — the opposite direction!`,"q.rule.mixed.lat":`Any place with N latitude is north of any place with S latitude.`,"q.rule.mixed.lon":`Any place with E longitude is east of any place with W longitude (as long as we do not cross the 180° meridian).`,"q.rule.bigger.N":`In the Northern Hemisphere, a bigger number means further north.`,"q.rule.bigger.S":`In the Southern Hemisphere, a bigger number means further south.`,"q.rule.bigger.E":`In the Eastern Hemisphere, a bigger number means further east.`,"q.rule.bigger.W":`In the Western Hemisphere, a bigger number means further west.`,"q.rule.zero.lat":`Places with N latitude lie north of the equator (0°), places with S latitude lie south of it.`,"q.rule.zero.lon":`Places with E longitude lie east of the prime meridian (0°), places with W longitude lie west of it.`,"q.relative.prompt.lat":`Is point A ({point}) north or south of the parallel {line}?`,"q.relative.prompt.lon":`Is point A ({point}) east or west of the meridian {line}?`,"q.opt.north":`North of it`,"q.opt.south":`South of it`,"q.opt.east":`East of it`,"q.opt.west":`West of it`,"q.relative.explain.lat":`Point A has latitude {value} and the parallel is {line}, so the point lies {dir} of the parallel. {rule}`,"q.relative.explain.lon":`Point A has longitude {value} and the meridian is {line}, so the point lies {dir} of the meridian. {rule}`,"q.read.prompt":`What are the coordinates of the point?`,"q.read.explain":`The point lies on the parallel {lat} and on the meridian {lon}, so its coordinates are {coords}.`,"q.place.prompt":`Move the point to {coords}.`,"q.place.explain":`First find the parallel {lat}, then the meridian {lon}. The point goes where they cross.`,"q.which.prompt":`Which marker is at {coords}?`,"q.which.option":`Marker {label}`,"q.which.explain":`Marker {label} is at {coords}. That is {place}!`,"q.answer.coords":`{coords}`,"q.mistake.nsLetter":`Check the letter: N means north of the equator, S means south of it.`,"q.mistake.ewLetter":`Check the letter: E means east of Greenwich, W means west of it.`,"q.mistake.bothLetters":`Both letters are the wrong way round. N or S says up or down, E or W says right or left.`,"q.mistake.swapped":`Latitude and longitude are swapped. Latitude (N or S) always comes first.`,"q.mistake.minutes":`Close! Check the minutes: 30′ is half a degree and 15′ is a quarter of a degree.`,"practice.difficulty":`Difficulty`,"difficulty.easy":`Easy`,"difficulty.medium":`Medium`,"difficulty.hard":`Hard`,"practice.progress":`Question {n} of {total}`,"practice.check":`Check`,"practice.next":`Next question`,"practice.results":`See results`,"practice.correct":`Correct!`,"practice.incorrect":`Not quite`,"practice.correctAnswer":`Correct answer: {answer}`,"practice.done":`Round complete`,"practice.score":`You got {score} out of {total}`,"practice.best":`Your best: {best} out of {total}`,"practice.newRound":`New round`,"practice.harder":`Try harder questions`,"practice.review":`Your answers`,"practice.backToLearn":`Back to learning`,"practice.needAnswer":`Choose or enter an answer first.`,"practice.resultCorrect":`correct`,"practice.resultWrong":`wrong`,"input.chooseOne":`Choose one answer`,"input.lat":`Latitude`,"input.lon":`Longitude`,"input.example":`For example: {example}`,"input.invalid":`Write it like this: {example}`,"input.usePoint":`Move the point on the map (or use the sliders), then press Check.`,"input.number":`Your answer`,"input.numberInvalid":`Enter a number, for example 25`,"unit.label.deg":`°`,"unit.label.km":`km`,"unit.label.h":`h`,"unit.label.min":`min`},Bi={"app.title":`Współrzędne na kuli ziemskiej`,"app.skip":`Przejdź do treści`,"unit.degree#one":`{count} stopień`,"unit.degree#few":`{count} stopnie`,"unit.degree#many":`{count} stopni`,"unit.degree#other":`{count} stopnia`,"unit.minute#one":`{count} minuta`,"unit.minute#few":`{count} minuty`,"unit.minute#many":`{count} minut`,"unit.minute#other":`{count} minuty`,"dir.north":`na północ`,"dir.south":`na południe`,"dir.east":`na wschód`,"dir.west":`na zachód`,"spoken.lat":`{amount} {dir}`,"spoken.lon":`{amount} {dir}`,"spoken.zero":`{amount}`,"header.language":`Język`,"header.settings":`Ustawienia`,"header.home":`Strona główna`,"settings.title":`Ustawienia`,"settings.theme":`Motyw kolorów`,"settings.theme.system":`Jak w urządzeniu`,"settings.theme.light":`Jasny`,"settings.theme.dark":`Ciemny`,"settings.largeText":`Większy tekst`,"settings.reducedMotion":`Ogranicz animacje`,"settings.close":`Zamknij`,"home.intro":`Każde miejsce na Ziemi ma swój adres z dwóch liczb: szerokości i długości geograficznej. Nauczmy się go czytać!`,"home.topics":`Tematy`,"home.more":`Sprawdź się i odkrywaj`,"home.explore":`Poznaj`,"home.practice":`Ćwicz`,"topic.nav":`Części tematu`,"topic.explore":`Poznaj`,"topic.practice":`Ćwicz`,"topic.prev":`Poprzedni temat: {title}`,"topic.next":`Następny temat: {title}`,"topic.soon":`Ten temat już wkrótce.`,"explore.progress":`Krok {n} z {total}`,"explore.prev":`Wstecz`,"explore.next":`Dalej`,"explore.goto":`Przejdź do kroku {n}`,"explore.practiceNow":`Poćwicz ten temat`,"explore.keysHint":`Wskazówka: klawisze ← i → zmieniają kroki.`,"topic.1.title":`Siatka geograficzna`,"topic.1.summary":`Południki, równoleżniki, równik i półkule`,"topic.2.title":`Gdzie to jest?`,"topic.2.summary":`Na północ czy na południe od równoleżnika, na wschód czy na zachód od południka`,"topic.3.title":`Odczytywanie współrzędnych`,"topic.3.summary":`Odczytaj szerokość i długość geograficzną punktu`,"topic.4.title":`Szukanie miejsca`,"topic.4.summary":`Zaznacz punkt na mapie według współrzędnych`,"topic.5.title":`Stopnie i minuty`,"topic.5.summary":`Jeden stopień ma 60 minut`,"topic.6.title":`Ile stopni różnicy?`,"topic.6.summary":`Różnica szerokości i długości geograficznej`,"topic.7.title":`Odległość wzdłuż południka`,"topic.7.summary":`Jeden stopień to około 111,2 km`,"topic.8.title":`Długość geograficzna a czas`,"topic.8.summary":`Dzień, noc i czas słoneczny`,"topic.1.step.ball.title":`Ziemia jest kulą`,"topic.1.step.ball.body":`Aby dokładnie określić miejsce na kuli, rysujemy na niej wyobrażoną siatkę. Siatka ma dwa rodzaje linii: równoleżniki i południki. Przeciągnij globus, aby go obrócić.`,"topic.1.step.equator.title":`Równik`,"topic.1.step.equator.body":`Równik biegnie dookoła środka Ziemi. To najdłuższy równoleżnik, a jego szerokość geograficzna to 0°. Dzieli Ziemię na półkulę północną i południową.`,"topic.1.step.parallels.title":`Równoleżniki`,"topic.1.step.parallels.body":`Równoleżniki to okręgi biegnące równolegle do równika. Im bliżej bieguna, tym są krótsze. Pokazują szerokość geograficzną: od 0° na równiku aż do 90°N na biegunie północnym lub 90°S na biegunie południowym.`,"topic.1.step.angle.title":`Dlaczego stopnie?`,"topic.1.step.angle.body":`Szerokość geograficzna to kąt! Wyobraź sobie linię od środka Ziemi do miejsca. Kąt między tą linią a równikiem to szerokość geograficzna. Przeciągnij punkt na okręgu i obserwuj, jak zmienia się kąt.`,"topic.1.step.meridians.title":`Południki`,"topic.1.step.meridians.body":`Południki to półokręgi łączące biegun północny z biegunem południowym. Wszystkie południki mają taką samą długość. Pokazują długość geograficzną.`,"topic.1.step.prime.title":`Południk zerowy i 180°`,"topic.1.step.prime.body":`Południk zerowy (0°) przechodzi przez Greenwich w Londynie. Po drugiej stronie Ziemi leży południk 180°. Razem dzielą Ziemię na półkulę wschodnią i zachodnią. Długość geograficzna sięga od 0° do 180°E lub 180°W.`,"topic.1.step.projections.title":`Wiele map, jedna siatka`,"topic.1.step.projections.body":`Płaska mapa jest zawsze trochę rozciągnięta, bo Ziemia jest okrągła. Ta mapa nazywa się Equal Earth: każdy kraj zachowuje swój prawdziwy rozmiar, dlatego południki są wygięte. Współrzędne są takie same na każdej mapie. Porównaj z mapą z siatką w Laboratorium.`,"topic.1.step.tropics.title":`Zwrotniki i koła podbiegunowe`,"topic.1.step.tropics.body":`Niektóre równoleżniki mają własne nazwy: Zwrotnik Raka (około 23°N), Zwrotnik Koziorożca (około 23°S), koło podbiegunowe północne (około 66°N) i koło podbiegunowe południowe (około 66°S).`,"topic.1.step.play.title":`Spróbuj sam`,"topic.1.step.play.body":`Przeciągaj punkt w różne miejsca. Kiedy jest na półkuli północnej? Kiedy jest na półkuli zachodniej? Znajdź Zwrotnik Raka.`,"topic.2.step.north-south.title":`Na północ czy na południe?`,"topic.2.step.north-south.body":`Na mapie północ jest u góry. Warszawa (52°N) leży na północ od równoleżnika 50°N. Rzym (42°N) leży na południe od niego. Na półkuli północnej większa liczba oznacza dalej na północ.`,"topic.2.step.southern.title":`Uwaga na południu!`,"topic.2.step.southern.body":`Na półkuli południowej większa liczba oznacza dalej na południe. 40°S leży na południe od 20°S, a 10°S leży na północ od niego.`,"topic.2.step.east-west.title":`Na wschód czy na zachód?`,"topic.2.step.east-west.body":`Wschód jest po prawej stronie mapy. Kijów (31°E) leży na wschód od południka 20°E. Londyn (0°) leży na zachód od niego. Na półkuli wschodniej większa liczba oznacza dalej na wschód.`,"topic.2.step.western.title":`Uwaga na zachodzie!`,"topic.2.step.western.body":`Na półkuli zachodniej większa liczba oznacza dalej na zachód. 100°W leży na zachód od 60°W, a 30°W leży na wschód od niego.`,"topic.2.step.across-zero.title":`Po obu stronach linii`,"topic.2.step.across-zero.body":`Każde miejsce o szerokości N leży na północ od każdego miejsca o szerokości S. Każde miejsce o długości E leży na wschód od Greenwich, a każde miejsce o długości W leży na zachód od niego.`,"topic.2.step.play.title":`Spróbuj sam`,"topic.2.step.play.body":`Przesuń punkt i powiedz na głos: czy jest na północ, czy na południe od równika? Na wschód czy na zachód od Greenwich? Potem sprawdź współrzędne pod mapą.`,"topic.3.step.address.title":`Adres w dwóch liczbach`,"topic.3.step.address.body":`Współrzędne zapisujemy najpierw jako szerokość, potem jako długość geograficzną: 52°N, 21°E. To Warszawa!`,"topic.3.step.latitude.title":`Krok 1: szerokość geograficzna`,"topic.3.step.latitude.body":`Znajdź równoleżnik, który przechodzi przez punkt, i odczytaj jego numer przy lewej krawędzi mapy. Czy punkt leży powyżej równika (N), czy poniżej niego (S)?`,"topic.3.step.longitude.title":`Krok 2: długość geograficzna`,"topic.3.step.longitude.body":`Teraz znajdź południk, który przechodzi przez punkt, i odczytaj jego numer przy dolnej krawędzi mapy. Czy punkt leży na prawo od Greenwich (E), czy na lewo od niego (W)?`,"topic.3.step.answer.title":`Złóż to razem`,"topic.3.step.answer.body":`Punkt leży na równoleżniku 30°N i na południku 30°E. Jego współrzędne to 30°N, 30°E — bardzo blisko Kairu.`,"topic.3.step.between.title":`Między liniami`,"topic.3.step.between.body":`Jeśli punkt leży między dwiema liniami, policz stopnie. W połowie drogi między 40° a 50° jest 45°.`,"topic.3.step.southwest.title":`Południe i zachód`,"topic.3.step.southwest.body":`Spróbuj sam: który równoleżnik i który południk przez niego przechodzą? Pamiętaj o literach S i W. (Odpowiedź: 30°S, 60°W.)`,"topic.3.step.globe.title":`Na globusie`,"topic.3.step.globe.body":`Siatka działa tak samo na globusie. Obróć globus, aby znaleźć punkt w pobliżu Sydney: 34°S, 151°E.`,"topic.3.step.play.title":`Spróbuj sam`,"topic.3.step.play.body":`Przeciągnij punkt, powiedz na głos jego współrzędne, a potem sprawdź odpowiedź pod mapą.`,"topic.4.step.plan.title":`Od liczb do miejsca`,"topic.4.step.plan.body":`Znajdźmy miejsce o współrzędnych 50°N, 30°E. Najpierw znajdź równoleżnik: 50°N.`,"topic.4.step.meridian.title":`Teraz południk`,"topic.4.step.meridian.body":`Teraz znajdź południk 30°E. Pamiętaj: E oznacza na prawo od Greenwich.`,"topic.4.step.cross.title":`Tam, gdzie linie się przecinają`,"topic.4.step.cross.body":`To miejsce leży tam, gdzie przecinają się obie linie. To Kijów!`,"topic.4.step.letters.title":`Litery mają znaczenie`,"topic.4.step.letters.body":`34°S, 151°E to Sydney. Ale 34°N, 151°W to środek Oceanu Spokojnego! Zawsze sprawdzaj N lub S oraz E lub W.`,"topic.4.step.play.title":`Spróbuj sam`,"topic.4.step.play.body":`Przeciągaj punkt, aby znaleźć miejsca, albo wybierz miasto z listy i sprawdź jego współrzędne.`,"mode.rehearsal.title":`Próbny sprawdzian`,"mode.rehearsal.summary":`15 różnych pytań, jak na prawdziwym sprawdzianie`,"mode.classQuiz.title":`Quiz dla klasy`,"mode.classQuiz.summary":`Duże pytania na dużym ekranie dla całej klasy`,"mode.lab.title":`Laboratorium dnia i nocy`,"mode.lab.summary":`Przesuwaj Słońce i patrz, jak zmienia się czas`,"lab.intro":`Przesuń punkt w dowolne miejsce na Ziemi i patrz, jak zmieniają się jego współrzędne.`,"footer.madeBy":`Autor: {name}`,"footer.mapData":`Dane mapy: {source}`,"footer.label":`O tej stronie`,"map.stage":`Mapa`,"map.chooseView":`Wybierz widok`,"map.view.globe":`Globus`,"map.view.flat":`Mapa`,"map.view.cross-section":`Przekrój`,"map.flat.label":`Mapa świata z równoleżnikami i południkami`,"map.flat.hint":`Strzałki przesuwają punkt (Shift: 10 razy dalej). Plus i minus przybliżają.`,"map.zoomIn":`Przybliż`,"map.zoomOut":`Oddal`,"map.zoomHint":`Przytrzymaj Ctrl i przewiń, aby przybliżyć`,"map.preset.world":`Świat`,"map.preset.europe":`Europa`,"map.preset.poland":`Polska`,"map.projection":`Rodzaj mapy`,"map.projection.grid":`Mapa z siatką`,"map.projection.equal-earth":`Equal Earth`,"map.projection.hint":`Mapa z siatką: proste południki, łatwo odczytać współrzędne. Equal Earth: państwa mają prawdziwą wielkość, południki są wygięte.`,"map.globe.label":`Globus, który możesz obracać`,"map.globe.hint":`Przeciągnij, aby obrócić globus. Strzałki przesuwają punkt albo obracają globus, gdy punktu nie można przesuwać. Plus i minus przybliżają; Ctrl i przewijanie też przybliżają.`,"map.globeZoomIn":`Przybliż globus`,"map.globeZoomOut":`Oddal globus`,"map.turnWest":`Obróć globus na zachód`,"map.turnEast":`Obróć globus na wschód`,"map.turnNorth":`Pochyl globus na północ`,"map.turnSouth":`Pochyl globus na południe`,"map.showPoint":`Pokaż punkt` ace.suva":`Suva (Fidżi)`,"place.northpole":`Biegun Północny`,"place.southpole":`Biegun Południowy`,"label.europe":`Europa`,"label.asia":`Azja`,"label.africa":`Afryka`,"label.northamerica":`Ameryka Północna`,"label.southamerica":`Ameryka Południowa`,"label.australia":`Australia`,"label.antarctica":`Antarktyda`,"label.pacific":`Ocean Spokojny`,"label.atlantic":`Ocean Atlantycki`,"label.indian":`Ocean Indyjski`,"label.arctic":`Ocean Arktyczny`,"q.nameLine.prompt":`Jak nazywa się zaznaczona linia?`,"q.nameLine.promptHemi":`Która półkula jest zaznaczona?`,"q.nameLine.promptPoint":`Na których dwóch półkulach leży punkt A?`,"q.opt.equator":`Równik`,"q.opt.prime":`Południk zerowy (Greenwich)`,"q.opt.antimeridian":`Południk 180°`,"q.opt.parallel":`Równoleżnik`,"q.opt.meridian":`Południk`,"q.opt.tropicCancer":`Zwrotnik Raka`,"q.opt.tropicCapricorn":`Zwrotnik Koziorożca`,"q.opt.arcticCircle":`Koło podbiegunowe północne`,"q.opt.antarcticCircle":`Koło podbiegunowe południowe`,"q.opt.pair.NE":`Na północnej i wschodniej`,"q.opt.pair.NW":`Na północnej i zachodniej`,"q.opt.pair.SE":`Na południowej i wschodniej`,"q.opt.pair.SW":`Na południowej i zachodniej`,"q.nameLine.explain.equator":`Równik to równoleżnik 0°. Biegnie dookoła Ziemi, dokładnie przez jej środek.`,"q.nameLine.explain.prime":`Południk zerowy to południk 0°. Przechodzi przez Greenwich w Londynie.`,"q.nameLine.explain.antimeridian":`Południk 180° leży po przeciwnej stronie Ziemi niż Greenwich.`,"q.nameLine.explain.parallel":`To równoleżnik {value}. Równoleżniki to okręgi równoległe do równika.`,"q.nameLine.explain.meridian":`To południk {value}. Południki łączą Biegun Północny z Biegunem Południowym.`,"q.nameLine.explain.tropicCancer":`Zwrotnik Raka to równoleżnik około 23,5°N.`,"q.nameLine.explain.tropicCapricorn":`Zwrotnik Koziorożca to równoleżnik około 23,5°S.`,"q.nameLine.explain.arcticCircle":`Koło podbiegunowe północne to równoleżnik około 66,5°N.`,"q.nameLine.explain.antarcticCircle":`Koło podbiegunowe południowe to równoleżnik około 66,5°S.`,"q.nameLine.explainHemi.N":`Półkula północna to wszystko, co leży na północ od równika.`,"q.nameLine.explainHemi.S":`Półkula południowa to wszystko, co leży na południe od równika.`,"q.nameLine.explainHemi.E":`Półkula wschodnia to wszystko, co leży na wschód od południka zerowego, aż do 180°.`,"q.nameLine.explainHemi.W":`Półkula zachodnia to wszystko, co leży na zachód od południka zerowego, aż do 180°.`,"q.nameLine.explainPoint":`Punkt A ma współrzędne {coords}, więc leży na półkulach: {nsHemi} i {ewHemi}.`,"q.nameLine.hemiAdj.N":`północnej`,"q.nameLine.hemiAdj.S":`południowej`,"q.nameLine.hemiAdj.E":`wschodniej`,"q.nameLine.hemiAdj.W":`zachodniej`,"q.dirWord.N":`na północ`,"q.dirWord.S":`na południe`,"q.dirWord.E":`na wschód`,"q.dirWord.W":`na zachód`,"q.further.prompt.N":`Który punkt leży najdalej na północ?`,"q.further.prompt.S":`Który punkt leży najdalej na południe?`,"q.further.prompt.E":`Który punkt leży najdalej na wschód?`,"q.further.prompt.W":`Który punkt leży najdalej na zachód?`,"q.further.option":`Punkt {label}: {coord}`,"q.further.explain":`Punkt {label} ({coord}) leży najdalej {dir}. {rule}`,"q.further.explain2":`Punkt {label} ({coord}) leży najdalej {dir}. {rule} {rule2}`,"q.further.mistake.opposite":`Ten punkt leży najdalej {dir} — to przeciwny kierunek!`,"q.rule.mixed.lat":`Każde miejsce o szerokości N leży na północ od każdego miejsca o szerokości S.`,"q.rule.mixed.lon":`Każde miejsce o długości E leży na wschód od każdego miejsca o długości W (jeśli nie przechodzimy przez południk 180°).`,"q.rule.bigger.N":`Na półkuli północnej większa liczba oznacza, że miejsce leży dalej na północ.`,"q.rule.bigger.S":`Na półkuli południowej większa liczba oznacza, że miejsce leży dalej na południe.`,"q.rule.bigger.E":`Na półkuli wschodniej większa liczba oznacza, że miejsce leży dalej na wschód.`,"q.rule.bigger.W":`Na półkuli zachodniej większa liczba oznacza, że miejsce leży dalej na zachód.`,"q.rule.zero.lat":`Miejsca o szerokości N leżą na północ od równika (0°), a miejsca o szerokości S — na południe od niego.`,"q.rule.zero.lon":`Miejsca o długości E leżą na wschód od południka zerowego (0°), a miejsca o długości W — na zachód od niego.`,"q.relative.prompt.lat":`Czy punkt A ({point}) leży na północ, czy na południe od równoleżnika {line}?`,"q.relative.prompt.lon":`Czy punkt A ({point}) leży na wschód, czy na zachód od południka {line}?`,"q.opt.north":`Na północ od niego`,"q.opt.south":`Na południe od niego`,"q.opt.east":`Na wschód od niego`,"q.opt.west":`Na zachód od niego`,"q.relative.explain.lat":`Punkt A ma szerokość {value}, a równoleżnik to {line}, więc punkt leży {dir} od równoleżnika. {rule}`,"q.relative.explain.lon":`Punkt A ma długość {value}, a południk to {line}, więc punkt leży {dir} od południka. {rule}`,"q.read.prompt":`Jakie współrzędne ma ten punkt?`,"q.read.explain":`Punkt leży na równoleżniku {lat} i na południku {lon}, więc jego współrzędne to {coords}.`,"q.place.prompt":`Ustaw punkt w miejscu o współrzędnych {coords}.`,"q.place.explain":`Najpierw znajdź równoleżnik {lat}, potem południk {lon}. Punkt stawiasz tam, gdzie się przecinają.`,"q.which.prompt":`Który znacznik ma współrzędne {coords}?`,"q.which.option":`Znacznik {label}`,"q.which.explain":`Znacznik {label} ma współrzędne {coords}. To {place}!`,"q.answer.coords":`{coords}`,"q.mistake.nsLetter":`Sprawdź literę: N oznacza na północ od równika, a S — na południe od niego.`,"q.mistake.ewLetter":`Sprawdź literę: E oznacza na wschód od Greenwich, a W — na zachód od niego.`,"q.mistake.bothLetters":`Obie litery są odwrotnie. N lub S mówi, czy w górę, czy w dół, a E lub W — czy w prawo, czy w lewo.`,"q.mistake.swapped":`Szerokość i długość są zamienione miejscami. Szerokość (N lub S) zawsze piszemy pierwszą.`,"q.mistake.minutes":`Blisko! Sprawdź minuty: 30′ to pół stopnia, a 15′ to ćwierć stopnia.`,"practice.difficulty":`Poziom trudności`,"difficulty.easy":`Łatwy`,"difficulty.medium":`Średni`,"difficulty.hard":`Trudny`,"practice.progress":`Pytanie {n} z {total}`,"practice.check":`Sprawdź`,"practice.next":`Następne pytanie`,"practice.results":`Zobacz wynik`,"practice.correct":`Dobrze!`,"practice.incorrect":`Nie całkiem`,"practice.correctAnswer":`Poprawna odpowiedź: {answer}`,"practice.done":`Koniec rundy`,"practice.score":`Masz {score} na {total}`,"practice.best":`Twój najlepszy wynik: {best} na {total}`,"practice.newRound":`Nowa runda`,"practice.harder":`Spróbuj trudniejszych pytań`,"practice.review":`Twoje odpowiedzi`,"practice.backToLearn":`Wróć do nauki`,"practice.needAnswer":`Najpierw wybierz lub wpisz odpowiedź.`,"practice.resultCorrect":`dobrze`,"practice.resultWrong":`źle`,"input.chooseOne":`Wybierz jedną odpowiedź`,"input.lat":`Szerokość geograficzna`,"input.lon":`Długość geograficzna`,"input.example":`Na przykład: {example}`,"input.invalid":`Wpisz tak: {example}`,"input.usePoint":`Przesuń punkt na mapie (albo użyj suwaków) i naciśnij Sprawdź.`,"input.number":`Twoja odpowiedź`,"input.numberInvalid":`Wpisz liczbę, na przykład 25`,"unit.label.deg":`°`,"unit.label.km":`km`,"unit.label.h":`godz.`,"unit.label.min":`min`},Vi={"app.title":`Координати на земній кулі`,"app.skip":`Перейти до основного вмісту`,"unit.degree#one":`{count} градус`,"unit.degree#few":`{count} градуси`,"unit.degree#many":`{count} градусів`,"unit.degree#other":`{count} градуса`,"unit.minute#one":`{count} хвилина`,"unit.minute#few":`{count} хвилини`,"unit.minute#many":`{count} хвилин`,"unit.minute#other":`{count} хвилини`,"dir.north":`північної широти`,"dir.south":`південної широти`,"dir.east":`східної довготи`,"dir.west":`західної довготи`,"spoken.lat":`{amount} {dir}`,"spoken.lon":`{amount} {dir}`,"spoken.zero":`{amount}`,"header.language":`Мова`,"header.settings":`Налаштування`,"header.home":`Головна`,"settings.title":`Налаштування`,"settings.theme":`Колірна тема`,"settings.theme.system":`Як на пристрої`,"settings.theme.light":`Світла`,"settings.theme.dark":`Темна`,"settings.largeText":`Більший текст`,"settings.reducedMotion":`Менше анімації`,"settings.close":`Закрити`,"home.intro":`Кожне місце на Землі має свою адресу з двох чисел: широти й довготи. Навчімося її читати!`,"home.topics":`Теми`,"home.more":`Перевір себе й досліджуй`,"home.explore":`Вивчай`,"home.practice":`Тренуйся`,"topic.nav":`Розділи теми`,"topic.explore":`Вивчай`,"topic.practice":`Тренуйся`,"topic.prev":`Попередня тема: {title}`,"topic.next":`Наступна тема: {title}`,"topic.soon":`Ця тема незабаром.`,"explore.progress":`Крок {n} з {total}`,"explore.prev":`Назад`,"explore.next":`Далі`,"explore.goto":`Перейти до кроку {n}`,"explore.practiceNow":`Потренуйся з цієї теми`,"explore.keysHint":`Порада: клавіші ← і → перемикають кроки.`,"topic.1.title":`Градусна сітка`,"topic.1.summary":`Меридіани, паралелі, екватор і півкулі`,"topic.2.title":`Де це?`,"topic.2.summary":`Північніше чи південніше паралелі, східніше чи західніше меридіана`,"topic.3.title":`Визначення координат`,"topic.3.summary":`Визнач широту й довготу точки`,"topic.4.title":`Пошук місця`,"topic.4.summary":`Познач точку на карті за координатами`,"topic.5.title":`Градуси й хвилини`,"topic.5.summary":`Один градус має 60 хвилин`,"topic.6.title":`На скільки градусів різниця?`,"topic.6.summary":`Різниця широт і довгот`,"topic.7.title":`Відстань уздовж меридіана`,"topic.7.summary":`Один градус — це приблизно 111,2 км`,"topic.8.title":`Довгота і час`,"topic.8.summary":`День, ніч і місцевий сонячний час`,"topic.1.step.ball.title":`Земля — куля`,"topic.1.step.ball.body":`Щоб точно визначити місце на кулі, ми малюємо на ній уявну сітку. Сітка має два види ліній: паралелі й меридіани. Перетягни глобус, щоб його обернути.`,"topic.1.step.equator.title":`Екватор`,"topic.1.step.equator.body":`Екватор оперізує Землю посередині. Це найдовша паралель, і його широта — 0°. Він ділить Землю на Північну й Південну півкулі.`,"topic.1.step.parallels.title":`Паралелі`,"topic.1.step.parallels.body":`Паралелі — це кола, які йдуть паралельно до екватора. Що ближче до полюса, то вони коротші. Вони показують широту: від 0° на екваторі до 90° пн. ш. на Північному полюсі або 90° пд. ш. на Південному полюсі.`,"topic.1.step.angle.title":`Чому градуси?`,"topic.1.step.angle.body":`Широта — це кут! Уяви лінію від центру Землі до місця. Кут між цією лінією та екватором і є широтою. Перетягни точку на колі й подивись, як змінюється кут.`,"topic.1.step.meridians.title":`Меридіани`,"topic.1.step.meridians.body":`Меридіани — це півкола, що з'єднують Північний і Південний полюси. Усі меридіани мають однакову довжину. Вони показують довготу.`,"topic.1.step.prime.title":`Нульовий меридіан і 180°`,"topic.1.step.prime.body":`Нульовий меридіан (0°) проходить через Гринвіч у Лондоні. На протилежному боці Землі лежить меридіан 180°. Разом вони ділять Землю на Східну й Західну півкулі. Довгота йде від 0° до 180° сх. д. або 180° зх. д.`,"topic.1.step.projections.title":`Багато карт, одна сітка`,"topic.1.step.projections.body":`Плоска карта завжди трохи розтягнута, бо Земля кругла. Ця карта називається Equal Earth: кожна країна зберігає свій справжній розмір, тому меридіани вигнуті. Координати однакові на кожній карті. Спробуй карту-сітку в Лабораторії, щоб порівняти.`,"topic.1.step.tropics.title":`Тропіки й полярні кола`,"topic.1.step.tropics.body":`Деякі паралелі мають власні назви: Тропік Рака (близько 23° пн. ш.), Тропік Козерога (близько 23° пд. ш.), Північне полярне коло (близько 66° пн. ш.) і Південне полярне коло (близько 66° пд. ш.).`,"topic.1.step.play.title":`Спробуй сам`,"topic.1.step.play.body":`Перетягуй точку в різні місця. Коли вона в Північній півкулі? Коли вона в Західній півкулі? Знайди Тропік Рака.`,"topic.2.step.north-south.title":`На північ чи на південь?`,"topic.2.step.north-south.body":`На карті північ угорі. Варшава (52° пн. ш.) лежить на північ від паралелі 50° пн. ш. Рим (42° пн. ш.) лежить на південь від неї. У Північній півкулі більше число означає далі на північ.`,"topic.2.step.southern.title":`Обережно на півдні!`,"topic.2.step.southern.body":`У Південній півкулі більше число означає далі на південь. 40° пд. ш. лежить на південь від 20° пд. ш., а 10° пд. ш. лежить на північ від неї.`,"topic.2.step.east-west.title":`На схід чи на захід?`,"topic.2.step.east-west.body":`Схід — праворуч на карті. Київ (31° сх. д.) лежить на схід від меридіана 20° сх. д. Лондон (0°) лежить на захід від нього. У Східній півкулі більше число означає далі на схід.`,"topic.2.step.western.title":`Обережно на заході!`,"topic.2.step.western.body":`У Західній півкулі більше число означає далі на захід. 100° зх. д. лежить на захід від 60° зх. д., а 30° зх. д. лежить на схід від неї.`,"topic.2.step.across-zero.title":`По обидва боки лінії`,"topic.2.step.across-zero.body":`Будь-яке місце з північною широтою лежить на північ від будь-якого місця з південною широтою. Будь-яке місце зі східною довготою лежить на схід від Гринвіча, а будь-яке місце із західною довготою лежить на захід від нього.`,"topic.2.step.play.title":`Спробуй сам`,"topic.2.step.play.body":`Перемісти точку й скажи вголос: вона на північ чи на південь від екватора? На схід чи на захід від Гринвіча? Потім перевір координати під картою.`,"topic.3.step.address.title":`Адреса у двох числах`,"topic.3.step.address.body":`Координати записують спершу як широту, потім як довготу: 52° пн. ш., 21° сх. д. Це Варшава!`,"topic.3.step.latitude.title":`Крок 1: широта`,"topic.3.step.latitude.body":`Знайди паралель, яка проходить через точку, і прочитай її число біля лівого краю карти. Точка вище екватора (пн. ш.) чи нижче (пд. ш.)?`,"topic.3.step.longitude.title":`Крок 2: довгота`,"topic.3.step.longitude.body":`Тепер знайди меридіан, який проходить через точку, і прочитай його число біля нижнього краю карти. Точка праворуч від Гринвіча (сх. д.) чи ліворуч (зх. д.)?`,"topic.3.step.answer.title":`Склади разом`,"topic.3.step.answer.body":`Точка лежить на паралелі 30° пн. ш. і на меридіані 30° сх. д. Її координати — 30° пн. ш., 30° сх. д. — зовсім близько від Каїра.`,"topic.3.step.between.title":`Між лініями`,"topic.3.step.between.body":`Якщо точка лежить між двома лініями, порахуй градуси. Посередині між 40° і 50° буде 45°.`,"topic.3.step.southwest.title":`Південь і захід`,"topic.3.step.southwest.body":`Спробуй сам: яка паралель і який меридіан проходять через цю точку? Пам'ятай про позначки пд. ш. і зх. д. (Відповідь: 30° пд. ш., 60° зх. д.)`,"topic.3.step.globe.title":`На глобусі`,"topic.3.step.globe.body":`Сітка працює так само на глобусі. Оберни глобус, щоб знайти точку біля Сіднея: 34° пд. ш., 151° сх. д.`,"topic.3.step.play.title":`Спробуй сам`,"topic.3.step.play.body":`Перетягни точку, скажи вголос її координати, а потім перевір відповідь під картою.`,"topic.4.step.plan.title":`Від чисел до місця`,"topic.4.step.plan.body":`Знайдімо місце з координатами 50° пн. ш., 30° сх. д. Спочатку знайди паралель: 50° пн. ш.`,"topic.4.step.meridian.title":`Тепер меридіан`,"topic.4.step.meridian.body":`Тепер знайди меридіан 30° сх. д. Пам'ятай: сх. д. означає праворуч від Гринвіча.`,"topic.4.step.cross.title":`Там, де лінії перетинаються`,"topic.4.step.cross.body":`Це місце лежить там, де перетинаються обидві лінії. Це Київ!`,"topic.4.step.letters.title":`Позначки мають значення`,"topic.4.step.letters.body":`34° пд. ш., 151° сх. д. — це Сідней. А от 34° пн. ш., 151° зх. д. — це середина Тихого океану! Завжди перевіряй пн. ш. чи пд. ш. і сх. д. чи зх. д.`,"topic.4.step.play.title":`Спробуй сам`,"topic.4.step.play.body":`Перетягуй точку, щоб знаходити місця, або обери місто зі списку й перевір його координати.`,"mode.rehearsal.title":`Пробна контрольна`,"mode.rehearsal.summary":`15 різних запитань, як на справжній контрольній`,"mode.classQuiz.title":`Вікторина для класу`,"mode.classQuiz.summary":`Великі запитання на великому екрані для всього класу`,"mode.lab.title":`Лабораторія дня і ночі`,"mode.lab.summary":`Рухай Сонце й дивись, як змінюється час`,"lab.intro":`Перемістіть точку будь-куди на Землі й дивіться, як змінюються її координати.`,"
