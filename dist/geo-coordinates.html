gs.largeText":`Larger text`,"settings.reducedMotion":`Reduce motion`,"settings.close":`Close`,"home.intro":`Every place on Earth has its own address made of two numbers: latitude and longitude. Let's learn how to read it!`,"home.topics":`Topics`,"home.more":`Test yourself and explore`,"home.explore":`Learn`,"home.practice":`Practise`,"topic.nav":`Topic sections`,"topic.explore":`Learn`,"topic.practice":`Practise`,"topic.prev":`Previous topic: {title}`,"topic.next":`Next topic: {title}`,"topic.soon":`This topic is coming soon.`,"explore.progress":`Step {n} of {total}`,"explore.prev":`Previous`,"explore.next":`Next`,"explore.goto":`Go to step {n}`,"explore.practiceNow":`Practise this topic`,"explore.backHome":`Back to all topics`,"explore.keysHint":`Tip: use ← and → keys to change steps.`,"topic.1.title":`The globe grid`,"topic.1.summary":`Meridians, parallels, the equator and hemispheres`,"topic.2.title":`Where is it?`,"topic.2.summary":`North or south of a parallel, east or west of a meridian`,"topic.3.title":`Reading coordinates`,"topic.3.summary":`Find the latitude and longitude of a point`,"topic.4.title":`Finding a place`,"topic.4.summary":`Put a point on the map from its coordinates`,"topic.5.title":`Degrees and minutes`,"topic.5.summary":`One degree has 60 minutes`,"topic.6.title":`How many degrees apart?`,"topic.6.summary":`Differences in latitude and longitude`,"topic.7.title":`Distance along a meridian`,"topic.7.summary":`One degree is about 111.2 km`,"topic.8.title":`Longitude and time`,"topic.8.summary":`Day, night and local solar time`,"topic.9.title":`Coordinates in your phone`,"topic.9.summary":`Decimal coordinates, map apps and the Mercator map`,"topic.1.step.ball.title":`The Earth is a ball`,"topic.1.step.ball.body":`To say exactly where a place is on a ball, we draw an imaginary grid on it. The grid has two kinds of lines: parallels and meridians. Drag the globe to turn it.`,"topic.1.step.equator.title":`The equator`,"topic.1.step.equator.body":`The equator goes around the middle of the Earth. It is the longest parallel and its latitude is 0°. It divides the Earth into the Northern Hemisphere and the Southern Hemisphere.`,"topic.1.step.parallels.title":`Parallels`,"topic.1.step.parallels.body":`Parallels are circles that run parallel to the equator. The closer to a pole, the shorter they are. They tell us the latitude: from 0° at the equator up to 90°N at the North Pole or 90°S at the South Pole.`,"topic.1.step.angle.title":`Why degrees?`,"topic.1.step.angle.body":`Latitude is an angle! Imagine a line from the centre of the Earth to a place. The angle between that line and the equator is the latitude. Drag the point on the circle and watch the angle change.`,"topic.1.step.meridians.title":`Meridians`,"topic.1.step.meridians.body":`Meridians are half-circles that join the North Pole and the South Pole. All meridians are the same length. They tell us the longitude.`,"topic.1.step.prime.title":`The prime meridian and 180°`,"topic.1.step.prime.body":`The prime meridian (0°) goes through Greenwich in London. On the other side of the Earth is the 180° meridian. Together they divide the Earth into the Eastern and Western Hemispheres. Longitude goes from 0° up to 180°E or 180°W.`,"topic.1.step.projections.title":`Many maps, one grid`,"topic.1.step.projections.body":`A flat map is always a little stretched, because the Earth is round. This map is called Equal Earth: every country keeps its true size, so the meridians bend. The coordinates stay the same on every map. Try the Grid map in the Lab to compare.`,"topic.1.step.tropics.title":`Tropics and polar circles`,"topic.1.step.tropics.body":`Some parallels have their own names: the Tropic of Cancer (about 23½°N), the Tropic of Capricorn (about 23½°S), the Arctic Circle (about 66½°N) and the Antarctic Circle (about 66½°S).`,"topic.1.step.play.title":`Try it yourself`,"topic.1.step.play.body":`Drag the point around. When is it in the Northern Hemisphere? When is it in the Western Hemisphere? Find the Tropic of Cancer.`,"topic.2.step.north-south.title":`North or south?`,"topic.2.step.north-south.body":`On a map, north is at the top. Warsaw (52°N) is north of the 50°N parallel. Rome (42°N) is south of it. In the Northern Hemisphere a bigger number means further north.`,"topic.2.step.southern.title":`Careful in the south!`,"topic.2.step.southern.body":`In the Southern Hemisphere a bigger number means further south. 40°S is south of 20°S, and 10°S is north of it.`,"topic.2.step.east-west.title":`East or west?`,"topic.2.step.east-west.body":`East is to the right on a map. Kyiv (31°E) is east of the 20°E meridian. London (0°) is west of it. In the Eastern Hemisphere a bigger number means further east.`,"topic.2.step.western.title":`Careful in the west!`,"topic.2.step.western.body":`In the Western Hemisphere a bigger number means further west. 100°W is west of 60°W, and 30°W is east of it.`,"topic.2.step.across-zero.title":`Across the lines`,"topic.2.step.across-zero.body":`Every place with N latitude is north of every place with S latitude. Every place with E longitude is east of Greenwich, and every place with W longitude is west of it.`,"topic.2.step.play.title":`Try it yourself`,"topic.2.step.play.body":`Move the point and say it out loud: is it north or south of the equator? East or west of Greenwich? Then check the coordinates below the map.`,"topic.3.step.address.title":`An address in two numbers`,"topic.3.step.address.body":`Coordinates are written as latitude first, then longitude: 52°N, 21°E. That is Warsaw!`,"topic.3.step.latitude.title":`Step 1: latitude`,"topic.3.step.latitude.body":`Find the parallel that goes through the point and read its number at the left edge of the map. Is the point above the equator (N) or below it (S)?`,"topic.3.step.longitude.title":`Step 2: longitude`,"topic.3.step.longitude.body":`Now find the meridian that goes through the point and read its number at the bottom edge. Is the point right of Greenwich (E) or left of it (W)?`,"topic.3.step.answer.title":`Put it together`,"topic.3.step.answer.body":`The point lies on the 30°N parallel and on the 30°E meridian. Its coordinates are 30°N, 30°E — very close to Cairo.`,"topic.3.step.between.title":`Between the lines`,"topic.3.step.between.body":`If a point lies between two lines, count the degrees. Halfway between 40° and 50° is 45°.`,"topic.3.step.southwest.title":`South and west`,"topic.3.step.southwest.body":`Try this point yourself: which parallel and which meridian go through it? Remember the letters S and W. (Answer: 30°S, 60°W.)`,"topic.3.step.globe.title":`On the globe`,"topic.3.step.globe.body":`The grid works the same way on the globe. Turn the globe to find the point near Sydney: 34°S, 151°E.`,"topic.3.step.two-cities.title":`New York and Kraków`,"topic.3.step.two-cities.body":`New York is 41°N, 74°W, and Kraków is 50°N, 20°E. Both are north of the equator, but New York is west of Greenwich and Kraków is east of it — the letters tell you which.`,"topic.3.step.play.title":`Try it yourself`,"topic.3.step.play.body":`Drag the point, say its coordinates out loud, then check the answer below the map.`,"topic.4.step.plan.title":`From numbers to a place`,"topic.4.step.plan.body":`Let's find 50°N, 20°E. First find the parallel: 50°N.`,"topic.4.step.meridian.title":`Then the meridian`,"topic.4.step.meridian.body":`Now find the meridian 20°E. Remember: E means to the right of Greenwich.`,"topic.4.step.cross.title":`Where the lines cross`,"topic.4.step.cross.body":`The place is where the two lines cross. It is Kraków!`,"topic.4.step.letters.title":`Letters matter`,"topic.4.step.letters.body":`34°S, 151°E is Sydney. But 34°N, 151°W is in the middle of the Pacific Ocean! Always check N or S and E or W.`,"topic.4.step.play.title":`Try it yourself`,"topic.4.step.play.body":`Drag the point to find places, or pick a city from the list and check its coordinates.`,"topic.5.step.sixty.title":`A degree has 60 minutes`,"topic.5.step.sixty.body":`One degree is divided into 60 minutes, written with the sign ′. So 52°30′N is exactly halfway between 52°N and 53°N.`,"topic.5.step.quarters.title":`Halves and quarters`,"topic.5.step.quarters.body":`30′ is half a degree. 15′ is a quarter of a degree and 45′ is three quarters. This point is at 52°15′N, 21°45′E.`,"topic.5.step.warsaw.title":`Warsaw, exactly`,"topic.5.step.warsaw.body":`The centre of Warsaw is at about 52°14′N, 21°01′E. On a school map we often round it to 52°N, 21°E.`,"topic.5.step.compare.title":`Which is further north?`,"topic.5.step.compare.body":`52°45′N is north of 52°15′N: the degrees are the same, but it has more minutes. In the Southern Hemisphere more minutes means further south.`,"topic.5.step.play.title":`Try it yourself`,"topic.5.step.play.body":`Each arrow key press moves the point by 1′, and with Shift by 1°. Find 52°30′N, 20°45′E.`,"topic.6.step.same-lat.title":`Same side: subtract`,"topic.6.step.same-lat.body":`Warsaw is at 52°N and Cairo at 30°N. Both are north of the equator, so we subtract: 52 − 30 = 22°.`,"topic.6.step.opposite-lat.title":`Different sides: add`,"topic.6.step.opposite-lat.body":`Cairo is at 30°N and Cape Town at 34°S. The equator lies between them, so we add: 30 + 34 = 64°.`,"topic.6.step.same-lon.title":`Longitude works the same way`,"topic.6.step.same-lon.body":`Kyiv is at 31°E and Warsaw at 21°E. Both are east of Greenwich: 31 − 21 = 10°.`,"topic.6.step.opposite-lon.title":`Across Greenwich: add`,"topic.6.step.opposite-lon.body":`New York is at 74°W and Warsaw at 21°E. Greenwich lies between them: 74 + 21 = 95°.`,"topic.6.step.over-180.title":`More than 180°? Go the other way`,"topic.6.step.over-180.body":`Tokyo is at 140°E and Honolulu at 158°W. 140 + 158 = 298°, which is more than 180°. The shorter way crosses the 180° meridian: 360 − 298 = 62°.`,"topic.6.step.play.title":`Try it yourself`,"topic.6.step.play.body":`Drag the point. How many degrees of latitude and longitude is it from Warsaw (52°N, 21°E)?`,"topic.7.step.degree-length.title":`How long is one degree?`,"topic.7.step.degree-length.body":`A meridian runs from pole to pole: about 20,016 km and 180°. So one degree along a meridian is about 111.2 km.`,"topic.7.step.example.title":`Degrees into kilometres`,"topic.7.step.example.body":`Two points on the same meridian, at 50°N and 40°N, are 10° apart: 10 × 111.2 = 1112 km.`,"topic.7.step.across-equator.title":`Across the equator`,"topic.7.step.across-equator.body":`From 10°N to 20°S along a meridian: 10 + 20 = 30°, so 30 × 111.2 = 3336 km.`,"topic.7.step.reverse.title":`Kilometres into degrees`,"topic.7.step.reverse.body":`If two places on one meridian are 556 km apart, divide: 556 ÷ 111.2 = 5°.`,"topic.7.step.only-meridians.title":`Why only along meridians?`,"topic.7.step.only-meridians.body":`Parallels get shorter towards the poles, so one degree along a parallel is shorter than 111.2 km (except on the equator). That is why we use this rule along meridians.`,"topic.7.step.play.title":`Try it yourself`,"topic.7.step.play.body":`Move the point along the meridian. Its distance from the equator is its latitude × 111.2 km.`,"topic.8.step.rotation.title":`The Earth spins`,"topic.8.step.rotation.body":`The Earth turns once a day, from west to east. The half facing the Sun has day, the other half has night. Drag the time slider and watch night move.`,"topic.8.step.noon.title":`Noon on a meridian`,"topic.8.step.noon.body":`When the Sun is at its highest over a meridian, it is noon — 12:00 local solar time — along that whole meridian, from pole to pole.`,"topic.8.step.fifteen.title":`15° every hour`,"topic.8.step.fifteen.body":`The Earth turns 360° in 24 hours. That is 15° every hour, and 1° every 4 minutes.`,"topic.8.step.east-later.title":`East is later`,"topic.8.step.east-later.body":`The Sun rises in the east, so places further east have a later solar time. When it is 12:00 in London (0°), it is about 13:24 in Warsaw (21°E): 21 × 4 min = 84 min.`,"topic.8.step.calculate.title":`Let's calculate`,"topic.8.step.calculate.body":`Warsaw (21°E) and Kyiv (31°E) are 10° apart, which is 10 × 4 = 40 minutes. When it is 12:00 solar time in Warsaw, it is 12:40 in Kyiv, because Kyiv is further east.`,"topic.8.step.far-away.title":`Far-away places`,"topic.8.step.far-away.body":`Delhi (77°E) is 56° east of Warsaw (21°E): 56 × 4 = 224 minutes, about 3 h 44 min later. New York (74°W) is 95° west of Warsaw: 95 × 4 = 380 minutes, about 6 h 20 min earlier.`,"topic.8.step.seasons.title":`Polar day and polar night`,"topic.8.step.seasons.body":`The Earth's axis is tilted. Move the date: around 21 June the area around the North Pole has day all the time, and around 21 December it has night all the time.`,"topic.8.step.zones.title":`Did you know? Time zones`,"topic.8.step.zones.body":`Clocks do not show solar time. A whole country uses one time zone, so in Warsaw the Sun is highest at about 11:36 in winter (10:36 UTC + 1 hour) and about 12:36 in summer (10:36 UTC + 2 hours).`,"topic.8.step.play.title":`Day and night lab`,"topic.8.step.play.body":`Move the time, the date and the point. Watch the clocks and the line of noon.`,"topic.9.step.gps.title":`Your phone knows where it is`,"topic.9.step.gps.body":`Phones find their position with the help of satellites (GPS and similar systems). The phone gives it as latitude and longitude — the same ones you are learning — in a system called WGS 84.`,"topic.9.step.decimal.title":`Coordinates as decimals`,"topic.9.step.decimal.body":`Map apps such as Google Maps write coordinates as two decimal numbers: latitude first, then longitude. Katowice is about 50.2649, 19.0238.`,"topic.9.step.signs.title":`A minus instead of a letter`,"topic.9.step.signs.body":`Decimal coordinates have no letters. A minus sign means south (for latitude) or west (for longitude). Sydney is -33.8688, 151.2093 and New York is 40.7128, -74.0060. Move the point and watch when the minus appears.`,"topic.9.step.dms.title":`Degrees, minutes, seconds`,"topic.9.step.dms.body":`One degree has 60 minutes and one minute has 60 seconds. 50.2649° = 50°15′54″N. Move the point and compare both ways of writing it.`,"topic.9.step.find.title":`Find coordinates in a map app`,"topic.9.step.find.body":`In Google Maps, press and hold a spot on the map (on a computer: right-click). The coordinates appear. You can also type coordinates into the search box to find a place. This page is not affiliated with Google.`,"topic.9.step.mercator.title":`Why Greenland looks huge`,"topic.9.step.mercator.body":`Most map apps use a map called Mercator. It keeps shapes and directions right in small areas, but stretches everything near the poles. On Mercator, Greenland looks about as big as Africa; in reality Africa is 14 times bigger. Compare with Equal Earth and the globe.`,"topic.9.step.swap.title":`Careful with the order`,"topic.9.step.swap.body":`If you swap the two numbers, you land somewhere else: 19.0238, 50.2649 is not Katowice but a spot in the desert in Saudi Arabia. Latitude always comes first.`,"topic.9.step.play.title":`Try it yourself`,"topic.9.step.play.body":`Move the point and read its coordinates as letters, as decimals and in degrees-minutes-seconds. Turn on the Maple Bear schools layer and find a school.`,"mode.rehearsal.title":`Test rehearsal`,"mode.rehearsal.summary":`15 mixed questions, like a real test`,"mode.classQuiz.title":`Class quiz`,"mode.classQuiz.summary":`Big questions on the big screen for the whole class`,"mode.lab.title":`Day and night lab`,"mode.lab.summary":`Move the Sun and watch the time change`,"mode.cheatsheet.title":`Cheat sheet`,"mode.cheatsheet.summary":`All the key rules on one page to print`,"mode.worksheet.title":`Worksheet`,"mode.worksheet.summary":`Print questions with maps and an answer key`,"worksheet.intro":`Choose the topics, the level and the number of questions. The same code always makes the same worksheet.`,"worksheet.code":`Worksheet code`,"worksheet.newCode":`New code`,"worksheet.showKey":`Add the answer key (on its own page)`,"worksheet.preview":`Preview`,"worksheet.sheetTitle":`Worksheet: geographic coordinates`,"worksheet.name":`Name`,"worksheet.class":`Class`,"worksheet.date":`Date`,"worksheet.meta":`{level} · Topics: {topics} · Questions: {count} · Code: {code}`,"worksheet.markPoint":`Mark the point {coords} on the map.`,"worksheet.answer":`Answer`,"worksheet.time":`Time`,"worksheet.keyTitle":`Answer key`,"worksheet.map":`Map for question {n}`,"cheat.title":`Cheat sheet: geographic coordinates`,"cheat.subtitle":`The key rules on one page`,"cheat.print":`Print / Save as PDF`,"cheat.printHint":`In the print window, choose A4 and “Save as PDF” to get a file.`,"cheat.foot":`{app} · © {year} {author} · Content licence: CC BY 4.0`,"cheat.grid.title":`The grid`,"cheat.grid.1":`The equator is the 0° parallel. It divides the Earth into the Northern (N) and Southern (S) Hemispheres.`,"cheat.grid.2":`The prime (Greenwich) meridian is 0°. With the 180° meridian it divides the Earth into the Eastern (E) and Western (W) Hemispheres.`,"cheat.grid.3":`Latitude goes from 0° to 90°N or 90°S. Longitude goes from 0° to 180°E or 180°W.`,"cheat.grid.4":`Latitude comes first: 52°N, 21°E. Latitude 0° and longitude 0° or 180° have no letter.`,"cheat.read.title":`Reading coordinates`,"cheat.read.1":`Find the parallel through the point and read its number on the left edge: N above the equator, S below it.`,"cheat.read.2":`Find the meridian through the point and read its number on the bottom edge: E right of Greenwich, W left of it.`,"cheat.read.3":`Between two lines, count the degrees: halfway between 40° and 50° is 45°.`,"cheat.rel.title":`Where is it?`,"cheat.rel.1":`North is up, south is down, east is right, west is left.`,"cheat.rel.2":`Every place with N latitude is north of every place with S latitude. E longitude is east of Greenwich, W longitude is west of it.`,"cheat.rel.3":`With N and E, a bigger number is further north or east. With S and W, a bigger number is further south or west: 40°S is south of 20°S.`,"cheat.min.title":`Degrees and minutes`,"cheat.min.1":`1° = 60′ (60 minutes). 30′ = ½°, 15′ = ¼°, 45′ = ¾°.`,"cheat.min.2":`52°30′N is halfway between 52°N and 53°N.`,"cheat.min.3":`Same degrees? More minutes is further from the equator or from Greenwich.`,"cheat.diff.title":`How many degrees apart?`,"cheat.diff.1":`Same side of the equator (or of the prime meridian): subtract. 52°N and 30°N: 52 − 30 = 22°.`,"cheat.diff.2":`Different sides: add. 30°N and 34°S: 30 + 34 = 64°.`,"cheat.diff.3":`Longitudes that add up to more than 180°: take the shorter way, 360° minus the sum. 140°E and 158°W: 140 + 158 = 298°, 360 − 298 = 62°.`,"cheat.dist.title":`Distance along a meridian`,"cheat.dist.1":`1° of latitude along a meridian ≈ 111.2 km (111 km is fine too).`,"cheat.dist.2":`Kilometres = degrees × 111.2. From 50°N to 40°N is 10°: 10 × 111.2 = 1112 km.`,"cheat.dist.3":`Degrees = kilometres ÷ 111.2. 556 km ÷ 111.2 = 5°.`,"cheat.dist.4":`Only along a meridian: along a parallel a degree is shorter (except on the equator).`,"cheat.time.title":`Longitude and time`,"cheat.time.1":`The Earth turns 360° in 24 hours: 15° = 1 hour, 1° = 4 minutes.`,"cheat.time.2":`Further east is later, further west is earlier.`,"cheat.time.3":`Warsaw 21°E, Kyiv 31°E: 10° × 4 min = 40 min. 12:00 in Warsaw → 12:40 in Kyiv.`,"cheat.time.4":`This is local solar time. Clocks show the time of a time zone.`,"cheat.dec.title":`Coordinates in a map app`,"cheat.dec.1":`Two decimal numbers, latitude first: Katowice ≈ 50.2649, 19.0238.`,"cheat.dec.2":`No letters: a minus means S (for latitude) or W (for longitude). Sydney: -33.8688, 151.2093.`,"cheat.dec.3":`Swap the numbers and you land somewhere else: latitude always comes first.`,"cheat.fig.equator":`equator`,"cheat.fig.prime":`prime meridian`,"cheat.fig.north":`north`,"cheat.fig.south":`south`,"cheat.fig.later":`east: later`,"cheat.fig.earlier":`west: earlier`,"lab.intro":`Move the Sun through the day and the year. Watch day and night travel around the Earth and see what time it is in different places.`,"lab.time":`Time (UTC, Greenwich)`,"lab.date":`Day of the year`,"lab.now":`Now`,"lab.play":`Spin the Earth`,"lab.pause":`Stop`,"lab.clocks":`What time is it in these places?`,"lab.clocksHint":`From west to east: the further east, the later.`,"lab.place":`Place`,"lab.solarTime":`Solar time`,"lab.dayNight":`Day or night`,"lab.day":`day`,"lab.night":`night`,"lab.dawn":`dawn`,"lab.dusk":`dusk`,"lab.twilight":`dawn or dusk`,"lab.thePoint":`The point ({lon})`,"lab.noon":`Noon`,"lab.keyDates":`Special days of the year`,"lab.keyDate.march":`Spring equinox`,"lab.keyDate.june":`Summer solstice`,"lab.keyDate.september":`Autumn equinox`,"lab.keyDate.december":`Winter solstice`,"lab.didYouKnowTitle":`Did you know?`,"lab.didYouKnow":`Our clocks do not show solar time. A whole country uses one time zone, so in Warsaw the Sun is highest at about 11:36 in winter and about 12:36 in summer.`,"footer.madeBy":`Made by {name}`,"footer.mapData":`Map data: {source}`,"footer.schools":`School locations: Maple Bear websites (retrieved {date}), approximate. This page is not affiliated with Maple Bear.`,"footer.label":`About this page`,"footer.website":`{name} – website`,"footer.github":`{name} on GitHub`,"map.stage":`Map`,"map.chooseView":`Choose view`,"map.view.globe":`Globe`,"map.view.flat":`Map`,"map.view.cross-section":`Cross-section`,"map.daylight.label":`Day and night on the Earth`,"map.flat.label":`World map with parallels and meridians`,"map.flat.hint":`Arrow keys move the point (Shift: 10 times further). Plus and minus zoom.`,"map.zoomGroup":`Zoom`,"map.zoomIn":`Zoom in`,"map.zoomOut":`Zoom out`,"map.presetGroup":`Jump to`,"map.preset.world":`World`,"map.preset.europe":`Europe`,"map.preset.poland":`Poland`,"map.projection":`Map type`,"map.projection.grid":`Grid map`,"map.projection.equal-earth":`Equal Earth`,"map.projection.mercator":`Map app (Mercator)`,"map.projecti hoose a school to see it on the map. The places are approximate (often the centre of the town). This page is not affiliated with Maple Bear.`,"schools.showing":`Showing {school} on the map`,"schools.close":`Close the list`,"line.equator":`Equator 0°`,"line.prime":`Prime meridian 0° (Greenwich)`,"line.antimeridian":`Meridian 180°`,"line.tropicCancer":`Tropic of Cancer`,"line.tropicCapricorn":`Tropic of Capricorn`,"line.arcticCircle":`Arctic Circle`,"line.antarcticCircle":`Antarctic Circle`,"hemi.N":`Northern Hemisphere`,"hemi.S":`Southern Hemisphere`,"hemi.E":`Eastern Hemisphere`,"hemi.W":`Western Hemisphere`,"unit.km":`{n} km`,"place.warsaw":`Warsaw`,"place.krakow":`Kraków`,"place.gdansk":`Gdańsk`,"place.wroclaw":`Wrocław`,"place.poznan":`Poznań`,"place.kyiv":`Kyiv`,"place.lviv":`Lviv`,"place.odesa":`Odesa`,"place.kharkiv":`Kharkiv`,"place.london":`London`,"place.paris":`Paris`,"place.berlin":`Berlin`,"place.rome":`Rome`,"place.madrid":`Madrid`,"place.reykjavik":`Reykjavík`,"place.oslo":`Oslo`,"place.istanbul":`Istanbul`,"place.cairo":`Cairo`,"place.nairobi":`Nairobi`,"place.capetown":`Cape Town`,"place.lagos":`Lagos`,"place.dakar":`Dakar`,"place.newyork":`New York`,"place.losangeles":`Los Angeles`,"place.mexicocity":`Mexico City`,"place.anchorage":`Anchorage`,"place.honolulu":`Honolulu`,"place.rio":`Rio de Janeiro`,"place.buenosaires":`Buenos Aires`,"place.lima":`Lima`,"place.quito":`Quito`,"place.tokyo":`Tokyo`,"place.beijing":`Beijing`,"place.delhi":`Delhi`,"place.singapore":`Singapore`,"place.jakarta":`Jakarta`,"place.dubai":`Dubai`,"place.sydney":`Sydney`,"place.auckland":`Auckland`,"place.suva":`Suva (Fiji)`,"place.northpole":`North Pole`,"place.southpole":`South Pole`,"place.katowice":`Katowice`,"place.lodz":`Łódź`,"place.szczecin":`Szczecin`,"place.lublin":`Lublin`,"place.bialystok":`Białystok`,"place.rzeszow":`Rzeszów`,"place.bydgoszcz":`Bydgoszcz`,"place.olsztyn":`Olsztyn`,"place.zakopane":`Zakopane`,"place.prague":`Prague`,"place.bratislava":`Bratislava`,"place.vienna":`Vienna`,"place.budapest":`Budapest`,"place.vilnius":`Vilnius`,"place.riga":`Riga`,"place.mumbai":`Mumbai`,"place.bengaluru":`Bengaluru`,"place.washington":`Washington`,"place.chicago":`Chicago`,"river.vistula":`Vistula`,"river.oder":`Oder`,"label.europe":`Europe`,"label.asia":`Asia`,"label.africa":`Africa`,"label.greenland":`Greenland`,"label.northamerica":`North America`,"label.southamerica":`South America`,"label.australia":`Australia`,"label.antarctica":`Antarctica`,"label.pacific":`Pacific Ocean`,"label.atlantic":`Atlantic Ocean`,"label.indian":`Indian Ocean`,"label.arctic":`Arctic Ocean`,"q.nameLine.prompt":`What is the highlighted line?`,"q.nameLine.promptHemi":`Which hemisphere is highlighted?`,"q.nameLine.promptPoint":`In which two hemispheres is point A?`,"q.opt.equator":`The equator`,"q.opt.prime":`The prime meridian (Greenwich)`,"q.opt.antimeridian":`The 180° meridian`,"q.opt.parallel":`A parallel`,"q.opt.meridian":`A meridian`,"q.opt.tropicCancer":`The Tropic of Cancer`,"q.opt.tropicCapricorn":`The Tropic of Capricorn`,"q.opt.arcticCircle":`The Arctic Circle`,"q.opt.antarcticCircle":`The Antarctic Circle`,"q.opt.pair.NE":`Northern and Eastern`,"q.opt.pair.NW":`Northern and Western`,"q.opt.pair.SE":`Southern and Eastern`,"q.opt.pair.SW":`Southern and Western`,"q.nameLine.explain.equator":`The equator is the parallel 0°. It runs around the middle of the Earth.`,"q.nameLine.explain.prime":`The prime meridian is 0°. It goes through Greenwich in London.`,"q.nameLine.explain.antimeridian":`The 180° meridian is on the opposite side of the Earth from Greenwich.`,"q.nameLine.explain.parallel":`This is the parallel {value}. Parallels are circles parallel to the equator.`,"q.nameLine.explain.meridian":`This is the meridian {value}. Meridians join the North Pole and the South Pole.`,"q.nameLine.explain.tropicCancer":`The Tropic of Cancer is the parallel at about 23½°N.`,"q.nameLine.explain.tropicCapricorn":`The Tropic of Capricorn is the parallel at about 23½°S.`,"q.nameLine.explain.arcticCircle":`The Arctic Circle is the parallel at about 66½°N.`,"q.nameLine.explain.antarcticCircle":`The Antarctic Circle is the parallel at about 66½°S.`,"q.nameLine.explainHemi.N":`The Northern Hemisphere is everything north of the equator.`,"q.nameLine.explainHemi.S":`The Southern Hemisphere is everything south of the equator.`,"q.nameLine.explainHemi.E":`The Eastern Hemisphere is everything east of the prime meridian, up to 180°.`,"q.nameLine.explainHemi.W":`The Western Hemisphere is everything west of the prime meridian, up to 180°.`,"q.nameLine.explainPoint":`Point A is at {coords}, so it is in the {nsHemi} and {ewHemi} hemispheres.`,"q.nameLine.hemiAdj.N":`Northern`,"q.nameLine.hemiAdj.S":`Southern`,"q.nameLine.hemiAdj.E":`Eastern`,"q.nameLine.hemiAdj.W":`Western`,"q.dirWord.N":`north`,"q.dirWord.S":`south`,"q.dirWord.E":`east`,"q.dirWord.W":`west`,"q.further.prompt.N":`Which point lies furthest north?`,"q.further.prompt.S":`Which point lies furthest south?`,"q.further.prompt.E":`Which point lies furthest east?`,"q.further.prompt.W":`Which point lies furthest west?`,"q.further.option":`Point {label}: {coord}`,"q.further.explain":`Point {label} ({coord}) lies furthest {dir}. {rule}`,"q.further.explain2":`Point {label} ({coord}) lies furthest {dir}. {rule} {rule2}`,"q.further.mistake.opposite":`That point lies furthest {dir} — the opposite direction!`,"q.rule.mixed.lat":`Any place with N latitude is north of any place with S latitude.`,"q.rule.mixed.lon":`Any place with E longitude is east of any place with W longitude (as long as we do not cross the 180° meridian).`,"q.rule.bigger.N":`In the Northern Hemisphere, a bigger number means further north.`,"q.rule.bigger.S":`In the Southern Hemisphere, a bigger number means further south.`,"q.rule.bigger.E":`In the Eastern Hemisphere, a bigger number means further east.`,"q.rule.bigger.W":`In the Western Hemisphere, a bigger number means further west.`,"q.rule.zero.lat":`Places with N latitude lie north of the equator (0°), places with S latitude lie south of it.`,"q.rule.zero.lon":`Places with E longitude lie east of the prime meridian (0°), places with W longitude lie west of it.`,"q.relative.prompt.lat":`Is point A ({point}) north or south of the parallel {line}?`,"q.relative.prompt.lon":`Is point A ({point}) east or west of the meridian {line}?`,"q.opt.north":`North of it`,"q.opt.south":`South of it`,"q.opt.east":`East of it`,"q.opt.west":`West of it`,"q.relative.explain.lat":`Point A has latitude {value} and the parallel is {line}, so the point lies {dir} of the parallel. {rule}`,"q.relative.explain.lon":`Point A has longitude {value} and the meridian is {line}, so the point lies {dir} of the meridian. {rule}`,"q.read.prompt":`What are the coordinates of the point?`,"q.read.explain":`The point lies on the parallel {lat} and on the meridian {lon}, so its coordinates are {coords}.`,"q.place.prompt":`Move the point to {coords}.`,"q.place.explain":`First find the parallel {lat}, then the meridian {lon}. The point goes where they cross.`,"q.which.prompt":`Which marker is at {coords}?`,"q.which.option":`Marker {label}`,"q.which.explain":`Marker {label} is at {coords}. That is {place}!`,"q.answer.coords":`{coords}`,"q.answer.deg":`{n}°`,"q.answer.km":`{n} km`,"q.answer.h":`{n} h`,"q.answer.min":`{n} min`,"q.answer.clock":`{time}`,"q.answer.none":`—`,"q.mistake.nsLetter":`Check the letter: N means north of the equator, S means south of it.`,"q.mistake.ewLetter":`Check the letter: E means east of Greenwich, W means west of it.`,"q.mistake.bothLetters":`Both letters are the wrong way round. N or S says up or down, E or W says right or left.`,"q.mistake.swapped":`Latitude and longitude are swapped. Latitude (N or S) always comes first.`,"q.mistake.minutes":`Close! Check the minutes: 30′ is half a degree and 15′ is a quarter of a degree.`,"q.diff.prompt.lat":`What is the difference in latitude between A ({a}) and B ({b})?`,"q.diff.prompt.lon":`What is the difference in longitude between A ({a}) and B ({b})?`,"q.diff.explain.same.lat":`Both points are on the same side of the equator, so subtract: {big} − {small} = {result}°.`,"q.diff.explain.same.lon":`Both points are on the same side of the prime meridian, so subtract: {big} − {small} = {result}°.`,"q.diff.explain.opposite.lat":`The points are on different sides of the equator, so add: {x} + {y} = {result}°.`,"q.diff.explain.opposite.lon":`The points are on different sides of the prime meridian, so add: {x} + {y} = {result}°.`,"q.diff.explain.zero.lat":`One point lies on the equator (0°), so the difference is simply the other number: {result}°.`,"q.diff.explain.zero.lon":`One point lies on the prime meridian (0°), so the difference is simply the other number: {result}°.`,"q.diff.explain.over180":`The points are on different sides of the prime meridian, so add: {x} + {y} = {sum}°. That is more than 180°, so take the shorter way across the 180° meridian: 360 − {sum} = {result}°.`,"q.diff.mistake.subtracted.lat":`You subtracted, but the points are on different sides of the equator. Add the numbers instead.`,"q.diff.mistake.subtracted.lon":`You subtracted, but the points are on different sides of the prime meridian. Add the numbers instead.`,"q.diff.mistake.added.lat":`You added, but both points are on the same side of the equator. Subtract the smaller number from the bigger one.`,"q.diff.mistake.added.lon":`You added, but both points are on the same side of the prime meridian. Subtract the smaller number from the bigger one.`,"q.diff.mistake.over180":`Adding was right, but the sum is more than 180°. Take the shorter way: 360° minus the sum.`,"q.diff.mistake.subtractedOver180":`Don't subtract here: the points are on different sides of the prime meridian. Add the numbers, and because the sum is more than 180°, take 360° minus the sum.`,"q.dist.prompt":`Points A ({a}) and B ({b}) lie on the same meridian. How far apart are they in kilometres?`,"q.dist.promptReverse":`Two places on the same meridian are {km} km apart. How many degrees of latitude apart are they?`,"q.dist.explain":`{diff} One degree along a meridian is about 111.2 km, so {deg} × 111.2 = {km} km.`,"q.dist.explainReverse":`One degree along a meridian is about 111.2 km, so divide: {km} ÷ 111.2 = {deg}°.`,"q.dist.note111":`You used 111 km per degree. That is fine! The more exact value is 111.2 km.`,"q.dist.mistake.degrees":`That is the number of degrees. Multiply it by 111.2 to get kilometres.`,"q.dist.mistake.multiplied":`You multiplied. To turn kilometres into degrees, divide by 111.2.`,"q.time.prompt.later":`Where is the local solar time later: at A ({a}) or at B ({b})?`,"q.time.opt.a":`At A`,"q.time.opt.b":`At B`,"q.time.explain.later.east":`{rule} So B is further east than A. The Sun reaches places further east earlier, so the local solar time at B is later.`,"q.time.explain.later.west":`{rule} So A is further east than B. The Sun reaches places further east earlier, so the local solar time at A is later.`,"q.time.rule.across180.east":`The shorter way from A to B is only {deg}° and it leads east, across the 180° meridian, where E longitude changes into W longitude.`,"q.time.rule.across180.west":`The shorter way from A to B is only {deg}° and it leads west, across the 180° meridian, where W longitude changes into E longitude.`,"q.time.prompt.clock":`At A ({a}) it is {time} local solar time. What is the local solar time at B ({b})?`,"q.time.explain.clock":`{diff} {minutes} {calc}`,"q.time.minutes":`Each 1° is 4 minutes of time: {deg} × 4 = {min} min.`,"q.time.minutesLong":`Each 1° is 4 minutes of time: {deg} × 4 = {min} min = {duration}.`,"q.time.calc.east":`{rule} B is further east, so its time is later: {timeA} + {min} min = {timeB}.`,"q.time.calc.eastNextDay":`{rule} B is further east, so its time is later: {timeA} + {min} min = {timeB} the next day.`,"q.time.calc.eastPrevDay":`{rule} B is further east, so its time is later: {timeA} + {min} min = {timeB}. But going east across the 180° meridian the date goes back one day, so at B it is still the day before.`,"q.time.calc.west":`{rule} B is further west, so its time is earlier: {timeA} − {min} min = {timeB}.`,"q.time.calc.westPrevDay":`{rule} B is further west, so its time is earlier: {timeA} − {min} min = {timeB} the day before.`,"q.time.calc.westNextDay":`{rule} B is further west, so its time is earlier: {timeA} − {min} min = {timeB}. But going west across the 180° meridian the date moves forward one day, so at B it is already the next day.`,"q.time.prompt.degrees":`The local solar time in two places differs by {duration}. How many degrees of longitude apart are the two places?`,"q.time.explain.degrees":`{duration} = {min} min. Every 4 minutes of time make 1° of longitude: {min} ÷ 4 = {deg}°.`,"q.time.explain.degreesShort":`Every 4 minutes of time make 1° of longitude: {min} ÷ 4 = {deg}°.`,"q.time.duration":`{h} h {m} min`,"q.time.duration.h":`{h} h`,"q.time.duration.m":`{m} min`,"q.time.mistake.direction":`Wrong direction! Further east means a later time, further west means an earlier time.`,"q.time.mistake.over180":`Across the 180° meridian take the shorter way: 360° minus the sum. And remember that further east means a later time.`,"q.time.mistake.perDegree":`Remember: 1° of longitude is 4 minutes of time, not 1 minute.`,"q.time.mistake.minutes":`That is the number of minutes. Divide it by 4 to get degrees.`,"q.time.mistake.multiplied":`Do not multiply here: to turn minutes into degrees, divide by 4.`,"practice.difficulty":`Difficulty`,"difficulty.easy":`Easy`,"difficulty.medium":`Medium`,"difficulty.hard":`Hard`,"practice.progress":`Question {n} of {total}`,"practice.check":`Check`,"practice.next":`Next question`,"practice.results":`See results`,"practice.correct":`Correct!`,"practice.incorrect":`Not quite`,"practice.correctAnswer":`Correct answer: {answer}`,"practice.done":`Round complete`,"practice.score":`You got {score} out of {total}`,"practice.best":`Your best: {best} out of {total}`,"practice.newRound":`New round`,"practice.harder":`Try harder questions`,"practice.review":`Your answers`,"practice.backToLearn":`Back to learning`,"practice.needAnswer":`Choose or enter an answer first.`,"practice.resultCorrect":`correct`,"practice.resultWrong":`wrong`,"practice.hint":`Hint`,"practice.hintTag":`with a hint`,"celebrate.perfect":`Perfect round! Every answer is right.`,"home.best":`Best: {score}/{total} · {level}`,"home.bestLong":`Your best score: {score} out of {total}, {level} level`,"home.notPractised":`Not practised yet`,"q.hint.name-line":`The equator (0°) runs around the middle of the Earth. The prime meridian (0°) goes from pole to pole through Greenwich. North is up, east is right. The tropics are at about 23½°, the polar circles at about 66½°.`,"q.hint.further":`North is up and east is right. Any N latitude is north of any S latitude, and E is east of W. In the south and in the west, a bigger number means further south or further west.`,"q.hint.relative-line":`Compare the point's number with the line's number, and look at the letters. With N or E a bigger number is further north or east; with S or W a bigger number is further south or west.`,"q.hint.read-coords":`First find the parallel through the point and read its number on the left edge, then the meridian and its number on the bottom edge. Don't forget the letters.`,"q.hint.place-point":`Latitude comes first: find the parallel (numbers on the left edge), then the meridian (numbers on the bottom edge). The point goes where they cross.`,"q.hint.which-place":`For each marker, read the parallel on the left edge and the meridian on the bottom edge, and check the letters: N or S, E or W.`,"q.hint.difference":`Same side of the line → subtract. Different sides → add. More than 180° → 360° minus the sum.`,"q.hint.distance":`One degree of latitude along a meridian is about 111.2 km. Degrees × 111.2 = kilometres; kilometres ÷ 111.2 = degrees.`,"q.hint.time":`15° = 1 hour, 1° = 4 minutes. East is later, west is earlier.`,"input.chooseOne":`Choose one answer`,"input.correctOption":`correct answer`,"input.lat":`Latitude`,"input.lon":`Longitude`,"input.example":`For example: {example}`,"input.invalid":`Write it like this: {example}`,"input.usePoint":`Move the point on the map (or use the sliders), then press Check.`,"input.number":`Your answer`,"input.numberInvalid":`Enter a number, for example 25`,"input.clock":`Time (hours:minutes)`,"input.clockInvalid":`Write the time like 13:24`,"unit.label.deg":`°`,"unit.label.km":`km`,"unit.label.h":`h`,"unit.label.min":`min`,"rehearsal.intro":`15 questions from all topics. You will see the answers at the end, just like after a real test.`,"rehearsal.start":`Start`,"rehearsal.submitNext":`Save and continue`,"rehearsal.finish":`Finish the test`,"rehearsal.results":`Your results`,"rehearsal.yourAnswer":`Your answer: {answer}`,"rehearsal.learn":`Learn: {title}`,"rehearsal.practise":`Practise: {title}`,"rehearsal.again":`Try another test`,"classQuiz.setup":`Set up the quiz`,"classQuiz.seed":`Quiz code (the same code gives the same questions)`,"classQuiz.topics":`Topics`,"classQuiz.count":`Number of questions`,"classQuiz.timer":`Time to think`,"classQuiz.timerOff":`No timer`,"classQuiz.seconds":`{n} s`,"classQuiz.start":`Start the quiz`,"classQuiz.reveal":`Show the answer`,"classQuiz.prev":`Previous`,"classQuiz.next":`Next`,"classQuiz.end":`End quiz`,"classQuiz.keys":`Space: show answer · →: next · ←: previous · Esc: end`,"classQuiz.timeUp":`Time's up!`,"classQuiz.answer":`Answer: {answer}`,"classQuiz.noTopics":`Choose at least one topic.`},Ji={"app.title":`Współrzędne na kuli ziemskiej`,"app.shortTitle":`Współrzędne`,"app.skip":`Przejdź do treści`,"unit.degree#one":`{count} stopień`,"unit.degree#few":`{count} stopnie`,"unit.degree#many":`{count} stopni`,"unit.degree#other":`{count} stopnia`,"unit.minute#one":`{count} minuta`,"unit.minute#few":`{count} minuty`,"unit.minute#many":`{count} minut`,"unit.minute#other":`{count} minuty`,"unit.second#one":`{count} sekunda`,"unit.second#few":`{count} sekundy`,"unit.second#many":`{count} sekund`,"unit.second#other":`{count} sekundy`,"dir.north":`na północ`,"dir.south":`na południe`,"dir.east":`na wschód`,"dir.west":`na zachód`,"spoken.lat":`{amount} {dir}`,"spoken.lon":`{amount} {dir}`,"spoken.zero":`{amount}`,"header.language":`Język`,"header.settings":`Ustawienia`,"header.home":`Strona główna`,"header.presenter":`Tryb prezentacji`,"header.laser":`Wskaźnik`,"presenter.hint":`P: tryb prezentacji · L: wskaźnik · Esc: wyjście z trybu prezentacji`,"settings.title":`Ustawienia`,"settings.theme":`Motyw kolorów`,"settings.theme.system":`Jak w urządzeniu`,"settings.theme.light":`Jasny`,"settings.theme.dark":`Ciemny`,"settings.largeText":`Większy tekst`,"settings.reducedMotion":`Ogranicz animacje`,"settings.close":`Zamknij`,"home.intro":`Każde miejsce na Ziemi ma swój adres z dwóch liczb: szerokości i długości geograficznej. Nauczmy się go czytać!`,"home.topics":`Tematy`,"home.more":`Sprawdź się i odkrywaj`,"home.explore":`Poznaj`,"home.practice":`Ćwicz`,"topic.nav":`Części tematu`,"topic.explore":`Poznaj`,"topic.practice":`Ćwicz`,"topic.prev":`Poprzedni temat: {title}`,"topic.next":`Następny temat: {title}`,"topic.soon":`Ten temat już wkrótce.`,"explore.progress":`Krok {n} z {total}`,"explore.prev":`Wstecz`,"explore.next":`Dalej`,"explore.goto":`Przejdź do kroku {n}`,"explore.practiceNow":`Poćwicz ten temat`,"explore.backHome":`Do listy tematów`,"explore.keysHint":`Wskazówka: klawisze ← i → zmieniają kroki.`,"topic.1.title":`Siatka geograficzna`,"topic.1.summary":`Południki, równoleżniki, równik i półkule`,"topic.2.title":`Gdzie to jest?`,"topic.2.summary":`Na północ czy na południe od równoleżnika, na wschód czy na zachód od południka`,"topic.3.title":`Odczytywanie współrzędnych`,"topic.3.summary":`Odczytaj szerokość i długość geograficzną punktu`,"topic.4.title":`Szukanie miejsca`,"topic.4.summary":`Zaznacz punkt na mapie według współrzędnych`,"topic.5.title":`Stopnie i minuty`,"topic.5.summary":`Jeden stopień ma 60 minut`,"topic.6.title":`Ile stopni różnicy?`,"topic.6.summary":`Różnica szerokości i długości geograficznej`,"topic.7.title":`Odległość wzdłuż południka`,"topic.7.summary":`Jeden stopień to około 111,2 km`,"topic.8.title":`Długość geograficzna a czas`,"topic.8.summary":`Dzień, noc i czas słoneczny`,"topic.9.title":`Współrzędne w telefonie`,"topic.9.summary":`Zapis dziesiętny, aplikacje z mapami i mapa Merkatora`,"topic.1.step.ball.title":`Ziemia jest kulą`,"topic.1.step.ball.body":`Aby dokładnie określić miejsce na kuli, rysujemy na niej wyobrażoną siatkę. Siatka ma dwa rodzaje linii: równoleżniki i południki. Przeciągnij globus, aby go obrócić.`,"topic.1.step.equator.title":`Równik`,"topic.1.step.equator.body":`Równik biegnie dookoła środka Ziemi. To najdłuższy równoleżnik, a jego szerokość geograficzna to 0°. Dzieli Ziemię na półkulę północną i południową.`,"topic.1.step.parallels.title":`Równoleżniki`,"topic.1.step.parallels.body":`Równoleżniki to okręgi biegnące równolegle do równika. Im bliżej bieguna, tym są krótsze. Pokazują szerokość geograficzną: od 0° na równiku aż do 90°N na biegunie północnym lub 90°S na biegunie południowym.`,"topic.1.step.angle.title":`Dlaczego stopnie?`,"topic.1.step.angle.body":`Szerokość geograficzna to kąt! Wyobraź sobie linię od środka Ziemi do miejsca. Kąt między tą linią a równikiem to szerokość geograficzna. Przeciągnij punkt na okręgu i obserwuj, jak zmienia się kąt.`,"topic.1.step.meridians.title":`Południki`,"topic.1.step.meridians.body":`Południki to półokręgi łączące biegun północny z biegunem południowym. Wszystkie południki mają taką samą długość. Pokazują długość geograficzną.`,"topic.1.step.prime.title":`Południk zerowy i 180°`,"topic.1.step.prime.body":`Południk zerowy (0°) przechodzi przez Greenwich w Londynie. Po drugiej stronie Ziemi leży południk 180°. Razem dzielą Ziemię na półkulę wschodnią i zachodnią. Długość geograficzna sięga od 0° do 180°E lub 180°W.`,"topic.1.step.projections.title":`Wiele map, jedna siatka`,"topic.1.step.projections.body":`Płaska mapa jest zawsze trochę rozciągnięta, bo Ziemia jest okrągła. Ta mapa nazywa się Equal Earth: każdy kraj zachowuje swój prawdziwy rozmiar, dlatego południki są wygięte. Współrzędne są takie same na każdej mapie. Porównaj z mapą z siatką w Laboratorium.`,"topic.1.step.tropics.title":`Zwrotniki i koła podbiegunowe`,"topic.1.step.tropics.body":`Niektóre równoleżniki mają własne nazwy: Zwrotnik Raka (około 23½°N), Zwrotnik Koziorożca (około 23½°S), koło podbiegunowe północne (około 66½°N) i koło podbiegunowe południowe (około 66½°S).`,"topic.1.step.play.title":`Spróbuj sam`,"topic.1.step.play.body":`Przeciągaj punkt w różne miejsca. Kiedy jest na półkuli północnej? Kiedy jest na półkuli zachodniej? Znajdź Zwrotnik Raka.`,"topic.2.step.north-south.title":`Na północ czy na południe?`,"topic.2.step.north-south.body":`Na mapie północ jest u góry. Warszawa (52°N) leży na północ od równoleżnika 50°N. Rzym (42°N) leży na południe od niego. Na półkuli północnej większa liczba oznacza dalej na północ.`,"topic.2.step.southern.title":`Uwaga na południu!`,"topic.2.step.southern.body":`Na półkuli południowej większa liczba oznacza dalej na południe. 40°S leży na południe od 20°S, a 10°S leży na północ od niego.`,"topic.2.step.east-west.title":`Na wschód czy na zachód?`,"topic.2.step.east-west.body":`Wschód jest po prawej stronie mapy. Kijów (31°E) leży na wschód od południka 20°E. Londyn (0°) leży na zachód od niego. Na półkuli wschodniej większa liczba oznacza dalej na wschód.`,"topic.2.step.western.title":`Uwaga na zachodzie!`,"topic.2.step.western.body":`Na półkuli zachodniej większa liczba oznacza dalej na zachód. 100°W leży na zachód od 60°W, a 30°W leży na wschód od niego.`,"topic.2.step.across-zero.title":`Po obu stronach linii`,"topic.2.step.across-zero.body":`Każde miejsce o szerokości N leży na północ od każdego miejsca o szerokości S. Każde miejsce o długości E leży na wschód od Greenwich, a każde miejsce o długości W leży na zachód od niego.`,"topic.2.step.play.title":`Spróbuj sam`,"topic.2.step.play.body":`Przesuń punkt i powiedz na głos: czy jest na północ, czy na południe od równika? Na wschód czy na zachód od Greenwich? Potem sprawdź współrzędne pod mapą.`,"topic.3.step.address.title":`Adres w dwóch liczbach`,"topic.3.step.address.body":`Współrzędne zapisujemy najpierw jako szerokość, potem jako długość geograficzną: 52°N, 21°E. To Warszawa!`,"topic.3.step.latitude.title":`Krok 1: szerokość geograficzna`,"topic.3.step.latitude.body":`Znajdź równoleżnik, który przechodzi przez punkt, i odczytaj jego numer przy lewej krawędzi mapy. Czy punkt leży powyżej równika (N), czy poniżej niego (S)?`,"topic.3.step.longitude.title":`Krok 2: długość geograficzna`,"topic.3.step.longitude.body":`Teraz znajdź południk, który przechodzi przez punkt, i odczytaj jego numer przy dolnej krawędzi mapy. Czy punkt leży na prawo od Greenwich (E), czy na lewo od niego (W)?`,"topic.3.step.answer.title":`Złóż to razem`,"topic.3.step.answer.body":`Punkt leży na równoleżniku 30°N i na południku 30°E. Jego współrzędne to 30°N, 30°E — bardzo blisko Kairu.`,"topic.3.step.between.title":`Między liniami`,"topic.3.step.between.body":`Jeśli punkt leży między dwiema liniami, policz stopnie. W połowie drogi między 40° a 50° jest 45°.`,"topic.3.step.southwest.title":`Południe i zachód`,"topic.3.step.southwest.body":`Spróbuj sam: który równoleżnik i który południk przez niego przechodzą? Pamiętaj o literach S i W. (Odpowiedź: 30°S, 60°W.)`,"topic.3.step.globe.title":`Na globusie`,"topic.3.step.globe.body":`Siatka działa tak samo na globusie. Obróć globus, aby znaleźć punkt w pobliżu Sydney: 34°S, 151°E.`,"topic.3.step.two-cities.title":`Nowy Jork i Kraków`,"topic.3.step.two-cities.body":`Nowy Jork leży na 41°N, 74°W, a Kraków na 50°N, 20°E. Oba miasta są na północ od równika, ale Nowy Jork leży na zachód od Greenwich, a Kraków — na wschód. Właśnie o tym mówią litery.`,"topic.3.step.play.title":`Spróbuj sam`,"topic.3.step.play.body":`Przeciągnij punkt, powiedz na głos jego współrzędne, a potem sprawdź odpowiedź pod mapą.`,"topic.4.step.plan.title":`Od liczb do miejsca`,"topic.4.step.plan.body":`Znajdźmy miejsce o współrzędnych 50°N, 20°E. Najpierw znajdź równoleżnik: 50°N.`,"topic.4.step.meridian.title":`Teraz południk`,"topic.4.step.meridian.body":`Teraz znajdź południk 20°E. Pamiętaj: E oznacza na prawo od Greenwich.`,"topic.4.step.cross.title":`Tam, gdzie linie się przecinają`,"topic.4.step.cross.body":`To miejsce leży tam, gdzie przecinają się obie linie. To Kraków!`,"topic.4.step.letters.title":`Litery mają znaczenie`,"topic.4.step.letters.body":`34°S, 151°E to Sydney. Ale 34°N, 151°W to środek Oceanu Spokojnego! Zawsze sprawdzaj N lub S oraz E lub W.`,"topic.4.step.play.title":`Spróbuj sam`,"topic.4.step.play.body":`Przeciągaj punkt, aby znaleźć miejsca, albo wybierz miasto z listy i sprawdź jego współrzędne.`,"topic.5.step.sixty.title":`Stopień ma 60 minut`,"topic.5.step.sixty.body":`Jeden stopień dzielimy na 60 minut. Minuty zapisujemy znakiem ′. Dlatego 52°30′N leży dokładnie w połowie między 52°N a 53°N.`,"topic.5.step.quarters.title":`Połówki i ćwiartki`,"topic.5.step.quarters.body":`30′ to pół stopnia. 15′ to ćwierć stopnia, a 45′ to trzy czwarte stopnia. Ten punkt leży na 52°15′N, 21°45′E.`,"topic.5.step.warsaw.title":`Warszawa dokładnie`,"topic.5.step.warsaw.body":`Środek Warszawy leży mniej więcej na 52°14′N, 21°01′E. Na mapie szkolnej często zaokrąglamy to do 52°N, 21°E.`,"topic.5.step.compare.title":`Który jest dalej na północ?`,"topic.5.step.compare.body":`52°45′N leży na północ od 52°15′N: stopnie są takie same, ale minut jest więcej. Na półkuli południowej więcej minut oznacza, że miejsce leży dalej na południe.`,"topic.5.step.play.title":`Spróbuj sam`,"topic.5.step.play.body":`Każde naciśnięcie strzałki przesuwa punkt o 1′, a ze Shiftem — o 1°. Znajdź 52°30′N, 20°45′E.`,"topic.6.step.same-lat.title":`Ta sama strona: odejmujemy`,"topic.6.step.same-lat.body":`Warszawa leży na 52°N, a Kair na 30°N. Oba miasta są na północ od równika, więc odejmujemy: 52 − 30 = 22°.`,"topic.6.step.opposite-lat.title":`Różne strony: dodajemy`,"topic.6.step.opposite-lat.body":`Kair leży na 30°N, a Kapsztad na 34°S. Między nimi jest równik, więc dodajemy: 30 + 34 = 64°.`,"topic.6.step.same-lon.title":`Z długością jest tak samo`,"topic.6.step.same-lon.body":`Kijów leży na 31°E, a Warszawa na 21°E. Oba miasta są na wschód od Greenwich: 31 − 21 = 10°.`,"topic.6.step.opposite-lon.title":`Przez Greenwich: dodajemy`,"topic.6.step.opposite-lon.body":`Nowy Jork leży na 74°W, a Warszawa na 21°E. Między nimi jest południk zerowy (Greenwich): 74 + 21 = 95°.`,"topic.6.step.over-180.title":`Więcej niż 180°? Idź w drugą stronę`,"topic.6.step.over-180.body":`Tokio leży na 140°E, a Honolulu na 158°W. 140 + 158 = 298°, a to więcej niż 180°. Krótsza droga prowadzi przez południk 180°: 360 − 298 = 62°.`,"topic.6.step.play.title":`Spróbuj sam`,"topic.6.step.play.body":`Przeciągnij punkt. O ile stopni szerokości i długości geograficznej różni się od Warszawy (52°N, 21°E)?`,"topic.7.step.degree-length.title":`Ile kilometrów ma jeden stopień?`,"topic.7.step.degree-length.body":`Południk biegnie od bieguna do bieguna: to około 20 016 km i 180°. Dlatego jeden stopień wzdłuż południka to około 111,2 km.`,"topic.7.step.example.title":`Stopnie na kilometry`,"topic.7.step.example.body":`Dwa punkty na tym samym południku, na 50°N i 40°N, dzieli 10°: 10 × 111,2 = 1112 km.`,"topic.7.step.across-equator.title":`Przez równik`,"topic.7.step.across-equator.body":`Od 10°N do 20°S wzdłuż południka: 10 + 20 = 30°, więc 30 × 111,2 = 3336 km.`,"topic.7.step.reverse.title":`Kilometry na stopnie`,"topic.7.step.reverse.body":`Jeśli dwa miejsca na jednym południku dzieli 556 km, to dzielimy: 556 : 111,2 = 5°.`,"topic.7.step.only-meridians.title":`Dlaczego tylko wzdłuż południków?`,"topic.7.step.only-meridians.body":`Równoleżniki są coraz krótsze w stronę biegunów, więc jeden stopień wzdłuż równoleżnika ma mniej niż 111,2 km (oprócz równika). Dlatego tej zasady używamy tylko wzdłuż południków.`,"topic.7.step.play.title":`Spróbuj sam`,"topic.7.step.play.body":`Przesuwaj punkt wzdłuż południka. Jego odległość od równika to jego szerokość geograficzna × 111,2 km.`,"topic.8.step.rotation.title":`Ziemia się obraca`,"topic.8.step.rotation.body":`Ziemia obraca się raz na dobę, z zachodu na wschód. Na połowie zwróconej do Słońca jest dzień, a na drugiej połowie — noc. Przesuwaj suwak godziny i patrz, jak wędruje noc.`,"topic.8.step.noon.title":`Południe na południku`,"topic.8.step.noon.body":`Gdy Słońce stoi najwyżej nad jakimś południkiem, na całym tym południku, od bieguna do bieguna, jest południe — godzina 12:00 czasu słonecznego.`,"topic.8.step.fifteen.title":`15° na godzinę`,"topic.8.step.fifteen.body":`Ziemia obraca się o 360° w ciągu 24 godzin. To 15° na godzinę i 1° co 4 minuty.`,"topic.8.step.east-later.title":`Na wschodzie jest później`,"topic.8.step.east-later.body":`Słońce wschodzi na wschodzie, więc w miejscach położonych dalej na wschód czas słoneczny jest późniejszy. Gdy w Londynie (0°) jest 12:00, w Warszawie (21°E) jest około 13:24: 21 × 4 min = 84 min.`,"topic.8.step.calculate.title":`Policzmy`,"topic.8.step.calculate.body":`Warszawę (21°E) i Kijów (31°E) dzieli 10°, czyli 10 × 4 = 40 minut. Gdy w Warszawie jest 12:00 czasu słonecznego, w Kijowie jest 12:40, bo Kijów leży dalej na wschód.`,"topic.8.step.far-away.title":`Miejsca daleko stąd`,"topic.8.step.far-away.body":`Delhi (77°E) leży 56° na wschód od Warszawy (21°E): 56 × 4 = 224 minuty, czyli około 3 godz. 44 min później. Nowy Jork (74°W) leży 95° na zachód od Warszawy: 95 × 4 = 380 minut, czyli około 6 godz. 20 min wcześniej.`,"topic.8.step.seasons.title":`Dzień polarny i noc polarna`,"topic.8.step.seasons.body":`Oś Ziemi jest nachylona. Zmieniaj datę: około 21 czerwca w okolicy bieguna północnego cały czas jest dzień, a około 21 grudnia — cały czas noc.`,"topic.8.step.zones.title":`Czy wiesz, że…? Strefy czasowe`,"topic.8.step.zones.body":`Zegarki nie pokazują czasu słonecznego. Cały kraj ma jedną strefę czasową, dlatego w Warszawie Słońce jest najwyżej zimą około 11:36 (10:36 UTC + 1 godzina), a latem około 12:36 (10:36 UTC + 2 godziny).`,"topic.8.step.play.title":`Laboratorium dnia i nocy`,"topic.8.step.play.body":`Zmieniaj godzinę, datę i położenie punktu. Obserwuj zegary i linię południa.`,"topic.9.step.gps.title":`Twój telefon wie, gdzie jest`,"topic.9.step.gps.body":`Telefon ustala swoje położenie dzięki satelitom (GPS i podobne systemy). Podaje je jako szerokość i długość geograficzną — te same, których się uczysz — w systemie o nazwie WGS 84.`,"topic.9.step.decimal.title":`Współrzędne jako ułamki dziesiętne`,"topic.9.step.decimal.body":`Aplikacje z mapami, na przykład Mapy Google, zapisują współrzędne jako dwie liczby dziesiętne: najpierw szerokość, potem długość geograficzną. Katowice to mniej więcej 50.2649, 19.0238. Uwaga: w aplikacjach część dziesiętną oddziela kropka, a nie przecinek.`,"topic.9.step.signs.title":`Minus zamiast litery`,"topic.9.step.signs.body":`W zapisie dziesiętnym nie ma liter. Minus oznacza południe (przy szerokości) albo zachód (przy długości). Sydney to -33.8688, 151.2093, a Nowy Jork to 40.7128, -74.0060. Przesuń punkt i zobacz, kiedy pojawia się minus.`,"topic.9.step.dms.title":`Stopnie, minuty, sekundy`,"topic.9.step.dms.body":`Jeden stopień ma 60 minut, a jedna minuta ma 60 sekund. 50.2649° = 50°15′54″N. Przesuń punkt i porównaj oba zapisy.`,"topic.9.step.find.title":`Znajdź współrzędne w aplikacji`,"topic.9.step.find.body":`W Mapach Google naciśnij i przytrzymaj miejsce na mapie (na komputerze: kliknij prawym przyciskiem myszy). Pojawią się współrzędne. Możesz też wpisać współrzędne w wyszukiwarkę, żeby znaleźć miejsce. Ta strona nie jest powiązana z Google.`,"topic.9.step.mercator.title":`Dlaczego Grenlandia wydaje się ogromna`,"topic.9.step.mercator.body":`Większość aplikacji z mapami używa mapy Merkatora. Zachowuje ona prawidłowe kształty i kierunki na małych obszarach, ale rozciąga wszystko blisko biegunów. Na mapie Merkatora Grenlandia wygląda na mniej więcej tak dużą jak Afryka, a naprawdę Afryka jest 14 razy większa. Porównaj z mapą Equal Earth i z globusem.`,"topic.9.step.swap.title":`Uważaj na kolejność`,"topic.9.step.swap.body":`Jeśli zamienisz liczby miejscami, trafisz gdzie indziej: 19.0238, 50.2649 to nie Katowice, tylko miejsce na pustyni w Arabii Saudyjskiej. Zawsze najpierw podaje się szerokość geograficzną.`,"topic.9.step.play.title":`Twoja kolej`,"topic.9.step.play.body":`Przesuwaj punkt i odczytuj jego współrzędne: z literami, jako ułamki dziesiętne oraz w stopniach, minutach i sekundach. Włącz warstwę szkół Maple Bear i znajdź szkołę.`,"mode.rehearsal.title":`Próbny sprawdzian`,"mode.rehearsal.summary":`15 różnych pytań, jak na prawdziwym sprawdzianie`,"mode.classQuiz.title":`Quiz dla klasy`,"mode.classQuiz.summary":`Duże pytania na dużym ekranie dla całej klasy`,"mode.lab.title":`Laboratorium dnia i nocy`,"mode.lab.summary":`Przesuwaj Słońce i patrz, jak zmienia się czas`,"mode.cheatsheet.title":`Ściąga`,"mode.cheatsheet.summary":`Najważniejsze zasady na jednej stronie do wydruku`,"mode.worksheet.title":`Karta pracy`,"mode.worksheet.summary":`Wydrukuj pytania z mapami i odpowiedziami`,"worksheet.intro":`Wybierz tematy, poziom i liczbę pytań. Ten sam kod zawsze tworzy tę samą kartę pracy.`,"worksheet.code":`Kod karty pracy`,"worksheet.newCode":`Nowy kod`,"worksheet.showKey":`Dodaj odpowiedzi (na osobnej stronie)`,"worksheet.preview":`Podgląd`,"worksheet.sheetTitle":`Karta pracy: współrzędne geograficzne`,"worksheet.name":`Imię i nazwisko`,"worksheet.class":`Klasa`,"worksheet.date":`Data`,"worksheet.meta":`{level} · Tematy: {topics} · Pytania: {count} · Kod: {code}`,"worksheet.markPoint":`Zaznacz punkt {coords} na mapie.`,"worksheet.answer":`Odpowiedź`,"worksheet.time":`Godzina`,"worksheet.keyTitle":`Odpowiedzi`,"worksheet.map":`Mapa do pytania {n}`,"cheat.title":`Ściąga: współrzędne geograficzne`,"cheat.subtitle":`Najważniejsze zasady na jednej stronie`,"cheat.print":`Drukuj / Zapisz jako PDF`,"cheat.printHint":`W oknie drukowania wybierz A4 i „Zapisz jako PDF”, aby dostać plik.`,"cheat.foot":`{app} · © {year} {author} · Licencja treści: CC BY 4.0`,"cheat.grid.title":`Siatka geograficzna`,"cheat.grid.1":`Równik to równoleżnik 0°. Dzieli Ziemię na półkulę północną (N) i południową (S).`,"cheat.grid.2":`Południk zerowy (Greenwich) to 0°. Razem z południkiem 180° dzieli Ziemię na półkulę wschodnią (E) i zachodnią (W).`,"cheat.grid.3":`Szerokość geograficzna: od 0° do 90°N lub 90°S. Długość geograficzna: od 0° do 180°E lub 180°W.`,"cheat.grid.4":`Najpierw szerokość, potem długość: 52°N, 21°E. Szerokość 0° i długość 0° lub 180° nie mają litery.`,"cheat.read.title":`Odczytywanie współrzędnych`,"cheat.read.1":`Znajdź równoleżnik przechodzący przez punkt i odczytaj jego liczbę przy lewej krawędzi: N powyżej równika, S poniżej.`,"cheat.read.2":`Znajdź południk przechodzący przez punkt i odczytaj jego liczbę przy dolnej krawędzi: E na prawo od Greenwich, W na lewo.`,"cheat.read.3":`Między dwiema liniami policz stopnie: w połowie między 40° a 50° jest 45°.`,"cheat.rel.title":`Gdzie to jest?`,"cheat.rel.1":`Północ jest na górze, południe na dole, wschód po prawej, zachód po lewej.`,"cheat.rel.2":`Każde miejsce o szerokości N leży na północ od każdego miejsca o szerokości S. Długość E to na wschód od Greenwich, W — na zachód.`,"cheat.rel.3":`Przy N i E większa liczba to dalej na północ lub wschód. Przy S i W większa liczba to dalej na południe lub zachód: 40°S leży na południe od 20°S.`,"cheat.min.title":`Stopnie i minuty`,"cheat.min.1":`1° = 60′ (60 minut). 30′ = ½°, 15′ = ¼°, 45′ = ¾°.`,"cheat.min.2":`52°30′N leży w połowie między 52°N a 53°N.`,"cheat.min.3":`Te same stopnie? Więcej minut to dalej od równika albo od Greenwich.`,"cheat.diff.title":`Ile stopni różnicy?`,"cheat.diff.1":`Ta sama strona równika (albo południka zerowego): odejmij. 52°N i 30°N: 52 − 30 = 22°.`,"cheat.diff.2":`Różne strony: dodaj. 30°N i 34°S: 30 + 34 = 64°.`,"cheat.diff.3":`Długości, których suma przekracza 180°: idź krótszą drogą, 360° minus suma. 140°E i 158°W: 140 + 158 = 298°, 360 − 298 = 62°.`,"cheat.dist.title":`Odległość wzdłuż południka`,"cheat.dist.1":`1° szerokości wzdłuż południka ≈ 111,2 km (111 km też jest dobrze).`,"cheat.dist.2":`Kilometry = stopnie × 111,2. Od 50°N do 40°N jest 10°: 10 × 111,2 = 1112 km.`,"cheat.dist.3":`Stopnie = kilometry ÷ 111,2. 556 km ÷ 111,2 = 5°.`,"cheat.dist.4":`Tylko wzdłuż południka: wzdłuż równoleżnika stopień jest krótszy (oprócz równika).`,"cheat.time.title":`Długość geograficzna i czas`,"cheat.time.1":`Ziemia obraca się o 360° w 24 godziny: 15° = 1 godzina, 1° = 4 minuty.`,"cheat.time.2":`Dalej na wschód jest później, dalej na zachód wcześniej.`,"cheat.time.3":`Warszawa 21°E, Kijów 31°E: 10° × 4 min = 40 min. 12:00 w Warszawie → 12:40 w Kijowie.`,"cheat.time.4":`To miejscowy czas słoneczny. Zegarki pokazują czas strefy czasowej.`,"cheat.dec.title":`Współrzędne w aplikacji z mapą`,"cheat.dec.1":`Dwie liczby dziesiętne, najpierw szerokość: Katowice ≈ 50.2649, 19.0238.`,"cheat.dec.2":`Bez liter: minus oznacza S (przy szerokości) albo W (przy długości). Sydney: -33.8688, 151.2093.`,"cheat.dec.3":`Zamień liczby, a trafisz gdzie indziej: szerokość zawsze jest pierwsza.`,"cheat.fig.equator":`równik`,"cheat.fig.prime":`południk zerowy`,"cheat.fig.north":`północ`,"cheat.fig.south":`południe`,"cheat.fig.later":`wschód: później`,"cheat.fig.earlier":`zachód: wcześniej`,"lab.intro":`Przesuwaj Słońce w ciągu dnia i roku. Zobacz, jak dzień i noc wędrują po Ziemi i która jest godzina w różnych miejscach.`,"lab.time":`Godzina (UTC, Greenwich)`,"lab.date":`Dzień roku`,"lab.now":`Teraz`,"lab.play":`Obracaj Ziemię`,"lab.pause":`Zatrzymaj`,"lab.clocks":`Która godzina jest w tych miejscach?`,"lab.clocksHint":`Od zachodu na wschód: im dalej na wschód, tym później.`,"lab.place":`Miejsce`,"lab.solarTime":`Czas słoneczny`,"lab.dayNight":`Dzień czy noc`,"lab.day":`dzień`,"lab.night":`noc`,"lab.dawn":`świt`,"lab.dusk":`zmierzch`,"lab.twilight":`świt lub zmierzch`,"lab.thePoint":`Punkt ({lon})`,"lab.noon":`Południe`,"lab.keyDates":`Ważne dni w roku`,"lab.keyDate.march":`Równonoc wiosenna`,"lab.keyDate.june":`Przesilenie letnie`,"lab.keyDate.september":`Równonoc jesienna`,"lab.keyDate.december":`Przesilenie zimowe`,"lab.didYouKnowTitle":`Czy wiesz, że…?`,"lab.didYouKnow":`Zegarki nie pokazują czasu słonecznego. Cały kraj ma jedną strefę czasową, dlatego w Warszawie Słońce jest najwyżej zimą około 11:36, a latem około 12:36.`,"footer.madeBy":`Autor: {name}`,"footer.mapData":`Dane mapy: {source}`,"footer.schools":`Położenie szkół: strony Maple Bear (stan z {date}), przybliżone. Ta strona nie jest oficjalnie powiązana z Maple Bear.`,"footer.label":`O tej stronie`,"footer.website":`{name} – strona internetowa`,"footer.github":`{name} na GitHubie`,"map.stage":`Mapa`,"map.chooseView":`Wybierz widok`,"map.view.globe":`Globus`,"map.view.flat":`Mapa`,"map.view.cross-section":`Przekrój`,"map.daylight.label":`Dzień i noc na Ziemi`,"map.flat.label":`Mapa świata z równoleżnikami i południkami`,"map.flat.hint":`Strzałki przesuwają punkt (Shift: 10 razy dalej). Plus i minus przybliżają.`,"map.zoomGroup":`Powiększenie`,"map.zoomIn":`Przybliż`,"map.zoomOut":`Oddal`,"map.presetGroup":`Przejdź do`,"map.preset.world":`Świat`,"map.preset.europe":`Europa`,"map.preset.poland":`Polska`,"map.projection":`Rodzaj mapy`,"map.projection.grid":`Mapa z siatką`,"map.projection.equal-earth":`Equal Earth`,"map.projection.mercator":`Mapa z aplikacji (Merkator)`,"map.projection.hint":`Mapa z siatką: proste południki, łatwo odczytać współrzędne. Equal Earth: państwa mają prawdziwą wielkość, południki są wygięte. Mapa z aplikacji (Merkator): używa jej większość aplikacji z mapami; kształty na małych obszarach są prawidłowe, ale lądy blisko biegunów są o wiele za duże.`,"map.globe.label":`Globus, który możesz obracać`,"map.globe.hint":`Przeciągnij, aby obrócić globus. Strzałki przesuwają punkt albo obracają globus, gdy punktu nie można przesuwać. Plus i minus przybliżają; Ctrl i przewijanie też przybliżają.`,"map.turnGroup":`Obracanie i powiększenie`,"map.globeZoomIn":`Przybliż globus`,"map.globeZoomOut":`Oddal globus`,"map.turnWest":`Obróć globus na zachód`,"map.turnEast":`Obróć globus na wschód`,"map.turnNorth":`Pochyl globus na północ`,"map.turnSouth":`Pochyl globus na południe`,"map.showPoint":`Pokaż punkt`,"map.schools":`Szkoły Maple Bear`,"map.schools.hint":`Pokazuje szkoły Maple Bear na całym świecie. Liczba oznacza grupę szkół: kliknij ją, aby przybliżyć (albo zobaczyć listę, gdy szkoły są w jednym miejscu). Pod mapami jest lista wszystkich szkół. Położenie jest przybliżone. Ta strona nie jest oficjalnie powiązana z Maple Bear.`,"map.schools.count#one":`{count} szkoła`,"map.schools.count#few":`{count} szkoły`,"map.schools.count#many":`{count} szkół`,"map.schools.count#other":`{count} szkoły`,"cross.label":`Przekrój Ziemi pokazujący szerokość geograficzną jako kąt`,"cross.desc":`Szerokość geograficzna to kąt między płaszczyzną równika a linią od środka Ziemi do punktu: {value}.`,"cross.centre":`środek Ziemi`,"cross.axis":`oś Ziemi`,"cross.parallel":`równoleżnik`,"cross.northPole":`N`,"cross.southPole":`S`,"controls.latitude":`Szerokość geograficzna`,"controls.longitude":`Długość geograficzna`,"controls.readout":`Współrzędne punktu`,"controls.readout.decimal":`Zapis dziesiętny (jak w aplikacjach z mapami)`,"controls.readout.letters":`Z literami`,"controls.readout.dms":`Stopnie, minuty, sekundy`,"controls.decrease":`Zmniejsz: {name}`,"controls.increase":`Zwiększ: {name}`,"places.title":`Miejsca`,"places.goTo":`Przenieś punkt do: {place}`,"schools.show":`Pokaż na mapie: {school}`,"schools.note":`Wybierz szkołę, aby zobaczyć ją na mapie. Położenie jest przybliż
