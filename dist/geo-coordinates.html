ne.explain.arcticCircle":`Koło podbiegunowe północne to równoleżnik około 66½°N.`,"q.nameLine.explain.antarcticCircle":`Koło podbiegunowe południowe to równoleżnik około 66½°S.`,"q.nameLine.explainHemi.N":`Półkula północna to wszystko, co leży na północ od równika.`,"q.nameLine.explainHemi.S":`Półkula południowa to wszystko, co leży na południe od równika.`,"q.nameLine.explainHemi.E":`Półkula wschodnia to wszystko, co leży na wschód od południka zerowego, aż do 180°.`,"q.nameLine.explainHemi.W":`Półkula zachodnia to wszystko, co leży na zachód od południka zerowego, aż do 180°.`,"q.nameLine.explainPoint":`Punkt A ma współrzędne {coords}, więc leży na półkulach: {nsHemi} i {ewHemi}.`,"q.nameLine.hemiAdj.N":`północnej`,"q.nameLine.hemiAdj.S":`południowej`,"q.nameLine.hemiAdj.E":`wschodniej`,"q.nameLine.hemiAdj.W":`zachodniej`,"q.dirWord.N":`na północ`,"q.dirWord.S":`na południe`,"q.dirWord.E":`na wschód`,"q.dirWord.W":`na zachód`,"q.further.prompt.N":`Który punkt leży najdalej na północ?`,"q.further.prompt.S":`Który punkt leży najdalej na południe?`,"q.further.prompt.E":`Który punkt leży najdalej na wschód?`,"q.further.prompt.W":`Który punkt leży najdalej na zachód?`,"q.further.option":`Punkt {label}: {coord}`,"q.further.explain":`Punkt {label} ({coord}) leży najdalej {dir}. {rule}`,"q.further.explain2":`Punkt {label} ({coord}) leży najdalej {dir}. {rule} {rule2}`,"q.further.mistake.opposite":`Ten punkt leży najdalej {dir} — to przeciwny kierunek!`,"q.rule.mixed.lat":`Każde miejsce o szerokości N leży na północ od każdego miejsca o szerokości S.`,"q.rule.mixed.lon":`Każde miejsce o długości E leży na wschód od każdego miejsca o długości W (jeśli nie przechodzimy przez południk 180°).`,"q.rule.bigger.N":`Na półkuli północnej większa liczba oznacza, że miejsce leży dalej na północ.`,"q.rule.bigger.S":`Na półkuli południowej większa liczba oznacza, że miejsce leży dalej na południe.`,"q.rule.bigger.E":`Na półkuli wschodniej większa liczba oznacza, że miejsce leży dalej na wschód.`,"q.rule.bigger.W":`Na półkuli zachodniej większa liczba oznacza, że miejsce leży dalej na zachód.`,"q.rule.zero.lat":`Miejsca o szerokości N leżą na północ od równika (0°), a miejsca o szerokości S — na południe od niego.`,"q.rule.zero.lon":`Miejsca o długości E leżą na wschód od południka zerowego (0°), a miejsca o długości W — na zachód od niego.`,"q.relative.prompt.lat":`Czy punkt A ({point}) leży na północ, czy na południe od równoleżnika {line}?`,"q.relative.prompt.lon":`Czy punkt A ({point}) leży na wschód, czy na zachód od południka {line}?`,"q.opt.north":`Na północ od niego`,"q.opt.south":`Na południe od niego`,"q.opt.east":`Na wschód od niego`,"q.opt.west":`Na zachód od niego`,"q.relative.explain.lat":`Punkt A ma szerokość {value}, a równoleżnik to {line}, więc punkt leży {dir} od równoleżnika. {rule}`,"q.relative.explain.lon":`Punkt A ma długość {value}, a południk to {line}, więc punkt leży {dir} od południka. {rule}`,"q.read.prompt":`Jakie współrzędne ma ten punkt?`,"q.read.explain":`Punkt leży na równoleżniku {lat} i na południku {lon}, więc jego współrzędne to {coords}.`,"q.place.prompt":`Ustaw punkt w miejscu o współrzędnych {coords}.`,"q.place.explain":`Najpierw znajdź równoleżnik {lat}, potem południk {lon}. Punkt stawiasz tam, gdzie się przecinają.`,"q.which.prompt":`Który znacznik ma współrzędne {coords}?`,"q.which.option":`Znacznik {label}`,"q.which.explain":`Znacznik {label} ma współrzędne {coords}. To {place}!`,"q.answer.coords":`{coords}`,"q.answer.deg":`{n}°`,"q.answer.km":`{n} km`,"q.answer.h":`{n} godz.`,"q.answer.min":`{n} min`,"q.answer.clock":`{time}`,"q.answer.none":`—`,"q.mistake.nsLetter":`Sprawdź literę: N oznacza na północ od równika, a S — na południe od niego.`,"q.mistake.ewLetter":`Sprawdź literę: E oznacza na wschód od Greenwich, a W — na zachód od niego.`,"q.mistake.bothLetters":`Obie litery są odwrotnie. N lub S mówi, czy w górę, czy w dół, a E lub W — czy w prawo, czy w lewo.`,"q.mistake.swapped":`Szerokość i długość są zamienione miejscami. Szerokość (N lub S) zawsze piszemy pierwszą.`,"q.mistake.minutes":`Blisko! Sprawdź minuty: 30′ to pół stopnia, a 15′ to ćwierć stopnia.`,"q.diff.prompt.lat":`Jaka jest różnica szerokości geograficznej między punktami A ({a}) i B ({b})?`,"q.diff.prompt.lon":`Jaka jest różnica długości geograficznej między punktami A ({a}) i B ({b})?`,"q.diff.explain.same.lat":`Oba punkty leżą po tej samej stronie równika, więc odejmujemy: {big} − {small} = {result}°.`,"q.diff.explain.same.lon":`Oba punkty leżą po tej samej stronie południka zerowego, więc odejmujemy: {big} − {small} = {result}°.`,"q.diff.explain.opposite.lat":`Punkty leżą po różnych stronach równika, więc dodajemy: {x} + {y} = {result}°.`,"q.diff.explain.opposite.lon":`Punkty leżą po różnych stronach południka zerowego, więc dodajemy: {x} + {y} = {result}°.`,"q.diff.explain.zero.lat":`Jeden punkt leży na równiku (0°), więc różnica to po prostu druga liczba: {result}°.`,"q.diff.explain.zero.lon":`Jeden punkt leży na południku zerowym (0°), więc różnica to po prostu druga liczba: {result}°.`,"q.diff.explain.over180":`Punkty leżą po różnych stronach południka zerowego, więc dodajemy: {x} + {y} = {sum}°. To więcej niż 180°, więc wybieramy krótszą drogę — przez południk 180°: 360 − {sum} = {result}°.`,"q.diff.mistake.subtracted.lat":`Tu nie odejmujemy: punkty leżą po różnych stronach równika, więc liczby trzeba dodać.`,"q.diff.mistake.subtracted.lon":`Tu nie odejmujemy: punkty leżą po różnych stronach południka zerowego, więc liczby trzeba dodać.`,"q.diff.mistake.added.lat":`Tu nie dodajemy: oba punkty leżą po tej samej stronie równika, więc od większej liczby odejmij mniejszą.`,"q.diff.mistake.added.lon":`Tu nie dodajemy: oba punkty leżą po tej samej stronie południka zerowego, więc od większej liczby odejmij mniejszą.`,"q.diff.mistake.over180":`Dodawanie było dobre, ale suma jest większa niż 180°. Wybierz krótszą drogę: 360° minus suma.`,"q.diff.mistake.subtractedOver180":`Tu nie odejmujemy: punkty leżą po różnych stronach południka zerowego. Dodaj liczby, a ponieważ suma jest większa niż 180°, oblicz 360° minus suma.`,"q.dist.prompt":`Punkty A ({a}) i B ({b}) leżą na tym samym południku. Ile kilometrów wynosi odległość między nimi?`,"q.dist.promptReverse":`Dwa miejsca na tym samym południku są oddalone o {km} km. O ile stopni szerokości geograficznej się różnią?`,"q.dist.explain":`{diff} Jeden stopień wzdłuż południka to około 111,2 km, więc {deg} × 111,2 = {km} km.`,"q.dist.explainReverse":`Jeden stopień wzdłuż południka to około 111,2 km, więc dzielimy: {km} : 111,2 = {deg}°.`,"q.dist.note111":`Liczysz 111 km na stopień — to też dobrze! Dokładniej to 111,2 km.`,"q.dist.mistake.degrees":`To jest liczba stopni. Pomnóż ją przez 111,2, aby otrzymać kilometry.`,"q.dist.mistake.multiplied":`Tu nie mnożymy: aby zamienić kilometry na stopnie, podziel przez 111,2.`,"q.time.prompt.later":`Gdzie jest późniejszy czas słoneczny: w punkcie A ({a}) czy w punkcie B ({b})?`,"q.time.opt.a":`W punkcie A`,"q.time.opt.b":`W punkcie B`,"q.time.explain.later.east":`{rule} Zatem B leży dalej na wschód niż A. Słońce wcześniej dociera do miejsc położonych dalej na wschód, więc czas słoneczny w punkcie B jest późniejszy.`,"q.time.explain.later.west":`{rule} Zatem A leży dalej na wschód niż B. Słońce wcześniej dociera do miejsc położonych dalej na wschód, więc czas słoneczny w punkcie A jest późniejszy.`,"q.time.rule.across180.east":`Krótsza droga z A do B ma tylko {deg}° i prowadzi na wschód, przez południk 180°, gdzie długość E zmienia się w długość W.`,"q.time.rule.across180.west":`Krótsza droga z A do B ma tylko {deg}° i prowadzi na zachód, przez południk 180°, gdzie długość W zmienia się w długość E.`,"q.time.prompt.clock":`W punkcie A ({a}) jest {time} czasu słonecznego. Która godzina czasu słonecznego jest w punkcie B ({b})?`,"q.time.explain.clock":`{diff} {minutes} {calc}`,"q.time.minutes":`Każdy 1° to 4 minuty czasu: {deg} × 4 = {min} min.`,"q.time.minutesLong":`Każdy 1° to 4 minuty czasu: {deg} × 4 = {min} min ({duration}).`,"q.time.calc.east":`{rule} B leży dalej na wschód, więc czas jest tam późniejszy: {timeA} + {min} min = {timeB}.`,"q.time.calc.eastNextDay":`{rule} B leży dalej na wschód, więc czas jest tam późniejszy: {timeA} + {min} min = {timeB} następnego dnia.`,"q.time.calc.eastPrevDay":`{rule} B leży dalej na wschód, więc czas jest tam późniejszy: {timeA} + {min} min = {timeB}. Ale gdy idziesz na wschód przez południk 180°, data cofa się o jeden dzień, więc w punkcie B jest jeszcze poprzedni dzień.`,"q.time.calc.west":`{rule} B leży dalej na zachód, więc czas jest tam wcześniejszy: {timeA} − {min} min = {timeB}.`,"q.time.calc.westPrevDay":`{rule} B leży dalej na zachód, więc czas jest tam wcześniejszy: {timeA} − {min} min = {timeB} poprzedniego dnia.`,"q.time.calc.westNextDay":`{rule} B leży dalej na zachód, więc czas jest tam wcześniejszy: {timeA} − {min} min = {timeB}. Ale gdy idziesz na zachód przez południk 180°, data przesuwa się o jeden dzień do przodu, więc w punkcie B jest już następny dzień.`,"q.time.prompt.degrees":`O ile stopni długości geograficznej są od siebie oddalone dwa miejsca, jeśli ich czas słoneczny różni się o {duration}?`,"q.time.explain.degrees":`{duration} to {min} min. Każde 4 minuty czasu to 1° długości geograficznej: {min} : 4 = {deg}°.`,"q.time.explain.degreesShort":`Każde 4 minuty czasu to 1° długości geograficznej: {min} : 4 = {deg}°.`,"q.time.duration":`{h} godz. {m} min`,"q.time.duration.h":`{h} godz.`,"q.time.duration.m":`{m} min`,"q.time.mistake.direction":`Zły kierunek! Dalej na wschód jest później, a dalej na zachód — wcześniej.`,"q.time.mistake.over180":`Przez południk 180° wybierz krótszą drogę: 360° minus suma. I pamiętaj, że dalej na wschód jest później.`,"q.time.mistake.perDegree":`Pamiętaj: 1° długości geograficznej to 4 minuty czasu, a nie 1 minuta.`,"q.time.mistake.minutes":`To jest liczba minut. Podziel ją przez 4, aby otrzymać stopnie.`,"q.time.mistake.multiplied":`Tu nie mnożymy: aby zamienić minuty na stopnie, podziel przez 4.`,"practice.difficulty":`Poziom trudności`,"difficulty.easy":`Łatwy`,"difficulty.medium":`Średni`,"difficulty.hard":`Trudny`,"practice.progress":`Pytanie {n} z {total}`,"practice.check":`Sprawdź`,"practice.next":`Następne pytanie`,"practice.results":`Zobacz wynik`,"practice.correct":`Dobrze!`,"practice.incorrect":`Nie całkiem`,"practice.correctAnswer":`Poprawna odpowiedź: {answer}`,"practice.done":`Koniec rundy`,"practice.score":`Masz {score} na {total}`,"practice.best":`Twój najlepszy wynik: {best} na {total}`,"practice.newRound":`Nowa runda`,"practice.harder":`Spróbuj trudniejszych pytań`,"practice.review":`Twoje odpowiedzi`,"practice.backToLearn":`Wróć do nauki`,"practice.needAnswer":`Najpierw wybierz lub wpisz odpowiedź.`,"practice.resultCorrect":`dobrze`,"practice.resultWrong":`źle`,"practice.hint":`Podpowiedź`,"practice.hintTag":`z podpowiedzią`,"celebrate.perfect":`Idealna runda! Wszystkie odpowiedzi są dobre.`,"home.best":`Najlepiej: {score}/{total} · {level}`,"home.bestLong":`Twój najlepszy wynik: {score} na {total}, poziom {level}`,"home.notPractised":`Jeszcze bez ćwiczeń`,"q.hint.name-line":`Równik (0°) biegnie dookoła środka Ziemi. Południk zerowy (0°) łączy bieguny i przechodzi przez Greenwich. Północ jest na górze, wschód po prawej. Zwrotniki leżą na około 23½°, koła podbiegunowe na około 66½°.`,"q.hint.further":`Północ jest na górze, a wschód po prawej. Każda szerokość N leży na północ od każdej szerokości S, a E leży na wschód od W. Na południu i na zachodzie większa liczba oznacza dalej na południe albo dalej na zachód.`,"q.hint.relative-line":`Porównaj liczbę punktu z liczbą linii i spójrz na litery. Przy N lub E większa liczba to dalej na północ lub wschód; przy S lub W większa liczba to dalej na południe lub zachód.`,"q.hint.read-coords":`Najpierw znajdź równoleżnik przechodzący przez punkt i odczytaj jego liczbę przy lewej krawędzi, potem południk i jego liczbę przy dolnej krawędzi. Nie zapomnij o literach.`,"q.hint.place-point":`Najpierw szerokość: znajdź równoleżnik (liczby przy lewej krawędzi), potem południk (liczby przy dolnej krawędzi). Punkt stawiasz tam, gdzie się przecinają.`,"q.hint.which-place":`Przy każdym znaczniku odczytaj równoleżnik przy lewej krawędzi i południk przy dolnej krawędzi, i sprawdź litery: N czy S, E czy W.`,"q.hint.difference":`Ta sama strona linii → odejmij. Różne strony → dodaj. Więcej niż 180° → 360° minus suma.`,"q.hint.distance":`Jeden stopień szerokości wzdłuż południka to około 111,2 km. Stopnie × 111,2 = kilometry; kilometry ÷ 111,2 = stopnie.`,"q.hint.time":`15° = 1 godzina, 1° = 4 minuty. Na wschodzie jest później, na zachodzie wcześniej.`,"input.chooseOne":`Wybierz jedną odpowiedź`,"input.correctOption":`poprawna odpowiedź`,"input.lat":`Szerokość geograficzna`,"input.lon":`Długość geograficzna`,"input.example":`Na przykład: {example}`,"input.invalid":`Wpisz tak: {example}`,"input.usePoint":`Przesuń punkt na mapie (albo użyj suwaków) i naciśnij Sprawdź.`,"input.number":`Twoja odpowiedź`,"input.numberInvalid":`Wpisz liczbę, na przykład 25`,"input.clock":`Godzina (godz.:min)`,"input.clockInvalid":`Wpisz godzinę tak: 13:24`,"unit.label.deg":`°`,"unit.label.km":`km`,"unit.label.h":`godz.`,"unit.label.min":`min`,"rehearsal.intro":`15 pytań ze wszystkich tematów. Odpowiedzi zobaczysz na końcu, jak po prawdziwym sprawdzianie.`,"rehearsal.start":`Zaczynamy`,"rehearsal.submitNext":`Zapisz i dalej`,"rehearsal.finish":`Zakończ sprawdzian`,"rehearsal.results":`Twoje wyniki`,"rehearsal.yourAnswer":`Twoja odpowiedź: {answer}`,"rehearsal.learn":`Poznaj: {title}`,"rehearsal.practise":`Ćwicz: {title}`,"rehearsal.again":`Spróbuj kolejnego sprawdzianu`,"classQuiz.setup":`Ustaw quiz`,"classQuiz.seed":`Kod quizu (ten sam kod = te same pytania)`,"classQuiz.topics":`Tematy`,"classQuiz.count":`Liczba pytań`,"classQuiz.timer":`Czas do namysłu`,"classQuiz.timerOff":`Bez limitu`,"classQuiz.seconds":`{n} s`,"classQuiz.start":`Rozpocznij quiz`,"classQuiz.reveal":`Pokaż odpowiedź`,"classQuiz.prev":`Poprzednie`,"classQuiz.next":`Następne`,"classQuiz.end":`Zakończ quiz`,"classQuiz.keys":`Spacja: odpowiedź · →: dalej · ←: wstecz · Esc: koniec`,"classQuiz.timeUp":`Koniec czasu!`,"classQuiz.answer":`Odpowiedź: {answer}`,"classQuiz.noTopics":`Wybierz co najmniej jeden temat.`},Yi={"app.title":`Координати на земній кулі`,"app.shortTitle":`Координати`,"app.skip":`Перейти до основного вмісту`,"unit.degree#one":`{count} градус`,"unit.degree#few":`{count} градуси`,"unit.degree#many":`{count} градусів`,"unit.degree#other":`{count} градуса`,"unit.minute#one":`{count} хвилина`,"unit.minute#few":`{count} хвилини`,"unit.minute#many":`{count} хвилин`,"unit.minute#other":`{count} хвилини`,"unit.second#one":`{count} секунда`,"unit.second#few":`{count} секунди`,"unit.second#many":`{count} секунд`,"unit.second#other":`{count} секунди`,"dir.north":`північної широти`,"dir.south":`південної широти`,"dir.east":`східної довготи`,"dir.west":`західної довготи`,"spoken.lat":`{amount} {dir}`,"spoken.lon":`{amount} {dir}`,"spoken.zero":`{amount}`,"header.language":`Мова`,"header.settings":`Налаштування`,"header.home":`Головна`,"header.presenter":`Режим презентації`,"header.laser":`Указка`,"presenter.hint":`P: режим презентації · L: указка · Esc: вийти з режиму презентації`,"settings.title":`Налаштування`,"settings.theme":`Колірна тема`,"settings.theme.system":`Як на пристрої`,"settings.theme.light":`Світла`,"settings.theme.dark":`Темна`,"settings.largeText":`Більший текст`,"settings.reducedMotion":`Менше анімації`,"settings.close":`Закрити`,"home.intro":`Кожне місце на Землі має свою адресу з двох чисел: широти й довготи. Навчімося її читати!`,"home.topics":`Теми`,"home.more":`Перевір себе й досліджуй`,"home.explore":`Вивчай`,"home.practice":`Тренуйся`,"topic.nav":`Розділи теми`,"topic.explore":`Вивчай`,"topic.practice":`Тренуйся`,"topic.prev":`Попередня тема: {title}`,"topic.next":`Наступна тема: {title}`,"topic.soon":`Ця тема незабаром.`,"explore.progress":`Крок {n} з {total}`,"explore.prev":`Назад`,"explore.next":`Далі`,"explore.goto":`Перейти до кроку {n}`,"explore.practiceNow":`Потренуйся з цієї теми`,"explore.backHome":`До списку тем`,"explore.keysHint":`Порада: клавіші ← і → перемикають кроки.`,"topic.1.title":`Градусна сітка`,"topic.1.summary":`Меридіани, паралелі, екватор і півкулі`,"topic.2.title":`Де це?`,"topic.2.summary":`Північніше чи південніше паралелі, східніше чи західніше меридіана`,"topic.3.title":`Визначення координат`,"topic.3.summary":`Визнач широту й довготу точки`,"topic.4.title":`Пошук місця`,"topic.4.summary":`Познач точку на карті за координатами`,"topic.5.title":`Градуси й хвилини`,"topic.5.summary":`Один градус має 60 хвилин`,"topic.6.title":`На скільки градусів різниця?`,"topic.6.summary":`Різниця широт і довгот`,"topic.7.title":`Відстань уздовж меридіана`,"topic.7.summary":`Один градус — це приблизно 111,2 км`,"topic.8.title":`Довгота і час`,"topic.8.summary":`День, ніч і місцевий сонячний час`,"topic.9.title":`Координати у твоєму телефоні`,"topic.9.summary":`Десятковий запис, застосунки з картами і карта Меркатора`,"topic.1.step.ball.title":`Земля — куля`,"topic.1.step.ball.body":`Щоб точно визначити місце на кулі, ми малюємо на ній уявну сітку. Сітка має два види ліній: паралелі й меридіани. Перетягни глобус, щоб його обернути.`,"topic.1.step.equator.title":`Екватор`,"topic.1.step.equator.body":`Екватор оперізує Землю посередині. Це найдовша паралель, і його широта — 0°. Він ділить Землю на Північну й Південну півкулі.`,"topic.1.step.parallels.title":`Паралелі`,"topic.1.step.parallels.body":`Паралелі — це кола, які йдуть паралельно до екватора. Що ближче до полюса, то вони коротші. Вони показують широту: від 0° на екваторі до 90° пн. ш. на Північному полюсі або 90° пд. ш. на Південному полюсі.`,"topic.1.step.angle.title":`Чому градуси?`,"topic.1.step.angle.body":`Широта — це кут! Уяви лінію від центру Землі до місця. Кут між цією лінією та екватором і є широтою. Перетягни точку на колі й подивись, як змінюється кут.`,"topic.1.step.meridians.title":`Меридіани`,"topic.1.step.meridians.body":`Меридіани — це півкола, що з'єднують Північний і Південний полюси. Усі меридіани мають однакову довжину. Вони показують довготу.`,"topic.1.step.prime.title":`Нульовий меридіан і 180°`,"topic.1.step.prime.body":`Нульовий меридіан (0°) проходить через Гринвіч у Лондоні. На протилежному боці Землі лежить меридіан 180°. Разом вони ділять Землю на Східну й Західну півкулі. Довгота йде від 0° до 180° сх. д. або 180° зх. д.`,"topic.1.step.projections.title":`Багато карт, одна сітка`,"topic.1.step.projections.body":`Плоска карта завжди трохи розтягнута, бо Земля кругла. Ця карта називається Equal Earth: кожна країна зберігає свій справжній розмір, тому меридіани вигнуті. Координати однакові на кожній карті. Спробуй карту-сітку в Лабораторії, щоб порівняти.`,"topic.1.step.tropics.title":`Тропіки й полярні кола`,"topic.1.step.tropics.body":`Деякі паралелі мають власні назви: Тропік Рака (близько 23½° пн. ш.), Тропік Козерога (близько 23½° пд. ш.), Північне полярне коло (близько 66½° пн. ш.) і Південне полярне коло (близько 66½° пд. ш.).`,"topic.1.step.play.title":`Спробуй сам`,"topic.1.step.play.body":`Перетягуй точку в різні місця. Коли вона в Північній півкулі? Коли вона в Західній півкулі? Знайди Тропік Рака.`,"topic.2.step.north-south.title":`На північ чи на південь?`,"topic.2.step.north-south.body":`На карті північ угорі. Варшава (52° пн. ш.) лежить на північ від паралелі 50° пн. ш. Рим (42° пн. ш.) лежить на південь від неї. У Північній півкулі більше число означає далі на північ.`,"topic.2.step.southern.title":`Обережно на півдні!`,"topic.2.step.southern.body":`У Південній півкулі більше число означає далі на південь. 40° пд. ш. лежить на південь від 20° пд. ш., а 10° пд. ш. лежить на північ від неї.`,"topic.2.step.east-west.title":`На схід чи на захід?`,"topic.2.step.east-west.body":`Схід — праворуч на карті. Київ (31° сх. д.) лежить на схід від меридіана 20° сх. д. Лондон (0°) лежить на захід від нього. У Східній півкулі більше число означає далі на схід.`,"topic.2.step.western.title":`Обережно на заході!`,"topic.2.step.western.body":`У Західній півкулі більше число означає далі на захід. 100° зх. д. лежить на захід від 60° зх. д., а 30° зх. д. лежить на схід від неї.`,"topic.2.step.across-zero.title":`По обидва боки лінії`,"topic.2.step.across-zero.body":`Будь-яке місце з північною широтою лежить на північ від будь-якого місця з південною широтою. Будь-яке місце зі східною довготою лежить на схід від Гринвіча, а будь-яке місце із західною довготою лежить на захід від нього.`,"topic.2.step.play.title":`Спробуй сам`,"topic.2.step.play.body":`Перемісти точку й скажи вголос: вона на північ чи на південь від екватора? На схід чи на захід від Гринвіча? Потім перевір координати під картою.`,"topic.3.step.address.title":`Адреса у двох числах`,"topic.3.step.address.body":`Координати записують спершу як широту, потім як довготу: 52° пн. ш., 21° сх. д. Це Варшава!`,"topic.3.step.latitude.title":`Крок 1: широта`,"topic.3.step.latitude.body":`Знайди паралель, яка проходить через точку, і прочитай її число біля лівого краю карти. Точка вище екватора (пн. ш.) чи нижче (пд. ш.)?`,"topic.3.step.longitude.title":`Крок 2: довгота`,"topic.3.step.longitude.body":`Тепер знайди меридіан, який проходить через точку, і прочитай його число біля нижнього краю карти. Точка праворуч від Гринвіча (сх. д.) чи ліворуч (зх. д.)?`,"topic.3.step.answer.title":`Склади разом`,"topic.3.step.answer.body":`Точка лежить на паралелі 30° пн. ш. і на меридіані 30° сх. д. Її координати — 30° пн. ш., 30° сх. д. — зовсім близько від Каїра.`,"topic.3.step.between.title":`Між лініями`,"topic.3.step.between.body":`Якщо точка лежить між двома лініями, порахуй градуси. Посередині між 40° і 50° буде 45°.`,"topic.3.step.southwest.title":`Південь і захід`,"topic.3.step.southwest.body":`Спробуй сам: яка паралель і який меридіан проходять через цю точку? Пам'ятай про позначки пд. ш. і зх. д. (Відповідь: 30° пд. ш., 60° зх. д.)`,"topic.3.step.globe.title":`На глобусі`,"topic.3.step.globe.body":`Сітка працює так само на глобусі. Оберни глобус, щоб знайти точку біля Сіднея: 34° пд. ш., 151° сх. д.`,"topic.3.step.two-cities.title":`Нью-Йорк і Краків`,"topic.3.step.two-cities.body":`Нью-Йорк лежить на 41° пн. ш., 74° зх. д., а Краків — на 50° пн. ш., 20° сх. д. Обидва міста на північ від екватора, але Нью-Йорк — на захід від Гринвіча, а Краків — на схід. Саме про це й кажуть позначки.`,"topic.3.step.play.title":`Спробуй сам`,"topic.3.step.play.body":`Перетягни точку, скажи вголос її координати, а потім перевір відповідь під картою.`,"topic.4.step.plan.title":`Від чисел до місця`,"topic.4.step.plan.body":`Знайдімо місце з координатами 50° пн. ш., 20° сх. д. Спочатку знайди паралель: 50° пн. ш.`,"topic.4.step.meridian.title":`Тепер меридіан`,"topic.4.step.meridian.body":`Тепер знайди меридіан 20° сх. д. Пам'ятай: сх. д. означає праворуч від Гринвіча.`,"topic.4.step.cross.title":`Там, де лінії перетинаються`,"topic.4.step.cross.body":`Це місце лежить там, де перетинаються обидві лінії. Це Краків!`,"topic.4.step.letters.title":`Позначки мають значення`,"topic.4.step.letters.body":`34° пд. ш., 151° сх. д. — це Сідней. А от 34° пн. ш., 151° зх. д. — це середина Тихого океану! Завжди перевіряй пн. ш. чи пд. ш. і сх. д. чи зх. д.`,"topic.4.step.play.title":`Спробуй сам`,"topic.4.step.play.body":`Перетягуй точку, щоб знаходити місця, або обери місто зі списку й перевір його координати.`,"topic.5.step.sixty.title":`Градус має 60 хвилин`,"topic.5.step.sixty.body":`Один градус ділять на 60 хвилин. Хвилини позначають знаком ′. Тому 52°30′ пн. ш. лежить рівно посередині між 52° пн. ш. і 53° пн. ш.`,"topic.5.step.quarters.title":`Половинки й чверті`,"topic.5.step.quarters.body":`30′ — це пів градуса. 15′ — це чверть градуса, а 45′ — три чверті. Ця точка лежить на 52°15′ пн. ш., 21°45′ сх. д.`,"topic.5.step.warsaw.title":`Варшава точно`,"topic.5.step.warsaw.body":`Центр Варшави лежить приблизно на 52°14′ пн. ш., 21°01′ сх. д. На шкільній карті це часто округлюють до 52° пн. ш., 21° сх. д.`,"topic.5.step.compare.title":`Яка точка далі на північ?`,"topic.5.step.compare.body":`52°45′ пн. ш. лежить на північ від 52°15′ пн. ш.: градуси однакові, але хвилин більше. У південній півкулі більше хвилин означає, що місце лежить далі на південь.`,"topic.5.step.play.title":`Спробуй сам`,"topic.5.step.play.body":`Кожне натискання стрілки зсуває точку на 1′, а зі Shift — на 1°. Знайди 52°30′ пн. ш., 20°45′ сх. д.`,"topic.6.step.same-lat.title":`Один бік: віднімаємо`,"topic.6.step.same-lat.body":`Варшава лежить на 52° пн. ш., а Каїр — на 30° пн. ш. Обидва міста на північ від екватора, тож віднімаємо: 52 − 30 = 22°.`,"topic.6.step.opposite-lat.title":`Різні боки: додаємо`,"topic.6.step.opposite-lat.body":`Каїр лежить на 30° пн. ш., а Кейптаун — на 34° пд. ш. Між ними екватор, тож додаємо: 30 + 34 = 64°.`,"topic.6.step.same-lon.title":`З довготою так само`,"topic.6.step.same-lon.body":`Київ лежить на 31° сх. д., а Варшава — на 21° сх. д. Обидва міста на схід від Гринвіча: 31 − 21 = 10°.`,"topic.6.step.opposite-lon.title":`Через Гринвіч: додаємо`,"topic.6.step.opposite-lon.body":`Нью-Йорк лежить на 74° зх. д., а Варшава — на 21° сх. д. Між ними нульовий (Гринвіцький) меридіан: 74 + 21 = 95°.`,"topic.6.step.over-180.title":`Більше ніж 180°? Іди в інший бік`,"topic.6.step.over-180.body":`Токіо лежить на 140° сх. д., а Гонолулу — на 158° зх. д. 140 + 158 = 298°, а це більше ніж 180°. Коротший шлях проходить через меридіан 180°: 360 − 298 = 62°.`,"topic.6.step.play.title":`Спробуй сам`,"topic.6.step.play.body":`Перетягни точку. На скільки градусів широти й довготи вона відрізняється від Варшави (52° пн. ш., 21° сх. д.)?`,"topic.7.step.degree-length.title":`Який завдовжки один градус?`,"topic.7.step.degree-length.body":`Меридіан проходить від полюса до полюса: це приблизно 20 016 км і 180°. Тому один градус уздовж меридіана — це приблизно 111,2 км.`,"topic.7.step.example.title":`Градуси в кілометри`,"topic.7.step.example.body":`Дві точки лежать на одному меридіані, на 50° пн. ш. і 40° пн. ш. Між ними 10°: 10 × 111,2 = 1112 км.`,"topic.7.step.across-equator.title":`Через екватор`,"topic.7.step.across-equator.body":`Від 10° пн. ш. до 20° пд. ш. уздовж меридіана: 10 + 20 = 30°, тож 30 × 111,2 = 3336 км.`,"topic.7.step.reverse.title":`Кілометри в градуси`,"topic.7.step.reverse.body":`Якщо два місця лежать на одному меридіані й відстань між ними 556 км, ділимо: 556 : 111,2 = 5°.`,"topic.7.step.only-meridians.title":`Чому лише вздовж меридіанів?`,"topic.7.step.only-meridians.body":`Паралелі стають коротшими ближче до полюсів, тож один градус уздовж паралелі коротший за 111,2 км (крім екватора). Тому це правило використовують лише вздовж меридіанів.`,"topic.7.step.play.title":`Спробуй сам`,"topic.7.step.play.body":`Переміщуй точку вздовж меридіана. Її відстань від екватора — це її широта × 111,2 км.`,"topic.8.step.rotation.title":`Земля обертається`,"topic.8.step.rotation.body":`Земля обертається один раз за добу, із заходу на схід. На половині, зверненій до Сонця, — день, а на другій половині — ніч. Посувай повзунок часу й дивись, як рухається ніч.`,"topic.8.step.noon.title":`Полудень на меридіані`,"topic.8.step.noon.body":`Коли Сонце стоїть найвище над якимсь меридіаном, уздовж усього цього меридіана, від полюса до полюса, настає полудень — 12:00 за місцевим сонячним часом.`,"topic.8.step.fifteen.title":`15° щогодини`,"topic.8.step.fifteen.body":`За 24 години Земля повертається на 360°. Це 15° щогодини і 1° кожні 4 хвилини.`,"topic.8.step.east-later.title":`На сході пізніше`,"topic.8.step.east-later.body":`Сонце сходить на сході, тому в місцях, що лежать далі на схід, сонячний час пізніший. Коли в Лондоні (0°) 12:00, у Варшаві (21° сх. д.) приблизно 13:24: 21 × 4 хв = 84 хв.`,"topic.8.step.calculate.title":`Порахуймо`,"topic.8.step.calculate.body":`Варшаву (21° сх. д.) і Київ (31° сх. д.) розділяють 10°, тобто 10 × 4 = 40 хвилин. Коли у Варшаві 12:00 за сонячним часом, у Києві 12:40, бо Київ лежить далі на схід.`,"topic.8.step.far-away.title":`Далекі місця`,"topic.8.step.far-away.body":`Делі (77° сх. д.) лежить на 56° східніше від Варшави (21° сх. д.): 56 × 4 = 224 хвилини, тобто приблизно на 3 год 44 хв пізніше. Нью-Йорк (74° зх. д.) лежить на 95° західніше від Варшави: 95 × 4 = 380 хвилин, тобто приблизно на 6 год 20 хв раніше.`,"topic.8.step.seasons.title":`Полярний день і полярна ніч`,"topic.8.step.seasons.body":`Земна вісь нахилена. Змінюй дату: приблизно 21 червня біля Північного полюса весь час день, а приблизно 21 грудня — весь час ніч.`,"topic.8.step.zones.title":`Чи знаєш ти? Часові пояси`,"topic.8.step.zones.body":`Годинники не показують сонячного часу. Уся країна живе в одному часовому поясі, тому у Варшаві Сонце найвище взимку близько 11:36 (10:36 UTC + 1 година), а влітку — близько 12:36 (10:36 UTC + 2 години).`,"topic.8.step.play.title":`Лабораторія дня і ночі`,"topic.8.step.play.body":`Змінюй час, дату й положення точки. Стеж за годинниками та лінією полудня.`,"topic.9.step.gps.title":`Твій телефон знає, де він`,"topic.9.step.gps.body":`Телефон визначає своє місце за допомогою супутників (GPS і подібних систем). Він показує його як широту й довготу — ті самі, які ти вивчаєш, — у системі WGS 84.`,"topic.9.step.decimal.title":`Координати десятковими дробами`,"topic.9.step.decimal.body":`Застосунки з картами, наприклад Google Карти, записують координати двома десятковими числами: спочатку широта, потім довгота. Катовиці — це приблизно 50.2649, 19.0238. Зверни увагу: у застосунках дробову частину відділяє крапка, а не кома.`,"topic.9.step.signs.title":`Мінус замість літер`,"topic.9.step.signs.body":`У десятковому записі немає літер. Мінус означає південну широту або західну довготу. Сідней — це -33.8688, 151.2093, а Нью-Йорк — 40.7128, -74.0060. Посунь точку й подивися, коли з’являється мінус.`,"topic.9.step.dms.title":`Градуси, хвилини, секунди`,"topic.9.step.dms.body":`Один градус має 60 хвилин, а одна хвилина — 60 секунд. 50.2649° = 50°15′54″ пн. ш. Посувай точку й порівнюй обидва записи.`,"topic.9.step.find.title":`Знайди координати в застосунку`,"topic.9.step.find.body":`У Google Картах натисни й утримуй місце на карті (на комп’ютері — клацни правою кнопкою миші). З’являться координати. Також можна ввести координати в пошук, щоб знайти місце. Цей сайт не пов’язаний з Google.`,"topic.9.step.mercator.title":`Чому Гренландія здається величезною`,"topic.9.step.mercator.body":`Більшість застосунків із картами використовують карту Меркатора. Вона правильно передає обриси й напрямки на невеликих ділянках, але розтягує все біля полюсів. На карті Меркатора Гренландія здається приблизно такою ж великою, як Африка, а насправді Африка в 14 разів більша. Порівняй із картою Equal Earth і глобусом.`,"topic.9.step.swap.title":`Не переплутай порядок`,"topic.9.step.swap.body":`Якщо поміняти числа місцями, потрапиш в інше місце: 19.0238, 50.2649 — це не Катовиці, а місце в пустелі в Саудівській Аравії. Широта завжди перша.`,"topic.9.step.play.title":`Твоя черга`,"topic.9.step.play.body":`Посувай точку й читай її координати: з літерами, десятковими дробами та в градусах, хвилинах і секундах. Увімкни шар шкіл Maple Bear і знайди школу.`,"mode.rehearsal.title":`Пробна контрольна`,"mode.rehearsal.summary":`15 різних запитань, як на справжній контрольній`,"mode.classQuiz.title":`Вікторина для класу`,"mode.classQuiz.summary":`Великі запитання на великому екрані для всього класу`,"mode.lab.title":`Лабораторія дня і ночі`,"mode.lab.summary":`Рухай Сонце й дивись, як змінюється час`,"mode.cheatsheet.title":`Шпаргалка`,"mode.cheatsheet.summary":`Усі головні правила на одній сторінці для друку`,"mode.worksheet.title":`Робочий аркуш`,"mode.worksheet.summary":`Надрукуй запитання з картами й відповідями`,"worksheet.intro":`Обери теми, рівень і кількість запитань. Той самий код завжди дає той самий робочий аркуш.`,"worksheet.code":`Код робочого аркуша`,"worksheet.newCode":`Новий код`,"worksheet.showKey":`Додати відповіді (на окремій сторінці)`,"worksheet.preview":`Попередній перегляд`,"worksheet.sheetTitle":`Робочий аркуш: географічні координати`,"worksheet.name":`Ім’я та прізвище`,"worksheet.class":`Клас`,"worksheet.date":`Дата`,"worksheet.meta":`{level} · Теми: {topics} · Запитань: {count} · Код: {code}`,"worksheet.markPoint":`Познач точку {coords} на карті.`,"worksheet.answer":`Відповідь`,"worksheet.time":`Час`,"worksheet.keyTitle":`Відповіді`,"worksheet.map":`Карта до запитання {n}`,"cheat.title":`Шпаргалка: географічні координати`,"cheat.subtitle":`Головні правила на одній сторінці`,"cheat.print":`Друк / Зберегти як PDF`,"cheat.printHint":`У вікні друку вибери формат А4 і «Зберегти як PDF», щоб отримати файл.`,"cheat.foot":`{app} · © {year} {author} · Ліцензія на вміст: CC BY 4.0`,"cheat.grid.title":`Градусна сітка`,"cheat.grid.1":`Екватор — це паралель 0°. Він ділить Землю на Північну (пн. ш.) і Південну (пд. ш.) півкулі.`,"cheat.grid.2":`Нульовий (Гринвіцький) меридіан — це 0°. Разом із меридіаном 180° він ділить Землю на Східну (сх. д.) і Західну (зх. д.) півкулі.`,"cheat.grid.3":`Широта: від 0° до 90° пн. ш. або 90° пд. ш. Довгота: від 0° до 180° сх. д. або 180° зх. д.`,"cheat.grid.4":`Спочатку широта, потім довгота: 52° пн. ш., 21° сх. д. Широта 0° і довгота 0° або 180° записуються без позначки.`,"cheat.read.title":`Як прочитати координати`,"cheat.read.1":`Знайди паралель, що проходить через точку, і прочитай її число біля лівого краю: пн. ш. — вище екватора, пд. ш. — нижче.`,"cheat.read.2":`Знайди меридіан, що проходить через точку, і прочитай його число біля нижнього краю: сх. д. — праворуч від Гринвіча, зх. д. — ліворуч.`,"cheat.read.3":`Між двома лініями порахуй градуси: посередині між 40° і 50° — 45°.`,"cheat.rel.title":`Де це?`,"cheat.rel.1":`Північ угорі, південь унизу, схід праворуч, захід ліворуч.`,"cheat.rel.2":`Будь-яке місце з північною широтою лежить північніше за будь-яке місце з південною. Східна довгота — на схід від Гринвіча, західна — на захід.`,"cheat.rel.3":`Для пн. ш. і сх. д. більше число — далі на північ або схід. Для пд. ш. і зх. д. більше число — далі на південь або захід: 40° пд. ш. південніше за 20° пд. ш.`,"cheat.min.title":`Градуси й мінути`,"cheat.min.1":`1° = 60′ (60 мінут). 30′ = ½°, 15′ = ¼°, 45′ = ¾°.`,"cheat.min.2":`52°30′ пн. ш. — посередині між 52° пн. ш. і 53° пн. ш.`,"cheat.min.3":`Градуси однакові? Більше мінут — далі від екватора або від Гринвіча.`,"cheat.diff.title":`На скільки градусів різниця?`,"cheat.diff.1":`Один бік від екватора (або від нульового меридіана): віднімай. 52° пн. ш. і 30° пн. ш.: 52 − 30 = 22°.`,"cheat.diff.2":`Різні боки: додавай. 30° пн. ш. і 34° пд. ш.: 30 + 34 = 64°.`,"cheat.diff.3":`Довготи, сума яких більша за 180°: коротший шлях — 360° мінус сума. 140° сх. д. і 158° зх. д.: 140 + 158 = 298°, 360 − 298 = 62°.`,"cheat.dist.title":`Відстань уздовж меридіана`,"cheat.dist.1":`1° широти вздовж меридіана ≈ 111,2 км (111 км теж правильно).`,"cheat.dist.2":`Кілометри = градуси × 111,2. Від 50° пн. ш. до 40° пн. ш. — 10°: 10 × 111,2 = 1112 км.`,"cheat.dist.3":`Градуси = кілометри ÷ 111,2. 556 км ÷ 111,2 = 5°.`,"cheat.dist.4":`Лише вздовж меридіана: уздовж паралелі градус коротший (крім екватора).`,"cheat.time.title":`Довгота й час`,"cheat.time.1":`Земля обертається на 360° за 24 години: 15° = 1 година, 1° = 4 хвилини.`,"cheat.time.2":`Далі на схід — пізніше, далі на захід — раніше.`,"cheat.time.3":`Варшава 21° сх. д., Київ 31° сх. д.: 10° × 4 хв = 40 хв. 12:00 у Варшаві → 12:40 у Києві.`,"cheat.time.4":`Це місцевий сонячний час. Годинники показують час часового поясу.`,"cheat.dec.title":`Координати в застосунку з картою`,"cheat.dec.1":`Два десяткові числа, спочатку широта: Катовиці ≈ 50.2649, 19.0238.`,"cheat.dec.2":`Без позначок: мінус означає пд. ш. (для широти) або зх. д. (для довготи). Сідней: -33.8688, 151.2093.`,"cheat.dec.3":`Поміняєш числа місцями — потрапиш в інше місце: широта завжди перша.`,"cheat.fig.equator":`екватор`,"cheat.fig.prime":`нульовий меридіан`,"cheat.fig.north":`північ`,"cheat.fig.south":`південь`,"cheat.fig.later":`схід: пізніше`,"cheat.fig.earlier":`захід: раніше`,"lab.intro":`Рухай Сонце протягом доби й року. Дивись, як день і ніч мандрують Землею і котра година в різних місцях.`,"lab.time":`Час (UTC, Гринвіч)`,"lab.date":`День року`,"lab.now":`Зараз`,"lab.play":`Обертати Землю`,"lab.pause":`Зупинити`,"lab.clocks":`Котра година в цих місцях?`,"lab.clocksHint":`Із заходу на схід: що далі на схід, то пізніше.`,"lab.place":`Місце`,"lab.solarTime":`Сонячний час`,"lab.dayNight":`День чи ніч`,"lab.day":`день`,"lab.night":`ніч`,"lab.dawn":`світанок`,"lab.dusk":`сутінки`,"lab.twilight":`світанок або сутінки`,"lab.thePoint":`Точка ({lon})`,"lab.noon":`Полудень`,"lab.keyDates":`Особливі дні року`,"lab.keyDate.march":`Весняне рівнодення`,"lab.keyDate.june":`Літнє сонцестояння`,"lab.keyDate.september":`Осіннє рівнодення`,"lab.keyDate.december":`Зимове сонцестояння`,"lab.didYouKnowTitle":`Чи знаєш ти?`,"lab.didYouKnow":`Годинники не показують сонячного часу. Уся країна живе в одному часовому поясі, тому у Варшаві Сонце найвище взимку близько 11:36, а влітку — близько 12:36.`,"footer.madeBy":`Автор: {name}`,"footer.mapData":`Дані карти: {source}`,"footer.schools":`Розташування шкіл: сайти Maple Bear (станом на {date}), приблизне. Цей сайт офіційно не пов’язаний з Maple Bear.`,"footer.label":`Про цю сторінку`,"footer.website":`{name} – вебсайт`,"footer.github":`{name} на GitHub`,"map.stage":`Карта`,"map.chooseView":`Оберіть вигляд`,"map.view.globe":`Глобус`,"map.view.flat":`Карта`,"map.view.cross-section":`Переріз`,"map.daylight.label":`День і ніч на Землі`,"map.flat.label":`Карта світу з паралелями й меридіанами`,"map.flat.hint":`Стрілки рухають точку (Shift — у 10 разів далі). Плюс і мінус змінюють масштаб.`,"map.zoomGroup":`Масштаб`,"map.zoomIn":`Наблизити`,"map.zoomOut":`Віддалити`,"map.presetGroup":`Перейти до`,"map.p  позначку: сх. д. — це на схід від Гринвіча, а зх. д. — на захід від нього.`,"q.mistake.bothLetters":`Обидві позначки навпаки. Пн. ш. чи пд. ш. каже, вгору чи вниз, а сх. д. чи зх. д. — праворуч чи ліворуч.`,"q.mistake.swapped":`Широту й довготу переставлено місцями. Широту (пн. ш. чи пд. ш.) завжди пишемо першою.`,"q.mistake.minutes":`Майже! Перевір хвилини: 30′ — це пів градуса, а 15′ — чверть градуса.`,"q.diff.prompt.lat":`Яка різниця широт між точками A ({a}) і B ({b})?`,"q.diff.prompt.lon":`Яка різниця довгот між точками A ({a}) і B ({b})?`,"q.diff.explain.same.lat":`Обидві точки лежать по один бік від екватора, тож віднімаємо: {big} − {small} = {result}°.`,"q.diff.explain.same.lon":`Обидві точки лежать по один бік від нульового меридіана, тож віднімаємо: {big} − {small} = {result}°.`,"q.diff.explain.opposite.lat":`Точки лежать по різні боки від екватора, тож додаємо: {x} + {y} = {result}°.`,"q.diff.explain.opposite.lon":`Точки лежать по різні боки від нульового меридіана, тож додаємо: {x} + {y} = {result}°.`,"q.diff.explain.zero.lat":`Одна точка лежить на екваторі (0°), тож різниця — це просто друге число: {result}°.`,"q.diff.explain.zero.lon":`Одна точка лежить на нульовому меридіані (0°), тож різниця — це просто друге число: {result}°.`,"q.diff.explain.over180":`Точки лежать по різні боки від нульового меридіана, тож додаємо: {x} + {y} = {sum}°. Це більше ніж 180°, тож вибираємо коротший шлях — через меридіан 180°: 360 − {sum} = {result}°.`,"q.diff.mistake.subtracted.lat":`Тут не віднімають: точки лежать по різні боки від екватора, тож числа треба додати.`,"q.diff.mistake.subtracted.lon":`Тут не віднімають: точки лежать по різні боки від нульового меридіана, тож числа треба додати.`,"q.diff.mistake.added.lat":`Тут не додають: обидві точки лежать по один бік від екватора, тож від більшого числа відніми менше.`,"q.diff.mistake.added.lon":`Тут не додають: обидві точки лежать по один бік від нульового меридіана, тож від більшого числа відніми менше.`,"q.diff.mistake.over180":`Додавати було правильно, але сума більша за 180°. Обери коротший шлях: 360° мінус сума.`,"q.diff.mistake.subtractedOver180":`Тут не віднімають: точки лежать по різні боки від нульового меридіана. Додай числа, а оскільки сума більша за 180°, обчисли 360° мінус сума.`,"q.dist.prompt":`Точки A ({a}) і B ({b}) лежать на одному меридіані. Яка відстань між ними в кілометрах?`,"q.dist.promptReverse":`Два місця на одному меридіані розташовані на відстані {km} км. На скільки градусів широти вони відрізняються?`,"q.dist.explain":`{diff} Один градус уздовж меридіана — це приблизно 111,2 км, тож {deg} × 111,2 = {km} км.`,"q.dist.explainReverse":`Один градус уздовж меридіана — це приблизно 111,2 км, тож ділимо: {km} : 111,2 = {deg}°.`,"q.dist.note111":`Ти рахуєш 111 км на градус — це теж добре! Точніше — 111,2 км.`,"q.dist.mistake.degrees":`Це кількість градусів. Помнож її на 111,2, щоб отримати кілометри.`,"q.dist.mistake.multiplied":`Тут не множать: щоб перевести кілометри в градуси, поділи на 111,2.`,"q.time.prompt.later":`Де місцевий сонячний час пізніший: у точці A ({a}) чи в точці B ({b})?`,"q.time.opt.a":`У точці A`,"q.time.opt.b":`У точці B`,"q.time.explain.later.east":`{rule} Отже, B лежить далі на схід, ніж A. Сонце раніше приходить у місця, що лежать далі на схід, тому місцевий сонячний час у точці B пізніший.`,"q.time.explain.later.west":`{rule} Отже, A лежить далі на схід, ніж B. Сонце раніше приходить у місця, що лежать далі на схід, тому місцевий сонячний час у точці A пізніший.`,"q.time.rule.across180.east":`Коротший шлях з A до B — лише {deg}°, і він веде на схід, через меридіан 180°, де східна довгота змінюється на західну.`,"q.time.rule.across180.west":`Коротший шлях з A до B — лише {deg}°, і він веде на захід, через меридіан 180°, де західна довгота змінюється на східну.`,"q.time.prompt.clock":`У точці A ({a}) місцевий сонячний час — {time}. Котра година за місцевим сонячним часом у точці B ({b})?`,"q.time.explain.clock":`{diff} {minutes} {calc}`,"q.time.minutes":`Кожен 1° — це 4 хвилини часу: {deg} × 4 = {min} хв.`,"q.time.minutesLong":`Кожен 1° — це 4 хвилини часу: {deg} × 4 = {min} хв ({duration}).`,"q.time.calc.east":`{rule} B лежить далі на схід, тому час там пізніший: {timeA} + {min} хв = {timeB}.`,"q.time.calc.eastNextDay":`{rule} B лежить далі на схід, тому час там пізніший: {timeA} + {min} хв = {timeB} наступного дня.`,"q.time.calc.eastPrevDay":`{rule} B лежить далі на схід, тому час там пізніший: {timeA} + {min} хв = {timeB}. Але коли йдеш на схід через меридіан 180°, дата повертається на один день назад, тож у точці B ще попередній день.`,"q.time.calc.west":`{rule} B лежить далі на захід, тому час там раніший: {timeA} − {min} хв = {timeB}.`,"q.time.calc.westPrevDay":`{rule} B лежить далі на захід, тому час там раніший: {timeA} − {min} хв = {timeB} попереднього дня.`,"q.time.calc.westNextDay":`{rule} B лежить далі на захід, тому час там раніший: {timeA} − {min} хв = {timeB}. Але коли йдеш на захід через меридіан 180°, дата переходить на один день уперед, тож у точці B уже наступний день.`,"q.time.prompt.degrees":`На скільки градусів довготи віддалені одне від одного два місця, якщо їхній сонячний час відрізняється на {duration}?`,"q.time.explain.degrees":`{duration} — це {min} хв. Кожні 4 хвилини часу — це 1° довготи: {min} : 4 = {deg}°.`,"q.time.explain.degreesShort":`Кожні 4 хвилини часу — це 1° довготи: {min} : 4 = {deg}°.`,"q.time.duration":`{h} год {m} хв`,"q.time.duration.h":`{h} год`,"q.time.duration.m":`{m} хв`,"q.time.mistake.direction":`Не той напрямок! Далі на схід — пізніший час, а далі на захід — раніший.`,"q.time.mistake.over180":`Через меридіан 180° обирай коротший шлях: 360° мінус сума. І пам’ятай, що далі на схід — пізніший час.`,"q.time.mistake.perDegree":`Пам’ятай: 1° довготи — це 4 хвилини часу, а не 1 хвилина.`,"q.time.mistake.minutes":`Це кількість хвилин. Поділи її на 4, щоб отримати градуси.`,"q.time.mistake.multiplied":`Тут не множать: щоб перевести хвилини в градуси, по ., сх. д. тощо).`,"q.hint.place-point":`Спочатку широта: знайди паралель (числа біля лівого краю), потім меридіан (числа біля нижнього краю). Точка стоїть там, де вони перетинаються.`,"q.hint.which-place":`Для кожної позначки прочитай паралель біля лівого краю й меридіан біля нижнього краю та перевір: пн. ш. чи пд. ш., сх. д. чи зх. д.`,"q.hint.difference":`Один бік від лінії → віднімай. Різні боки → додавай. Більше ніж 180° → 360° мінус сума.`,"q.hint.distance":`Один градус широти вздовж меридіана — це приблизно 111,2 км. Градуси × 111,2 = кілометри; кілометри ÷ 111,2 = градуси.`,"q.hint.time":`15° = 1 година, 1° = 4 хвилини. На сході пізніше, на заході раніше.`,"input.chooseOne":`Обери одну відповідь`,"input.correctOption":`правильна відповідь`,"input.lat":`Географічна широта`,"input.lon":`Географічна довгота`,"input.example":`Наприклад: {example}`,"input.invalid":`Запиши так: {example}`,"input.usePoint":`Перемісти точку на карті (або скористайся повзунками) і натисни «Перевірити».`,"input.number":`Твоя відповідь`,"input.numberInvalid":`Введи число, наприклад 25`,"input.clock":`Час (год:хв)`,"input.clockInvalid":`Запиши час так: 13:24`,"unit.label.deg":`°`,"unit.label.km":`км`,"unit.label.h":`год`,"unit.label.min":`хв`,"rehearsal.intro":`15 запитань з усіх тем. Відповіді побачиш у кінці, як після справжньої контрольної.`,"rehearsal.start":`Почати`,"rehearsal.submitNext":`Зберегти й далі`,"rehearsal.finish":`Завершити контрольну`,"rehearsal.results":`Твої результати`,"rehearsal.yourAnswer":`Твоя відповідь: {answer}`,"rehearsal.learn":`Вивчай: {title}`,"rehearsal.practise":`Тренуйся: {title}`,"rehearsal.again":`Спробуй ще одну контрольну`,"classQuiz.setup":`Налаштуй вікторину`,"classQuiz.seed":`Код вікторини (той самий код = ті самі питання)`,"classQuiz.topics":`Теми`,"classQuiz.count":`Кількість запитань`,"classQuiz.timer":`Час на роздуми`,"classQuiz.timerOff":`Без таймера`,"classQuiz.seconds":`{n} с`,"classQuiz.start":`Почати вікторину`,"classQuiz.reveal":`Показат
