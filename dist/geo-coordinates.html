,"topic.practice":`Practise`,"topic.prev":`Previous topic: {title}`,"topic.next":`Next topic: {title}`,"topic.soon":`This topic is coming soon.`,"explore.progress":`Step {n} of {total}`,"explore.prev":`Previous`,"explore.next":`Next`,"explore.goto":`Go to step {n}`,"explore.practiceNow":`Practise this topic`,"explore.keysHint":`Tip: use ← and → keys to change steps.`,"topic.1.title":`The globe grid`,"topic.1.summary":`Meridians, parallels, the equator and hemispheres`,"topic.2.title":`Where is it?`,"topic.2.summary":`North or south of a parallel, east or west of a meridian`,"topic.3.title":`Reading coordinates`,"topic.3.summary":`Find the latitude and longitude of a point`,"topic.4.title":`Finding a place`,"topic.4.summary":`Put a point on the map from its coordinates`,"topic.5.title":`Degrees and minutes`,"topic.5.summary":`One degree has 60 minutes`,"topic.6.title":`How many degrees apart?`,"topic.6.summary":`Differences in latitude and longitude`,"topic.7.title":`Distance along a meridian`,"topic.7.summary":`One degree is about 111.2 km`,"topic.8.title":`Longitude and time`,"topic.8.summary":`Day, night and local solar time`,"topic.1.step.ball.title":`The Earth is a ball`,"topic.1.step.ball.body":`To say exactly where a place is on a ball, we draw an imaginary grid on it. The grid has two kinds of lines: parallels and meridians. Drag the globe to turn it.`,"topic.1.step.equator.title":`The equator`,"topic.1.step.equator.body":`The equator goes around the middle of the Earth. It is the longest parallel and its latitude is 0°. It divides the Earth into the Northern Hemisphere and the Southern Hemisphere.`,"topic.1.step.parallels.title":`Parallels`,"topic.1.step.parallels.body":`Parallels are circles that run parallel to the equator. The closer to a pole, the shorter they are. They tell us the latitude: from 0° at the equator up to 90°N at the North Pole or 90°S at the South Pole.`,"topic.1.step.angle.title":`Why degrees?`,"topic.1.step.angle.body":`Latitude is an angle! Imagine a line from the centre of the Earth to a place. The angle between that line and the equator is the latitude. Drag the point on the circle and watch the angle change.`,"topic.1.step.meridians.title":`Meridians`,"topic.1.step.meridians.body":`Meridians are half-circles that join the North Pole and the South Pole. All meridians are the same length. They tell us the longitude.`,"topic.1.step.prime.title":`The prime meridian and 180°`,"topic.1.step.prime.body":`The prime meridian (0°) goes through Greenwich in London. On the other side of the Earth is the 180° meridian. Together they divide the Earth into the Eastern and Western Hemispheres. Longitude goes from 0° up to 180°E or 180°W.`,"topic.1.step.projections.title":`Many maps, one grid`,"topic.1.step.projections.body":`A flat map is always a little stretched, because the Earth is round. This map is called Equal Earth: every country keeps its true size, so the meridians bend. The coordinates stay the same on every map. Try the Grid map in the Lab to compare.`,"topic.1.step.tropics.title":`Tropics and polar circles`,"topic.1.step.tropics.body":`Some parallels have their own names: the Tropic of Cancer (about 23°N), the Tropic of Capricorn (about 23°S), the Arctic Circle (about 66°N) and the Antarctic Circle (about 66°S).`,"topic.1.step.play.title":`Try it yourself`,"topic.1.step.play.body":`Drag the point around. When is it in the Northern Hemisphere? When is it in the Western Hemisphere? Find the Tropic of Cancer.`,"topic.2.step.north-south.title":`North or south?`,"topic.2.step.north-south.body":`On a map, north is at the top. Warsaw (52°N) is north of the 50°N parallel. Rome (42°N) is south of it. In the Northern Hemisphere a bigger number means further north.`,"topic.2.step.southern.title":`Careful in the south!`,"topic.2.step.southern.body":`In the Southern Hemisphere a bigger number means further south. 40°S is south of 20°S, and 10°S is north of it.`,"topic.2.step.east-west.title":`East or west?`,"topic.2.step.east-west.body":`East is to the right on a map. Kyiv (31°E) is east of the 20°E meridian. London (0°) is west of it. In the Eastern Hemisphere a bigger number means further east.`,"topic.2.step.western.title":`Careful in the west!`,"topic.2.step.western.body":`In the Western Hemisphere a bigger number means further west. 100°W is west of 60°W, and 30°W is east of it.`,"topic.2.step.across-zero.title":`Across the lines`,"topic.2.step.across-zero.body":`Every place with N latitude is north of every place with S latitude. Every place with E longitude is east of Greenwich, and every place with W longitude is west of it.`,"topic.2.step.play.title":`Try it yourself`,"topic.2.step.play.body":`Move the point and say it out loud: is it north or south of the equator? East or west of Greenwich? Then check the coordinates below the map.`,"topic.3.step.address.title":`An address in two numbers`,"topic.3.step.address.body":`Coordinates are written as latitude first, then longitude: 52°N, 21°E. That is Warsaw!`,"topic.3.step.latitude.title":`Step 1: latitude`,"topic.3.step.latitude.body":`Find the parallel that goes through the point and read its number at the left edge of the map. Is the point above the equator (N) or below it (S)?`,"topic.3.step.longitude.title":`Step 2: longitude`,"topic.3.step.longitude.body":`Now find the meridian that goes through the point and read its number at the bottom edge. Is the point right of Greenwich (E) or left of it (W)?`,"topic.3.step.answer.title":`Put it together`,"topic.3.step.answer.body":`The point lies on the 30°N parallel and on the 30°E meridian. Its coordinates are 30°N, 30°E — very close to Cairo.`,"topic.3.step.between.title":`Between the lines`,"topic.3.step.between.body":`If a point lies between two lines, count the degrees. Halfway between 40° and 50° is 45°.`,"topic.3.step.southwest.title":`South and west`,"topic.3.step.southwest.body":`Try this point yourself: which parallel and which meridian go through it? Remember the letters S and W. (Answer: 30°S, 60°W.)`,"topic.3.step.globe.title":`On the globe`,"topic.3.step.globe.body":`The grid works the same way on the globe. Turn the globe to find the point near Sydney: 34°S, 151°E.`,"topic.3.step.play.title":`Try it yourself`,"topic.3.step.play.body":`Drag the point, say its coordinates out loud, then check the answer below the map.`,"topic.4.step.plan.title":`From numbers to a place`,"topic.4.step.plan.body":`Let's find 50°N, 30°E. First find the parallel: 50°N.`,"topic.4.step.meridian.title":`Then the meridian`,"topic.4.step.meridian.body":`Now find the meridian 30°E. Remember: E means to the right of Greenwich.`,"topic.4.step.cross.title":`Where the lines cross`,"topic.4.step.cross.body":`The place is where the two lines cross. It is Kyiv!`,"topic.4.step.letters.title":`Letters matter`,"topic.4.step.letters.body":`34°S, 151°E is Sydney. But 34°N, 151°W is in the middle of the Pacific Ocean! Always check N or S and E or W.`,"topic.4.step.play.title":`Try it yourself`,"topic.4.step.play.body":`Drag the point to find places, or pick a city from the list and check its coordinates.`,"topic.5.step.sixty.title":`A degree has 60 minutes`,"topic.5.step.sixty.body":`One degree is divided into 60 minutes, written with the sign ′. So 52°30′N is exactly halfway between 52°N and 53°N.`,"topic.5.step.quarters.title":`Halves and quarters`,"topic.5.step.quarters.body":`30′ is half a degree. 15′ is a quarter of a degree and 45′ is three quarters. This point is at 52°15′N, 21°45′E.`,"topic.5.step.warsaw.title":`Warsaw, exactly`,"topic.5.step.warsaw.body":`The centre of Warsaw is at about 52°14′N, 21°01′E. On a school map we often round it to 52°N, 21°E.`,"topic.5.step.compare.title":`Which is further north?`,"topic.5.step.compare.body":`52°45′N is north of 52°15′N: the degrees are the same, but it has more minutes. In the Southern Hemisphere more minutes means further south.`,"topic.5.step.play.title":`Try it yourself`,"topic.5.step.play.body":`Each arrow key press moves the point by 1′, and with Shift by 1°. Find 52°30′N, 20°45′E.`,"topic.6.step.same-lat.title":`Same side: subtract`,"topic.6.step.same-lat.body":`Warsaw is at 52°N and Cairo at 30°N. Both are north of the equator, so we subtract: 52 − 30 = 22°.`,"topic.6.step.opposite-lat.title":`Different sides: add`,"topic.6.step.opposite-lat.body":`Cairo is at 30°N and Cape Town at 34°S. The equator lies between them, so we add: 30 + 34 = 64°.`,"topic.6.step.same-lon.title":`Longitude works the same way`,"topic.6.step.same-lon.body":`Kyiv is at 31°E and Warsaw at 21°E. Both are east of Greenwich: 31 − 21 = 10°.`,"topic.6.step.opposite-lon.title":`Across Greenwich: add`,"topic.6.step.opposite-lon.body":`New York is at 74°W and Warsaw at 21°E. Greenwich lies between them: 74 + 21 = 95°.`,"topic.6.step.over-180.title":`More than 180°? Go the other way`,"topic.6.step.over-180.body":`Tokyo is at 140°E and Honolulu at 158°W. 140 + 158 = 298°, which is more than 180°. The shorter way crosses the 180° meridian: 360 − 298 = 62°.`,"topic.6.step.play.title":`Try it yourself`,"topic.6.step.play.body":`Drag the point. How many degrees of latitude and longitude is it from Warsaw (52°N, 21°E)?`,"topic.7.step.degree-length.title":`How long is one degree?`,"topic.7.step.degree-length.body":`A meridian runs from pole to pole: about 20,000 km and 180°. So one degree along a meridian is about 111.2 km.`,"topic.7.step.example.title":`Degrees into kilometres`,"topic.7.step.example.body":`Two points on the same meridian, at 50°N and 40°N, are 10° apart: 10 × 111.2 = 1112 km.`,"topic.7.step.across-equator.title":`Across the equator`,"topic.7.step.across-equator.body":`From 10°N to 20°S along a meridian: 10 + 20 = 30°, so 30 × 111.2 = 3336 km.`,"topic.7.step.reverse.title":`Kilometres into degrees`,"topic.7.step.reverse.body":`If two places on one meridian are 556 km apart, divide: 556 ÷ 111.2 = 5°.`,"topic.7.step.only-meridians.title":`Why only along meridians?`,"topic.7.step.only-meridians.body":`Parallels get shorter towards the poles, so one degree along a parallel is shorter than 111.2 km (except on the equator). That is why we use this rule along meridians.`,"topic.7.step.play.title":`Try it yourself`,"topic.7.step.play.body":`Move the point along the meridian. Its distance from the equator is its latitude × 111.2 km.`,"mode.rehearsal.title":`Test rehearsal`,"mode.rehearsal.summary":`15 mixed questions, like a real test`,"mode.classQuiz.title":`Class quiz`,"mode.classQuiz.summary":`Big questions on the big screen for the whole class`,"mode.lab.title":`Day and night lab`,"mode.lab.summary":`Move the Sun and watch the time change`,"lab.intro":`Move the point anywhere on Earth and watch its coordinates change.`,"footer.madeBy":`Made by {name}`,"footer.mapData":`Map data: {source}`,"footer.label":`About this page`,"map.stage":`Map`,"map.chooseView":`Choose view`,"map.view.globe":`Globe`,"map.view.flat":`Map`,"map.view.cross-section":`Cross-section`,"map.flat.label":`World map with parallels and meridians`,"map.flat.hint":`Arrow keys move the point (Shift: 10 times further). Plus and minus zoom.`,"map.zoomIn":`Zoom in`,"map.zoomOut":`Zoom out`,"map.zoomHint":`Hold Ctrl and scroll to zoom`,"map.preset.world":`World`,"map.preset.europe":`Europe`,"map.preset.poland":`Poland`,"map.projection":`Map type`,"map.projection.grid":`Grid map`,"map.projection.equal-earth":`Equal Earth`,"map.projection.hint":`Grid map: straight meridians, easy to read coordinates. Equal Earth: countries keep their true size, meridians are curved.`,"map.globe.label":`Globe that you can turn`,"map.globe.hint":`Drag to turn the globe. Arrow keys move the point, or turn the globe when the point cannot move. Plus and minus zoom; Ctrl and scroll also zoom.`,"map.globeZoomIn":`Zoom in on the globe`,"map.globeZoomOut":`Zoom out on the globe`,"map.turnWest":`Turn globe to show the west`,"map.turnEast":`Turn globe to show the east`,"map.turnNorth":`Tilt globe to show the north`," ,"place.sydney":`Sydney`,"place.auckland":`Auckland`,"place.suva":`Suva (Fiji)`,"place.northpole":`North Pole`,"place.southpole":`South Pole`,"label.europe":`Europe`,"label.asia":`Asia`,"label.africa":`Africa`,"label.northamerica":`North America`,"label.southamerica":`South America`,"label.australia":`Australia`,"label.antarctica":`Antarctica`,"label.pacific":`Pacific Ocean`,"label.atlantic":`Atlantic Ocean`,"label.indian":`Indian Ocean`,"label.arctic":`Arctic Ocean`,"q.nameLine.prompt":`What is the highlighted line?`,"q.nameLine.promptHemi":`Which hemisphere is highlighted?`,"q.nameLine.promptPoint":`In which two hemispheres is point A?`,"q.opt.equator":`The equator`,"q.opt.prime":`The prime meridian (Greenwich)`,"q.opt.antimeridian":`The 180° meridian`,"q.opt.parallel":`A parallel`,"q.opt.meridian":`A meridian`,"q.opt.tropicCancer":`The Tropic of Cancer`,"q.opt.tropicCapricorn":`The Tropic of Capricorn`,"q.opt.arcticCircle":`The Arctic Circle`,"q.opt.antarcticCircle":`The Antarctic Circle`,"q.opt.pair.NE":`Northern and Eastern`,"q.opt.pair.NW":`Northern and Western`,"q.opt.pair.SE":`Southern and Eastern`,"q.opt.pair.SW":`Southern and Western`,"q.nameLine.explain.equator":`The equator is the parallel 0°. It runs around the middle of the Earth.`,"q.nameLine.explain.prime":`The prime meridian is 0°. It goes through Greenwich in London.`,"q.nameLine.explain.antimeridian":`The 180° meridian is on the opposite side of the Earth from Greenwich.`,"q.nameLine.explain.parallel":`This is the parallel {value}. Parallels are circles parallel to the equator.`,"q.nameLine.explain.meridian":`This is the meridian {value}. Meridians join the North Pole and the South Pole.`,"q.nameLine.explain.tropicCancer":`The Tropic of Cancer is the parallel at about 23½°N.`,"q.nameLine.explain.tropicCapricorn":`The Tropic of Capricorn is the parallel at about 23½°S.`,"q.nameLine.explain.arcticCircle":`The Arctic Circle is the parallel at about 66½°N.`,"q.nameLine.explain.antarcticCircle":`The Antarctic Circle is the parallel at about 66½°S.`,"q.nameLine.explainHemi.N":`The Northern Hemisphere is everything north of the equator.`,"q.nameLine.explainHemi.S":`The Southern Hemisphere is everything south of the equator.`,"q.nameLine.explainHemi.E":`The Eastern Hemisphere is everything east of the prime meridian, up to 180°.`,"q.nameLine.explainHemi.W":`The Western Hemisphere is everything west of the prime meridian, up to 180°.`,"q.nameLine.explainPoint":`Point A is at {coords}, so it is in the {nsHemi} and {ewHemi} hemispheres.`,"q.nameLine.hemiAdj.N":`Northern`,"q.nameLine.hemiAdj.S":`Southern`,"q.nameLine.hemiAdj.E":`Eastern`,"q.nameLine.hemiAdj.W":`Western`,"q.dirWord.N":`north`,"q.dirWord.S":`south`,"q.dirWord.E":`east`,"q.dirWord.W":`west`,"q.further.prompt.N":`Which point lies furthest north?`,"q.further.prompt.S":`Which point lies furthest south?`,"q.further.prompt.E":`Which point lies furthest east?`,"q.further.prompt.W":`Which point lies furthest west?`,"q.further.option":`Point {label}: {coord}`,"q.further.explain":`Point {label} ({coord}) lies furthest {dir}. {rule}`,"q.further.explain2":`Point {label} ({coord}) lies furthest {dir}. {rule} {rule2}`,"q.further.mistake.opposite":`That point lies furthest {dir} — the opposite direction!`,"q.rule.mixed.lat":`Any place with N latitude is north of any place with S latitude.`,"q.rule.mixed.lon":`Any place with E longitude is east of any place with W longitude (as long as we do not cross the 180° meridian).`,"q.rule.bigger.N":`In the Northern Hemisphere, a bigger number means further north.`,"q.rule.bigger.S":`In the Southern Hemisphere, a bigger number means further south.`,"q.rule.bigger.E":`In the Eastern Hemisphere, a bigger number means further east.`,"q.rule.bigger.W":`In the Western Hemisphere, a bigger number means further west.`,"q.rule.zero.lat":`Places with N latitude lie north of the equator (0°), places with S latitude lie south of it.`,"q.rule.zero.lon":`Places with E longitude lie east of the prime meridian (0°), places with W longitude lie west of it.`,"q.relative.prompt.lat":`Is point A ({point}) north or south of the parallel {line}?`,"q.relative.prompt.lon":`Is point A ({point}) east or west of the meridian {line}?`,"q.opt.north":`North of it`,"q.opt.south":`South of it`,"q.opt.east":`East of it`,"q.opt.west":`West of it`,"q.relative.explain.lat":`Point A has latitude {value} and the parallel is {line}, so the point lies {dir} of the parallel. {rule}`,"q.relative.explain.lon":`Point A has longitude {value} and the meridian is {line}, so the point lies {dir} of the meridian. {rule}`,"q.read.prompt":`What are the coordinates of the point?`,"q.read.explain":`The point lies on the parallel {lat} and on the meridian {lon}, so its coordinates are {coords}.`,"q.place.prompt":`Move the point to {coords}.`,"q.place.explain":`First find the parallel {lat}, then the meridian {lon}. The point goes where they cross.`,"q.which.prompt":`Which marker is at {coords}?`,"q.which.option":`Marker {label}`,"q.which.explain":`Marker {label} is at {coords}. That is {place}!`,"q.answer.coords":`{coords}`,"q.answer.deg":`{n}°`,"q.answer.km":`{n} km`,"q.answer.h":`{n} h`,"q.answer.min":`{n} min`,"q.answer.clock":`{time}`,"q.answer.none":`—`,"q.mistake.nsLetter":`Check the letter: N means north of the equator, S means south of it.`,"q.mistake.ewLetter":`Check the letter: E means east of Greenwich, W means west of it.`,"q.mistake.bothLetters":`Both letters are the wrong way round. N or S says up or down, E or W says right or left.`,"q.mistake.swapped":`Latitude and longitude are swapped. Latitude (N or S) always comes first.`,"q.mistake.minutes":`Close! Check the minutes: 30′ is half a degree and 15′ is a quarter of a degree.`,"q.diff.prompt.lat":`What is the difference in latitude between A ({a}) and B ({b})?`,"q.diff.prompt.lon":`What is the difference in longitude between A ({a}) and B ({b})?`,"q.diff.explain.same.lat":`Both points are on the same side of the equator, so subtract: {big} − {small} = {result}°.`,"q.diff.explain.same.lon":`Both points are on the same side of the prime meridian, so subtract: {big} − {small} = {result}°.`,"q.diff.explain.opposite.lat":`The points are on different sides of the equator, so add: {x} + {y} = {result}°.`,"q.diff.explain.opposite.lon":`The points are on different sides of the prime meridian, so add: {x} + {y} = {result}°.`,"q.diff.explain.zero.lat":`One point lies on the equator (0°), so the difference is simply the other number: {result}°.`,"q.diff.explain.zero.lon":`One point lies on the prime meridian (0°), so the difference is simply the other number: {result}°.`,"q.diff.explain.over180":`The points are on different sides of the prime meridian, so add: {x} + {y} = {sum}°. That is more than 180°, so take the shorter way across the 180° meridian: 360 − {sum} = {result}°.`,"q.diff.mistake.subtracted.lat":`You subtracted, but the points are on different sides of the equator. Add the numbers instead.`,"q.diff.mistake.subtracted.lon":`You subtracted, but the points are on different sides of the prime meridian. Add the numbers instead.`,"q.diff.mistake.added.lat":`You added, but both points are on the same side of the equator. Subtract the smaller number from the bigger one.`,"q.diff.mistake.added.lon":`You added, but both points are on the same side of the prime meridian. Subtract the smaller number from the bigger one.`,"q.diff.mistake.over180":`Adding was right, but the sum is more than 180°. Take the shorter way: 360° minus the sum.`,"q.dist.prompt":`Points A ({a}) and B ({b}) lie on the same meridian. How far apart are they in kilometres?`,"q.dist.promptReverse":`Two places on the same meridian are {km} km apart. How many degrees of latitude apart are they?`,"q.dist.explain":`{diff} One degree along a meridian is about 111.2 km, so {deg} × 111.2 = {km} km.`,"q.dist.explainReverse":`One degree along a meridian is about 111.2 km, so divide: {km} ÷ 111.2 = {deg}°.`,"q.dist.note111":`You used 111 km per degree. That is fine! The more exact value is 111.2 km.`,"q.dist.mistake.degrees":`That is the number of degrees. Multiply it by 111.2 to get kilometres.`,"q.dist.mistake.multiplied":`You multiplied. To turn kilometres into degrees, divide by 111.2.`,"practice.difficulty":`Difficulty`,"difficulty.easy":`Easy`,"difficulty.medium":`Medium`,"difficulty.hard":`Hard`,"practice.progress":`Question {n} of {total}`,"practice.check":`Check`,"practice.next":`Next question`,"practice.results":`See results`,"practice.correct":`Correct!`,"practice.incorrect":`Not quite`,"practice.correctAnswer":`Correct answer: {answer}`,"practice.done":`Round complete`,"practice.score":`You got {score} out of {total}`,"practice.best":`Your best: {best} out of {total}`,"practice.newRound":`New round`,"practice.harder":`Try harder questions`,"practice.review":`Your answers`,"practice.backToLearn":`Back to learning`,"practice.needAnswer":`Choose or enter an answer first.`,"practice.resultCorrect":`correct`,"practice.resultWrong":`wrong`,"input.chooseOne":`Choose one answer`,"input.lat":`Latitude`,"input.lon":`Longitude`,"input.example":`For example: {example}`,"input.invalid":`Write it like this: {example}`,"input.usePoint":`Move the point on the map (or use the sliders), then press Check.`,"input.number":`Your answer`,"input.numberInvalid":`Enter a number, for example 25`,"unit.label.deg":`°`,"unit.label.km":`km`,"unit.label.h":`h`,"unit.label.min":`min`,"rehearsal.intro":`15 questions from all topics. You will see the answers at the end, just like after a real test.`,"rehearsal.start":`Start`,"rehearsal.submitNext":`Save and continue`,"rehearsal.finish":`Finish the test`,"rehearsal.results":`Your results`,"rehearsal.yourAnswer":`Your answer: {answer}`,"rehearsal.learn":`Learn: {title}`,"rehearsal.practise":`Practise: {title}`,"rehearsal.again":`Try another test`,"classQuiz.setup":`Set up the quiz`,"classQuiz.seed":`Quiz code (the same code gives the same questions)`,"classQuiz.topics":`Topics`,"classQuiz.count":`Number of questions`,"classQuiz.timer":`Time to think`,"classQuiz.timerOff":`No timer`,"classQuiz.seconds":`{n} s`,"classQuiz.start":`Start the quiz`,"classQuiz.reveal":`Show the answer`,"classQuiz.prev":`Previous`,"classQuiz.next":`Next`,"classQuiz.end":`End quiz`,"classQuiz.keys":`Space: show answer · →: next · ←: previous · Esc: end`,"classQuiz.timeUp":`Time's up!`,"classQuiz.answer":`Answer: {answer}`,"classQuiz.noTopics":`Choose at least one topic.`},Vi={"app.title":`Współrzędne na kuli ziemskiej`,"app.skip":`Przejdź do treści`,"unit.degree#one":`{count} stopień`,"unit.degree#few":`{count} stopnie`,"unit.degree#many":`{count} stopni`,"unit.degree#other":`{count} stopnia`,"unit.minute#one":`{count} minuta`,"unit.minute#few":`{count} minuty`,"unit.minute#many":`{count} minut`,"unit.minute#other":`{count} minuty`,"dir.north":`na północ`,"dir.south":`na południe`,"dir.east":`na wschód`,"dir.west":`na zachód`,"spoken.lat":`{amount} {dir}`,"spoken.lon":`{amount} {dir}`,"spoken.zero":`{amount}`,"header.language":`Język`,"header.settings":`Ustawienia`,"header.home":`Strona główna`,"settings.title":`Ustawienia`,"settings.theme":`Motyw kolorów`,"settings.theme.system":`Jak w urządzeniu`,"settings.theme.light":`Jasny`,"settings.theme.dark":`Ciemny`,"settings.largeText":`Większy tekst`,"settings.reducedMotion":`Ogranicz animacje`,"settings.close":`Zamknij`,"home.intro":`Każde miejsce na Ziemi ma swój adres z dwóch liczb: szerokości i długości geograficznej. Nauczmy się go czytać!`,"home.topics":`Tematy`,"home.more":`Sprawdź się i odkrywaj`,"home.explore":`Poznaj`,"home.practice":`Ćwicz`,"topic.nav":`Części tematu`,"topic.explore":`Poznaj`,"topic.practice":`Ćwicz`,"topic.prev":`Poprzedni temat: {title}`,"topic.next":`Następny temat: {title}`,"topic.soon":`Ten temat już wkrótce.`,"explore.progress":`Krok {n} z {total}`,"explore.prev":`Wstecz`,"explore.next":`Dalej`,"explore.goto":`Przejdź do kroku {n}`,"explore.practiceNow":`Poćwicz ten temat`,"explore.keysHint":`Wskazówka: klawisze ← i → zmieniają kroki.`,"topic.1.title":`Siatka geograficzna`,"topic.1.summary":`Południki, równoleżniki, równik i półkule`,"topic.2.title":`Gdzie to jest?`,"topic.2.summary":`Na północ czy na południe od równoleżnika, na wschód czy na zachód od południka`,"topic.3.title":`Odczytywanie współrzędnych`,"topic.3.summary":`Odczytaj szerokość i długość geograficzną punktu`,"topic.4.title":`Szukanie miejsca`,"topic.4.summary":`Zaznacz punkt na mapie według współrzędnych`,"topic.5.title":`Stopnie i minuty`,"topic.5.summary":`Jeden stopień ma 60 minut`,"topic.6.title":`Ile stopni różnicy?`,"topic.6.summary":`Różnica szerokości i długości geograficznej`,"topic.7.title":`Odległość wzdłuż południka`,"topic.7.summary":`Jeden stopień to około 111,2 km`,"topic.8.title":`Długość geograficzna a czas`,"topic.8.summary":`Dzień, noc i czas słoneczny`,"topic.1.step.ball.title":`Ziemia jest kulą`,"topic.1.step.ball.body":`Aby dokładnie określić miejsce na kuli, rysujemy na niej wyobrażoną siatkę. Siatka ma dwa rodzaje linii: równoleżniki i południki. Przeciągnij globus, aby go obrócić.`,"topic.1.step.equator.title":`Równik`,"topic.1.step.equator.body":`Równik biegnie dookoła środka Ziemi. To najdłuższy równoleżnik, a jego szerokość geograficzna to 0°. Dzieli Ziemię na półkulę północną i południową.`,"topic.1.step.parallels.title":`Równoleżniki`,"topic.1.step.parallels.body":`Równoleżniki to okręgi biegnące równolegle do równika. Im bliżej bieguna, tym są krótsze. Pokazują szerokość geograficzną: od 0° na równiku aż do 90°N na biegunie północnym lub 90°S na biegunie południowym.`,"topic.1.step.angle.title":`Dlaczego stopnie?`,"topic.1.step.angle.body":`Szerokość geograficzna to kąt! Wyobraź sobie linię od środka Ziemi do miejsca. Kąt między tą linią a równikiem to szerokość geograficzna. Przeciągnij punkt na okręgu i obserwuj, jak zmienia się kąt.`,"topic.1.step.meridians.title":`Południki`,"topic.1.step.meridians.body":`Południki to półokręgi łączące biegun północny z biegunem południowym. Wszystkie południki mają taką samą długość. Pokazują długość geograficzną.`,"topic.1.step.prime.title":`Południk zerowy i 180°`,"topic.1.step.prime.body":`Południk zerowy (0°) przechodzi przez Greenwich w Londynie. Po drugiej stronie Ziemi leży południk 180°. Razem dzielą Ziemię na półkulę wschodnią i zachodnią. Długość geograficzna sięga od 0° do 180°E lub 180°W.`,"topic.1.step.projections.title":`Wiele map, jedna siatka`,"topic.1.step.projections.body":`Płaska mapa jest zawsze trochę rozciągnięta, bo Ziemia jest okrągła. Ta mapa nazywa się Equal Earth: każdy kraj zachowuje swój prawdziwy rozmiar, dlatego południki są wygięte. Współrzędne są takie same na każdej mapie. Porównaj z mapą z siatką w Laboratorium.`,"topic.1.step.tropics.title":`Zwrotniki i koła podbiegunowe`,"topic.1.step.tropics.body":`Niektóre równoleżniki mają własne nazwy: Zwrotnik Raka (około 23°N), Zwrotnik Koziorożca (około 23°S), koło podbiegunowe północne (około 66°N) i koło podbiegunowe południowe (około 66°S).`,"topic.1.step.play.title":`Spróbuj sam`,"topic.1.step.play.body":`Przeciągaj punkt w różne miejsca. Kiedy jest na półkuli północnej? Kiedy jest na półkuli zachodniej? Znajdź Zwrotnik Raka.`,"topic.2.step.north-south.title":`Na północ czy na południe?`,"topic.2.step.north-south.body":`Na mapie północ jest u góry. Warszawa (52°N) leży na północ od równoleżnika 50°N. Rzym (42°N) leży na południe od niego. Na półkuli północnej większa liczba oznacza dalej na północ.`,"topic.2.step.southern.title":`Uwaga na południu!`,"topic.2.step.southern.body":`Na półkuli południowej większa liczba oznacza dalej na południe. 40°S leży na południe od 20°S, a 10°S leży na północ od niego.`,"topic.2.step.east-west.title":`Na wschód czy na zachód?`,"topic.2.step.east-west.body":`Wschód jest po prawej stronie mapy. Kijów (31°E) leży na wschód od południka 20°E. Londyn (0°) leży na zachód od niego. Na półkuli wschodniej większa liczba oznacza dalej na wschód.`,"topic.2.step.western.title":`Uwaga na zachodzie!`,"topic.2.step.western.body":`Na półkuli zachodniej większa liczba oznacza dalej na zachód. 100°W leży na zachód od 60°W, a 30°W leży na wschód od niego.`,"topic.2.step.across-zero.title":`Po obu stronach linii`,"topic.2.step.across-zero.body":`Każde miejsce o szerokości N leży na północ od każdego miejsca o szerokości S. Każde miejsce o długości E leży na wschód od Greenwich, a każde miejsce o długości W leży na zachód od niego.`,"topic.2.step.play.title":`Spróbuj sam`,"topic.2.step.play.body":`Przesuń punkt i powiedz na głos: czy jest na północ, czy na południe od równika? Na wschód czy na zachód od Greenwich? Potem sprawdź współrzędne pod mapą.`,"topic.3.step.address.title":`Adres w dwóch liczbach`,"topic.3.step.address.body":`Współrzędne zapisujemy najpierw jako szerokość, potem jako długość geograficzną: 52°N, 21°E. To Warszawa!`,"topic.3.step.latitude.title":`Krok 1: szerokość geograficzna`,"topic.3.step.latitude.body":`Znajdź równoleżnik, który przechodzi przez punkt, i odczytaj jego numer przy lewej krawędzi mapy. Czy punkt leży powyżej równika (N), czy poniżej niego (S)?`,"topic.3.step.longitude.title":`Krok 2: długość geograficzna`,"topic.3.step.longitude.body":`Teraz znajdź południk, który przechodzi przez punkt, i odczytaj jego numer przy dolnej krawędzi mapy. Czy punkt leży na prawo od Greenwich (E), czy na lewo od niego (W)?`,"topic.3.step.answer.title":`Złóż to razem`,"topic.3.step.answer.body":`Punkt leży na równoleżniku 30°N i na południku 30°E. Jego współrzędne to 30°N, 30°E — bardzo blisko Kairu.`,"topic.3.step.between.title":`Między liniami`,"topic.3.step.between.body":`Jeśli punkt leży między dwiema liniami, policz stopnie. W połowie drogi między 40° a 50° jest 45°.`,"topic.3.step.southwest.title":`Południe i zachód`,"topic.3.step.southwest.body":`Spróbuj sam: który równoleżnik i który południk przez niego przechodzą? Pamiętaj o literach S i W. (Odpowiedź: 30°S, 60°W.)`,"topic.3.step.globe.title":`Na globusie`,"topic.3.step.globe.body":`Siatka działa tak samo na globusie. Obróć globus, aby znaleźć punkt w pobliżu Sydney: 34°S, 151°E.`,"topic.3.step.play.title":`Spróbuj sam`,"topic.3.step.play.body":`Przeciągnij punkt, powiedz na głos jego współrzędne, a potem sprawdź odpowiedź pod mapą.`,"topic.4.step.plan.title":`Od liczb do miejsca`,"topic.4.step.plan.body":`Znajdźmy miejsce o współrzędnych 50°N, 30°E. Najpierw znajdź równoleżnik: 50°N.`,"topic.4.step.meridian.title":`Teraz południk`,"topic.4.step.meridian.body":`Teraz znajdź południk 30°E. Pamiętaj: E oznacza na prawo od Greenwich.`,"topic.4.step.cross.title":`Tam, gdzie linie się przecinają`,"topic.4.step.cross.body":`To miejsce leży tam, gdzie przecinają się obie linie. To Kijów!`,"topic.4.step.letters.title":`Litery mają znaczenie`,"topic.4.step.letters.body":`34°S, 151°E to Sydney. Ale 34°N, 151°W to środek Oceanu Spokojnego! Zawsze sprawdzaj N lub S oraz E lub W.`,"topic.4.step.play.title":`Spróbuj sam`,"topic.4.step.play.body":`Przeciągaj punkt, aby znaleźć miejsca, albo wybierz miasto z listy i sprawdź jego współrzędne.`,"topic.5.step.sixty.title":`Stopień ma 60 minut`,"topic.5.step.sixty.body":`Jeden stopień dzielimy na 60 minut. Minuty zapisujemy znakiem ′. Dlatego 52°30′N leży dokładnie w połowie między 52°N a 53°N.`,"topic.5.step.quarters.title":`Połówki i ćwiartki`,"topic.5.step.quarters.body":`30′ to pół stopnia. 15′ to ćwierć stopnia, a 45′ to trzy czwarte stopnia. Ten punkt leży na 52°15′N, 21°45′E.`,"topic.5.step.warsaw.title":`Warszawa dokładnie`,"topic.5.step.warsaw.body":`Środek Warszawy leży mniej więcej na 52°14′N, 21°01′E. Na mapie szkolnej często zaokrąglamy to do 52°N, 21°E.`,"topic.5.step.compare.title":`Który jest dalej na północ?`,"topic.5.step.compare.body":`52°45′N leży na północ od 52°15′N: stopnie są takie same, ale minut jest więcej. Na półkuli południowej więcej minut oznacza, że miejsce leży dalej na południe.`,"topic.5.step.play.title":`Spróbuj sam`,"topic.5.step.play.body":`Każde naciśnięcie strzałki przesuwa punkt o 1′, a ze Shiftem — o 1°. Znajdź 52°30′N, 20°45′E.`,"topic.6.step.same-lat.title":`Ta sama strona: odejmujemy`,"topic.6.step.same-lat.body":`Warszawa leży na 52°N, a Kair na 30°N. Oba miasta są na północ od równika, więc odejmujemy: 52 − 30 = 22°.`,"topic.6.step.opposite-lat.title":`Różne strony: dodajemy`,"topic.6.step.opposite-lat.body":`Kair leży na 30°N, a Kapsztad na 34°S. Między nimi jest równik, więc dodajemy: 30 + 34 = 64°.`,"topic.6.step.same-lon.title":`Z długością jest tak samo`,"topic.6.step.same-lon.body":`Kijów leży na 31°E, a Warszawa na 21°E. Oba miasta są na wschód od Greenwich: 31 − 21 = 10°.`,"topic.6.step.opposite-lon.title":`Przez Greenwich: dodajemy`,"topic.6.step.opposite-lon.body":`Nowy Jork leży na 74°W, a Warszawa na 21°E. Między nimi jest południk zerowy (Greenwich): 74 + 21 = 95°.`,"topic.6.step.over-180.title":`Więcej niż 180°? Idź w drugą stronę`,"topic.6.step.over-180.body":`Tokio leży na 140°E, a Honolulu na 158°W. 140 + 158 = 298°, a to więcej niż 180°. Krótsza droga prowadzi przez południk 180°: 360 − 298 = 62°.`,"topic.6.step.play.title":`Spróbuj sam`,"topic.6.step.play.body":`Przeciągnij punkt. O ile stopni szerokości i długości geograficznej różni się od Warszawy (52°N, 21°E)?`,"topic.7.step.degree-length.title":`Ile ma jeden stopień?`,"topic.7.step.degree-length.body":`Południk biegnie od bieguna do bieguna: to około 20 000 km i 180°. Dlatego jeden stopień wzdłuż południka to około 111,2 km.`,"topic.7.step.example.title":`Stopnie na kilometry`,"topic.7.step.example.body":`Dwa punkty na tym samym południku, na 50°N i 40°N, dzieli 10°: 10 × 111,2 = 1112 km.`,"topic.7.step.across-equator.title":`Przez równik`,"topic.7.step.across-equator.body":`Od 10°N do 20°S wzdłuż południka: 10 + 20 = 30°, więc 30 × 111,2 = 3336 km.`,"topic.7.step.reverse.title":`Kilometry na stopnie`,"topic.7.step.reverse.body":`Jeśli dwa miejsca na jednym południku dzieli 556 km, to dzielimy: 556 : 111,2 = 5°.`,"topic.7.step.only-meridians.title":`Dlaczego tylko wzdłuż południków?`,"topic.7.step.only-meridians.body":`Równoleżniki są coraz krótsze w stronę biegunów, więc jeden stopień wzdłuż równoleżnika ma mniej niż 111,2 km (oprócz równika). Dlatego tej zasady używamy tylko wzdłuż południków.`,"topic.7.step.play.title":`Spróbuj sam`,"topic.7.step.play.body":`Przesuwaj punkt wzdłuż południka. Jego odległość od równika to jego szerokość geograficzna × 111,2 km.`,"mode.rehearsal.title":`Próbny sprawdzian`,"mode.rehearsal.summary":`15 różnych pytań, jak na prawdziwym sprawdzianie`,"mode.classQuiz.title":`Quiz dla klasy`,"mode.classQuiz.summary":`Duże pytania na dużym ekranie dla całej klasy`,"mode.lab.title":`Laboratorium dnia i nocy`,"mode.lab.summary":`Przesuwaj Słońce i patrz, jak zmienia się czas`,"lab.intro":`Przesuń punkt w dowolne miejsce na Ziemi i patrz, jak zmieniają się jego współrzędne.`,"footer.madeBy":`Autor: {name}`,"footer.mapData":`Dane mapy: {source}`,"footer.label":`O tej stronie`,"map.stage":`Mapa`,"map.chooseView":`Wybierz widok`,"map.view.globe":`Globus`,"map.view.flat":`Mapa`,"map.view.cross-section":`Przekrój`,"map.flat.label":`Mapa świata z równoleżnikami i południkami`,"map.flat.hint":`Strzałki przesuwają punkt (Shift: 10 razy dalej). Plus i minus przybliżają.`,"map.zoomIn":`Przybliż`,"map.zoomOut":`Oddal`,"map.zoomHint":`Przytrzymaj Ctrl i przewiń, aby przybliżyć`,"map.preset.world":`Świat`,"map.preset.europe":`Europa`,"map.preset.poland":`Polska`,"map.projection":`Rodzaj mapy`,"map.projection.grid":`Mapa z siatką`,"map.projection.equal-earth":`Equal Earth`,"map.projection.hint":`Mapa z siatką: proste południki, łatwo odczytać współrzędne. Equal Earth: państwa mają prawdziwą wielkość, południki są wygięte.`,"map.globe.label":`Globus, który możesz obracać`,"map.globe.hint":`Przeciągnij, aby obrócić globus. Strzałki przesuwają punkt albo obracają globus, gdy punktu nie można przesuwać. Plus i minus przybliżają; Ctrl i przewijanie też przybliżają.`,"map.globeZoomIn .`,"q.nameLine.explain.tropicCapricorn":`Zwrotnik Koziorożca to równoleżnik około 23,5°S.`,"q.nameLine.explain.arcticCircle":`Koło podbiegunowe północne to równoleżnik około 66,5°N.`,"q.nameLine.explain.antarcticCircle":`Koło podbiegunowe południowe to równoleżnik około 66,5°S.`,"q.nameLine.explainHemi.N":`Półkula północna to wszystko, co leży na północ od równika.`,"q.nameLine.explainHemi.S":`Półkula południowa to wszystko, co leży na południe od równika.`,"q.nameLine.explainHemi.E":`Półkula wschodnia to wszystko, co leży na wschód od południka zerowego, aż do 180°.`,"q.nameLine.explainHemi.W":`Półkula zachodnia to wszystko, co leży na zachód od południka zerowego, aż do 180°.`,"q.nameLine.explainPoint":`Punkt A ma współrzędne {coords}, więc leży na półkulach: {nsHemi} i {ewHemi}.`,"q.nameLine.hemiAdj.N":`północnej`,"q.nameLine.hemiAdj.S":`południowej`,"q.nameLine.hemiAdj.E":`wschodniej`,"q.nameLine.hemiAdj.W":`zachodniej`,"q.dirWord.N":`na północ`,"q.dirWord.S":`na południe`,"q.dirWord.E":`na wschód`,"q.dirWord.W":`na zachód`,"q.further.prompt.N":`Który punkt leży najdalej na północ?`,"q.further.prompt.S":`Który punkt leży najdalej na południe?`,"q.further.prompt.E":`Który punkt leży najdalej na wschód?`,"q.further.prompt.W":`Który punkt leży najdalej na zachód?`,"q.further.option":`Punkt {label}: {coord}`,"q.further.explain":`Punkt {label} ({coord}) leży najdalej {dir}. {rule}`,"q.further.explain2":`Punkt {label} ({coord}) leży najdalej {dir}. {rule} {rule2}`,"q.further.mistake.opposite":`Ten punkt leży najdalej {dir} — to przeciwny kierunek!`,"q.rule.mixed.lat":`Każde miejsce o szerokości N leży na północ od każdego miejsca o szerokości S.`,"q.rule.mixed.lon":`Każde miejsce o długości E leży na wschód od każdego miejsca o długości W (jeśli nie przechodzimy przez południk 180°).`,"q.rule.bigger.N":`Na półkuli północnej większa liczba oznacza, że miejsce leży dalej na północ.`,"q.rule.bigger.S":`Na półkuli południowej większa liczba oznacza, że miejsce leży dalej na południe.`,"q.rule.bigger.E":`Na półkuli wschodniej większa liczba oznacza, że miejsce leży dalej na wschód.`,"q.rule.bigger.W":`Na półkuli zachodniej większa liczba oznacza, że miejsce leży dalej na zachód.`,"q.rule.zero.lat":`Miejsca o szerokości N leżą na północ od równika (0°), a miejsca o szerokości S — na południe od niego.`,"q.rule.zero.lon":`Miejsca o długości E leżą na wschód od południka zerowego (0°), a miejsca o długości W — na zachód od niego.`,"q.relative.prompt.lat":`Czy punkt A ({point}) leży na północ, czy na południe od równoleżnika {line}?`,"q.relative.prompt.lon":`Czy punkt A ({point}) leży na wschód, czy na zachód od południka {line}?`,"q.opt.north":`Na północ od niego`,"q.opt.south":`Na południe od niego`,"q.opt.east":`Na wschód od niego`,"q.opt.west":`Na zachód od niego`,"q.relative.explain.lat":`Punkt A ma szerokość {value}, a równoleżnik to {line}, więc punkt leży {dir} od równoleżnika. {rule}`,"q.relative.explain.lon":`Punkt A ma długość {value}, a południk to {line}, więc punkt leży {dir} od południka. {rule}`,"q.read.prompt":`Jakie współrzędne ma ten punkt?`,"q.read.explain":`Punkt leży na równoleżniku {lat} i na południku {lon}, więc jego współrzędne to {coords}.`,"q.place.prompt":`Ustaw punkt w miejscu o współrzędnych {coords}.`,"q.place.explain":`Najpierw znajdź równoleżnik {lat}, potem południk {lon}. Punkt stawiasz tam, gdzie się przecinają.`,"q.which.prompt":`Który znacznik ma współrzędne {coords}?`,"q.which.option":`Znacznik {label}`,"q.which.explain":`Znacznik {label} ma współrzędne {coords}. To {place}!`,"q.answer.coords":`{coords}`,"q.answer.deg":`{n}°`,"q.answer.km":`{n} km`,"q.answer.h":`{n} godz.`,"q.answer.min":`{n} min`,"q.answer.clock":`{time}`,"q.answer.none":`—`,"q.mistake.nsLetter":`Sprawdź literę: N oznacza na północ od równika, a S — na południe od niego.`,"q.mistake.ewLetter":`Sprawdź literę: E oznacza na wschód od Greenwich, a W — na zachód od niego.`,"q.mistake.bothLetters":`Obie litery są odwrotnie. N lub S mówi, czy w górę, czy w dół, a E lub W — czy w prawo, czy w lewo.`,"q.mistake.swapped":`Szerokość i długość są zamienione miejscami. Szerokość (N lub S) zawsze piszemy pierwszą.`,"q.mistake.minutes":`Blisko! Sprawdź minuty: 30′ to pół stopnia, a 15′ to ćwierć stopnia.`,"q.diff.prompt.lat":`Jaka jest różnica szerokości geograficznej między punktami A ({a}) i B ({b})?`,"q.diff.prompt.lon":`Jaka jest różnica długości geograficznej między punktami A ({a}) i B ({b})?`,"q.diff.explain.same.lat":`Oba punkty leżą po tej samej stronie równika, więc odejmujemy: {big} − {small} = {result}°.`,"q.diff.explain.same.lon":`Oba punkty leżą po tej samej stronie południka zerowego, więc odejmujemy: {big} − {small} = {result}°.`,"q.diff.explain.opposite.lat":`Punkty leżą po różnych stronach równika, więc dodajemy: {x} + {y} = {result}°.`,"q.diff.explain.opposite.lon":`Punkty leżą po różnych stronach południka zerowego, więc dodajemy: {x} + {y} = {result}°.`,"q.diff.explain.zero.lat":`Jeden punkt leży na równiku (0°), więc różnica to po prostu druga liczba: {result}°.`,"q.diff.explain.zero.lon":`Jeden punkt leży na południku zerowym (0°), więc różnica to po prostu druga liczba: {result}°.`,"q.diff.explain.over180":`Punkty leżą po różnych stronach południka zerowego, więc dodajemy: {x} + {y} = {sum}°. To więcej niż 180°, więc wybieramy krótszą drogę — przez południk 180°: 360 − {sum} = {result}°.`,"q.diff.mistake.subtracted.lat":`Tu nie odejmujemy: punkty leżą po różnych stronach równika, więc liczby trzeba dodać.`,"q.diff.mistake.subtracted.lon":`Tu nie odejmujemy: punkty leżą po różnych stronach południka zerowego, więc liczby trzeba dodać.`,"q.diff.mistake.added.lat":`Tu nie dodajemy: oba punkty leżą po tej samej stronie równika, więc od większej liczby odejmij mniejszą.`,"q.diff.mistake.added.lon":`Tu nie dodajemy: oba punkty leżą po tej samej stronie południka zerowego, więc od większej liczby odejmij mniejszą.`,"q.diff.mistake.over180":`Dodawanie było dobre, ale suma jest większa niż 180°. Wybierz krótszą drogę: 360° minus suma.`,"q.dist.prompt":`Punkty A ({a}) i B ({b}) leżą na tym samym południku. Ile kilometrów wynosi odległość między nimi?`,"q.dist.promptReverse":`Dwa miejsca na tym samym południku są oddalone o {km} km. O ile stopni szerokości geograficznej się różnią?`,"q.dist.explain":`{diff} Jeden stopień wzdłuż południka to około 111,2 km, więc {deg} × 111,2 = {km} km.`,"q.dist.explainReverse":`Jeden stopień wzdłuż południka to około 111,2 km, więc dzielimy: {km} : 111,2 = {deg}°.`,"q.dist.note111":`Liczysz 111 km na stopień — to też dobrze! Dokładniej to 111,2 km.`,"q.dist.mistake.degrees":`To jest liczba stopni. Pomnóż ją przez 111,2, aby otrzymać kilometry.`,"q.dist.mistake.multiplied":`Tu nie mnożymy: aby zamienić kilometry na stopnie, podziel przez 111,2.`,"practice.difficulty":`Poziom trudności`,"difficulty.easy":`Łatwy`,"difficulty.medium":`Średni`,"difficulty.hard":`Trudny`,"practice.progress":`Pytanie {n} z {total}`,"practice.check":`Sprawdź`,"practice.next":`Następne pytanie`,"practice.results":`Zobacz wynik`,"practice.correct":`Dobrze!`,"practice.incorrect":`Nie całkiem`,"practice.correctAnswer":`Poprawna odpowiedź: {answer}`,"practice.done":`Koniec rundy`,"practice.score":`Masz {score} na {total}`,"practice.best":`Twój najlepszy wynik: {best} na {total}`,"practice.newRound":`Nowa runda`,"practice.harder":`Spróbuj trudniejszych pytań`,"practice.review":`Twoje odpowiedzi`,"practice.backToLearn":`Wróć do nauki`,"practice.needAnswer":`Najpierw wybierz lub wpisz odpowiedź.`,"practice.resultCorrect":`dobrze`,"practice.resultWrong":`źle`,"input.chooseOne":`Wybierz jedną odpowiedź`,"input.lat":`Szerokość geograficzna`,"input.lon":`Długość geograficzna`,"input.example":`Na przykład: {example}`,"input.invalid":`Wpisz tak: {example}`,"input.usePoint":`Przesuń punkt na mapie (albo użyj suwaków) i naciśnij Sprawdź.`,"input.number":`Twoja odpowiedź`,"input.numberInvalid":`Wpisz liczbę, na przykład 25`,"unit.label.deg":`°`,"unit.label.km":`km`,"unit.label.h":`godz.`,"unit.label.min":`min`,"rehearsal.intro":`15 pytań ze wszystkich tematów. Odpowiedzi zobaczysz na końcu, jak po prawdziwym sprawdzianie.`,"rehearsal.start":`Zaczynamy`,"rehearsal.submitNext":`Zapisz i dalej`,"rehearsal.finish":`Zakończ sprawdzian`,"rehearsal.results":`Twoje wyniki`,"rehearsal.yourAnswer":`Twoja odpowiedź: {answer}`,"rehearsal.learn":`Poznaj: {title}`,"rehearsal.practise":`Ćwicz: {title}`,"rehearsal.again":`Spróbuj kolejnego sprawdzianu`,"classQuiz.setup":`Ustaw quiz`,"classQuiz.seed":`Kod quizu (ten sam kod = te same pytania)`,"classQuiz.topics":`Tematy`,"classQuiz.count":`Liczba pytań`,"classQuiz.timer":`Czas do namysłu`,"classQuiz.timerOff":`Bez limitu`,"classQuiz.seconds":`{n} s`,"classQuiz.start":`Rozpocznij quiz`,"classQuiz.reveal":`Pokaż odpowiedź`,"classQuiz.prev":`Poprzednie`,"classQuiz.next":`Następne`,"classQuiz.end":`Zakończ quiz`,"classQuiz.keys":`Spacja: odpowiedź · →: dalej · ←: wstecz · Esc: koniec`,"classQuiz.timeUp":`Koniec czasu!`,"classQuiz.answer":`Odpowiedź: {answer}`,"classQuiz.noTopics":`Wybierz co najmniej jeden temat.`},Hi={"app.title":`Координати на земній кулі`,"app.skip":`Перейти до основного вмісту`,"unit.degree#one":`{count} градус`,"unit.degree#few":`{count} градуси`,"unit.degree#many":`{count} градусів`,"unit.degree#other":`{count} градуса`,"unit.minute#one":`{count} хвилина`,"unit.minute#few":`{count} хвилини`,"unit.minute#many":`{count} хвилин`,"unit.minute#other":`{count} хвилини`,"dir.north":`північної широти`,"dir.south":`південної широти`,"dir.east":`східної довготи`,"dir.west":`західної довготи`,"spoken.lat":`{amount} {dir}`,"spoken.lon":`{amount} {dir}`,"spoken.zero":`{amount}`,"header.language":`Мова`,"header.settings":`Налаштування`,"header.home":`Головна`,"settings.title":`Налаштування`,"settings.theme":`Колірна тема`,"settings.theme.system":`Як на пристрої`,"settings.theme.light":`Світла`,"settings.theme.dark":`Темна`,"settings.largeText":`Більший текст`,"settings.reducedMotion":`Менше анімації`,"settings.close":`Закрити`,"home.intro":`Кожне місце на Землі має свою адресу з двох чисел: широти й довготи. Навчімося її читати!`,"home.topics":`Теми`,"home.more":`Перевір себе й досліджуй`,"home.explore":`Вивчай`,"home.practice":`Тренуйся`,"topic.nav":`Розділи теми`,"topic.explore":`Вивчай`,"topic.practice":`Тренуйся`,"topic.prev":`Попередня тема: {title}`,"topic.next":`Наступна тема: {title}`,"topic.soon":`Ця тема незабаром.`,"explore.progress":`Крок {n} з {total}`,"explore.prev":`Назад`,"explore.next":`Далі`,"explore.goto":`Перейти до кроку {n}`,"explore.practiceNow":`Потренуйся з цієї теми`,"explore.keysHint":`Порада: клавіші ← і → перемикають кроки.`,"topic.1.title":`Градусна сітка`,"topic.1.summary":`Меридіани, паралелі, екватор і півкулі`,"topic.2.title":`Де це?`,"topic.2.summary":`Північніше чи південніше паралелі, східніше чи західніше меридіана`,"topic.3.title":`Визначення координат`,"topic.3.summary":`Визнач широту й довготу точки`,"topic.4.title":`Пошук місця`,"topic.4.summary":`Познач точку на карті за координатами`,"topic.5.title":`Градуси й хвилини`,"topic.5.summary":`Один градус має 60 хвилин`,"topic.6.title":`На скільки градусів різниця?`,"topic.6.summary":`Різниця широт і довгот`,"topic.7.title":`Відстань уздовж меридіана`,"topic.7.summary":`Один градус — це приблизно 111,2 км`,"topic.8.title":`Довгота і час`,"topic.8.summary":`День, ніч і місцевий сонячний час`,"topic.1.step.ball.title":`Земля — куля`,"topic.1.step.ball.body":`Щоб точно визначити місце на кулі, ми малюємо на ній уявну сітку. Сітка має два види ліній: паралелі й меридіани. Перетягни глобус, щоб його обернути.`,"topic.1.step.equator.title":`Екватор`,"topic.1.step.equator.body":`Екватор оперізує Землю посередині. Це найдовша паралель, і його широта — 0°. Він ділить Землю на Північну й Південну півкулі.`,"topic.1.step.parallels.title":`Паралелі`,"topic.1.step.parallels.body":`Паралелі — це кола, які йдуть паралельно до екватора. Що ближче до полюса, то вони коротші. Вони показують широту: від 0° на екваторі до 90° пн. ш. на Північному полюсі або 90° пд. ш. на Південному полюсі.`,"topic.1.step.angle.title":`Чому градуси?`,"topic.1.step.angle.body":`Широта — це кут! Уяви лінію від центру Землі до місця. Кут між цією лінією та екватором і є широтою. Перетягни точку на колі й подивись, як змінюється кут.`,"topic.1.step.meridians.title":`Меридіани`,"topic.1.step.meridians.body":`Меридіани — це півкола, що з'єднують Північний і Південний полюси. Усі меридіани мають однакову довжину. Вони показують довготу.`,"topic.1.step.prime.title":`Нульовий меридіан і 180°`,"topic.1.step.prime.body":`Нульовий меридіан (0°) проходить через Гринвіч у Лондоні. На протилежному боці Землі лежить меридіан 180°. Разом вони ділять Землю на Східну й Західну півкулі. Довгота йде від 0° до 180° сх. д. або 180° зх. д.`,"topic.1.step.projections.title":`Багато карт, одна сітка`,"topic.1.step.projections.body":`Плоска карта завжди трохи розтягнута, бо Земля кругла. Ця карта називається Equal Earth: кожна країна зберігає свій справжній розмір, тому меридіани вигнуті. Координати однакові на кожній карті. Спробуй карту-сітку в Лабораторії, щоб порівняти.`,"topic.1.step.tropics.title":`Тропіки й полярні кола`,"topic.1.step.tropics.body":`Деякі паралелі мають власні назви: Тропік Рака (близько 23° пн. ш.), Тропік Козерога (близько 23° пд. ш.), Північне полярне коло (близько 66° пн. ш.) і Південне полярне коло (близько 66° пд. ш.).`,"topic.1.step.play.title":`Спробуй сам`,"topic.1.step.play.body":`Перетягуй точку в різні місця. Коли вона в Північній півкулі? Коли вона в Західній півкулі? Знайди Тропік Рака.`,"topic.2.step.north-south.title":`На північ чи на південь?`,"topic.2.step.north-south.body":`На карті північ угорі. Варшава (52° пн. ш.) лежить на північ від паралелі 50° пн. ш. Рим (42° пн. ш.) лежить на південь від неї. У Північній півкулі більше число означає далі на північ.`,"topic.2.step.southern.title":`Обережно на півдні!`,"topic.2.step.southern.body":`У Південній півкулі більше число означає далі на південь. 40° пд. ш. лежить на південь від 20° пд. ш., а 10° пд. ш. лежить на північ від неї.`,"topic.2.step.east-west.title":`На схід чи на захід?`,"topic.2.step.east-west.body":`Схід — праворуч на карті. Київ (31° сх. д.) лежить на схід від меридіана 20° сх. д. Лондон (0°) лежить на захід від нього. У Східній півкулі більше число означає далі на схід.`,"topic.2.step.western.title":`Обережно на заході!`,"topic.2.step.western.body":`У Західній півкулі більше число означає далі на захід. 100° зх. д. лежить на захід від 60° зх. д., а 30° зх. д. лежить на схід від неї.`,"topic.2.step.across-zero.title":`По обидва боки лінії`,"topic.2.step.across-zero.body":`Будь-яке місце з північною широтою лежить на північ від будь-якого місця з південною широтою. Будь-яке місце зі східною довготою лежить на схід від Гринвіча, а будь-яке місце із західною довготою лежить на захід від нього.`,"topic.2.step.play.title":`Спробуй сам`,"topic.2.step.play.body":`Перемісти точку й скажи вголос: вона на північ чи на південь від екватора? На схід чи на захід від Гринвіча? Потім перевір координати під картою.`,"topic.3.step.address.title":`Адреса у двох числах`,"topic.3.step.address.body":`Координати записують спершу як широту, потім як довготу: 52° пн. ш., 21° сх. д. Це Варшава!`,"topic.3.step.latitude.title":`Крок 1: широта`,"topic.3.step.latitude.body":`Знайди паралель, яка проходить через точку, і прочитай її число біля лівого краю карти. Точка вище екватора (пн. ш.) чи нижче (пд. ш.)?`,"topic.3.step.longitude.title":`Крок 2: довгота`,"topic.3.step.longitude.body":`Тепер знайди меридіан, який проходить через точку, і прочитай його число біля нижнього краю карти. Точка праворуч від Гринвіча (сх. д.) чи ліворуч (зх. д.)?`,"topic.3.step.answer.title":`Склади разом`,"topic.3.step.answer.body":`Точка лежить на паралелі 30° пн. ш. і на меридіані 30° сх. д. Її координати — 30° пн. ш., 30° сх. д. — зовсім близько від Каїра.`,"topic.3.step.between.title":`Між лініями`,"topic.3.step.between.body":`Якщо точка лежить між двома лініями, порахуй градуси. Посередині між 40° і 50° буде 45°.`,"topic.3.step.southwest.title":`Південь і захід`,"topic.3.step.southwest.body":`Спробуй сам: яка паралель і який меридіан проходять через цю точку? Пам'ятай про позначки пд. ш. і зх. д. (Відповідь: 30° пд. ш., 60° зх. д.)`,"topic.3.step.globe.title":`На глобусі`,"topic.3.step.globe.body":`Сітка працює так само на глобусі. Оберни глобус, щоб знайти точку біля Сіднея: 34° пд. ш., 151° сх. д.`,"topic.3.step.play.title":`Спробуй сам`,"topic.3.step.play.body":`Перетягни точку, скажи вголос її координати, а потім перевір відповідь під картою.`,"topic.4.step.plan.title":`Від чисел до місця`,"topic.4.step.plan.body":`Знайдімо місце з координатами 50° пн. ш., 30° сх. д. Спочатку знайди паралель: 50° пн. ш.`,"topic.4.step.meridian.title":`Тепер меридіан`,"topic.4.step.meridian.body":`Тепер знайди меридіан 30° сх. д. Пам'ятай: сх. д. означає праворуч від Гринвіча.`,"topic.4.step.cross.title":`Там, де лінії перетинаються`,"topic.4.step.cross.body":`Це місце лежить там, де перетинаються обидві лінії. Це Київ!`,"topic.4.step.letters.title":`Позначки мають значення`,"topic.4.step.letters.body":`34° пд. ш., 151° сх. д. — це Сідней. А от 34° пн. ш., 151° зх. д. — це середина Тихого океану! Завжди перевіряй пн. ш. чи пд. ш. і сх. д. чи зх. д.`,"topic.4.step.play.title":`Спробуй сам`,"topic.4.step.play.body":`Перетягуй точку, щоб знаходити місця, або обери місто зі списку й перевір його координати.`,"topic.5.step.sixty.title":`Градус має 60 хвилин`,"topic.5.step.sixty.body":`Один градус ділять на 60 хвилин. Хвилини позначають знаком ′. Тому 52°30′ пн. ш. лежить рівно посередині між 52° пн. ш. і 53° пн. ш.`,"topic.5.step.quarters.title":`Половинки й чверті`,"topic.5.step.quarters.body":`30′ — це пів градуса. 15′ — це чверть градуса, а 45′ — три чверті. Ця точка лежить на 52°15′ пн. ш., 21°45′ сх. д.`,"topic.5.step.warsaw.title":`Варшава точно`,"topic.5.step.warsaw.body":`Центр Варшави лежить приблизно на 52°14′ пн. ш., 21°01′ сх. д. На шкільній карті це часто округлюють до 52° пн. ш., 21° сх. д.`,"topic.5.step.compare.title":`Яка точка далі на північ?`,"topic.5.step.compare.body":`52°45′ пн. ш. лежить на північ від 52°15′ пн. ш.: градуси однакові, але хвилин більше. У південній півкулі більше хвилин означає, що місце лежить далі на південь.`,"topic.5.step.play.title":`Спробуй сам`,"topic.5.step.play.body":`Кожне натискання стрілки зсуває точку на 1′, а зі Shift — на 1°. Знайди 52°30′ пн. ш., 20°45′ сх. д.`,"topic.6.step.same-lat.title":`Один бік: віднімаємо`,"topic.6.step.same-lat.body":`Варшава лежить на 52° пн. ш., а Каїр — на 30° пн. ш. Обидва міста на північ від екватора, тож віднімаємо: 52 − 30 = 22°.`,"topic.6.step.opposite-lat.title":`Різні боки: додаємо`,"topic.6.step.opposite-lat.body":`Каїр лежить на 30° пн. ш., а Кейптаун — на 34° пд. ш. Між ними екватор, тож додаємо: 30 + 34 = 64°.`,"topic.6.step.same-lon.title":`З довготою так само`,"topic.6.step.same-lon.body":`Київ лежить на 31° сх. д., а Варшава — на 21° сх. д. Обидва міста на схід від Гринвіча: 31 − 21 = 10°.`,"topic.6.step.opposite-lon.title":`Через Гринвіч: додаємо`,"topic.6.step.opposite-lon.body":`Нью-Йорк лежить на 74° зх. д., а Варшава — на 21° сх. д. Між ними нульовий (Гринвіцький) меридіан: 74 + 21 = 95°.`,"topic.6.step.over-180.title":`Більше ніж 180°? Іди в інший бік`,"topic.6.step.over-180.body":`Токіо лежить на 140° сх. д., а Гонолулу — на 158° зх. д. 140 + 158 = 298°, а це більше ніж 180°. Коротший шлях проходить через меридіан 180°: 360 − 298 = 62°.`,"topic.6.step.play.title":`Спробуй сам`,"topic.6.step.play.body":`Перетягни точку. На скільки градусів широти й довготи вона відрізняється від Варшави (52° пн. ш., 21° сх. д.)?`,"topic.7.step.degree-length.title":`Який завдовжки один градус?`,"topic.7.step.degree-length.body":`Меридіан проходить від полюса до полюса: це приблизно 20 000 км і 180°. Тому один градус уздовж меридіана — це приблизно 111,2 км.`,"topic.7.step.example.title":`Градуси в кілометри`,"topic.7.step.example.body":`Дві точки на одному меридіані, на 50° пн. ш. і 40° пн. ш., розділяють 10°: 10 × 111,2 = 1112 км.`,"topic.7.step.across-equator.title":`Через екватор`,"topic.7.step.across-equator.body":`Від 10° пн. ш. до 20° пд. ш. уздовж меридіана: 10 + 20 = 30°, тож 30 × 111,2 = 3336 км.`,"topic.7.step.reverse.title":`Кілометри в градуси`,"topic.7.step.reverse.body":`Якщо два місця на одному меридіані розділяють 556 км, ділимо: 556 : 111,2 = 5°.`,"topic.7.step.only-meridians.title":`Чому лише вздовж меридіанів?`,"topic.7.step.only-meridians.body":`Паралелі стають коротшими ближче до полюсів, тож один градус уздовж паралелі коротший за 111,2 км (крім екватора). Тому це правило використовують лише вздовж меридіанів.`,"topic.7.step.play.title":`Спробуй сам`,"topic.7.step.play.body":`Переміщуй точку вздовж меридіана. Її відстань від екватора — це її широта × 111,2 км.`,"mode.rehearsal.title":`Пробна контрольна`,"mode.rehearsal.summary":`15 різних запитань, як на справжній контрольній`,"mode.classQuiz.title":`Вікторина для класу`,"mode.classQuiz.summary":`Великі запитання на великому екрані для всього класу`,"mode.lab.title":`Лабораторія дня і ночі`,"mode.lab.summary":`Рухай Сонце й дивись, як змінюється час`,"lab.intro":`Перемістіть точку будь-куди на Землі й дивіться, як змінюються її координати.`,"footer.madeBy":`Автор: {name}`,"footer.mapData":`Дані карти: {source}`,"footer.label":`Про цю сторінку`,"map.stage":`Карта`,"map.chooseView":`Оберіть вигляд`,"map.view.globe":`Глобус`,"map.view.flat":`Карта`,"map.view.cross-section":`Переріз`,"map.flat.label":`Карта світу з паралелями й меридіанами`,"map.flat.hint":`Стрілки рухають точку (Shift — у 10 разів далі). Плюс і мінус змінюють масштаб.`,"map.zoomIn":`Наблизити`,"map.zoomOut":`Віддалити`,"map.zoomHint":`Утримуйте Ctrl і прокрутіть, щоб змінити масштаб`,"map.preset.world":`Світ`,"map.preset.europe":`Європа`,"map.preset.poland":`Польща`,"map.projection":`Тип карти`,"map.projection.grid":`Карта-сітка`,"map.projection.equal-earth":`Equal Earth`,"map.projection.hint":`Карта-сітка: прямі меридіани, легко визначати координати. Equal Earth: країни мають справжній розмір, меридіани вигнуті.`,"map.globe.label":`Глобус, який можна обертати`,"map.globe.hint":`Перетягніть, щоб обернути глобус. Стрілки рухають точку або обертають глобус, коли точку рухати не можна. Плюс і мінус змінюють масштаб; Ctrl і прокрутка теж змінюють масштаб.`,"map.globeZoomIn":`Наблизити глобус`,"map.globeZoomOut":`Віддалити глобус`,"map.turnWest":`Оберніть глобус на захід`,"map.turnEast":`Оберніть глобус на схід`,"map.turnNorth":`Нахиліть глобус на північ`,"map.turnSouth":`Нахиліть глобус на південь`,"map.showPoint":`Показати точку`,"cross.label":`Переріз Землі, що показує широту як кут`,"cross.desc":`Географічна широта — це кут між площиною екватора і лінією від центру Землі до точки: {value}.`,"cross.centre":`центр Землі`,"cross.axis":`земна вісь`,"cross.parallel":`паралель`,"cross.northPole":`Пн.`,"cross.southPole":`Пд.`,"controls.latitude":`Географічна широта`,"controls.longitude":`Географічна довгота`,"controls.readout":`Координати точки`,"controls.decrease":`Зменшити: {name}`,"controls.increase":`Збільшити: {name}`,"places.title":`Місця`,"places.goTo":`Перемістити точку: {place}`,"line.equator":`Екватор 0°`,"line.prime":`Нульовий меридіан 0° (Гринвіч)`,"line.antimeridian":`Меридіан 180°`,"line.tropicCancer":`Тропік Рака`,"line.tropicCapricorn":`Тропік Козерога`,"line.arcticCircle":`Північне полярне коло`,"line.antarcticCircle":`Південне полярне коло`,"hemi.N":`Північна півкуля`,"hemi.S":`Південна півкуля`,"hemi.E":`Східна півкуля`,"hemi.W":`Західна півкуля`,"unit.km":`{n} км`,"place.warsaw":`Варшава`,"place.krakow":`Краків`,"place.gdansk":`Гданськ`,"place.wroclaw":`Вроцлав`,"place.poznan":`Познань`,"place.kyiv":`Київ`,"place.lviv":`Львів`,"place.odesa":`Одеса`,"place.kharkiv":`Харків`,"place.london":`Лондон`,"place.paris":`П
